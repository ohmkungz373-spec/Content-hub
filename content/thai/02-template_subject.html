<script>
/* สลับโหมดมืด/สว่างตามเว็บหลัก (อ่านจาก localStorage "hub-theme" + ฟังการเปลี่ยนแบบสด) */
(function(){
  function g(){try{return localStorage.getItem("hub-theme")}catch(e){return null}}
  function a(v){document.documentElement.setAttribute("data-theme",v);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=v==="light"?"#eef3fb":"#080d1b"}
  a(g()||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
  addEventListener("storage",function(e){if(e.key==="hub-theme"&&e.newValue)a(e.newValue)});
  addEventListener("message",function(e){if(e.data&&e.data.hubTheme)a(e.data.hubTheme)});
})();
</script>

/* ล็อกการเลื่อนหน้าตอนเปิด popup เฉลย + แอนิเมชันของ popup */
body.qz-lock,html.qz-lock{overflow:hidden}
@keyframes qzFade{from{opacity:0}to{opacity:1}}
@keyframes qzPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes qzSheet{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}

/* ===== Quiz: submit-all mode ===== */
.quiz-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  margin:14px 0 0;padding:10px;border-radius:18px;
  background:#fff;border:1px solid #e6eaf4;box-shadow:0 8px 22px rgba(79,70,229,.08);
}
.quiz-bar button{
  font:inherit;font-weight:900;border:0;cursor:pointer;border-radius:13px;
  padding:11px 16px;white-space:nowrap;transition:.16s ease;
}
.quiz-submit-wrap{margin-top:16px}
.quiz-submit-wrap .qb-submit{
  display:block;width:100%;font:inherit;font-weight:900;font-size:17px;border:0;cursor:pointer;
  padding:15px 18px;border-radius:16px;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 10px 24px rgba(79,70,229,.32);transition:.16s ease;
}
.quiz-submit-wrap .qb-submit:hover:not(:disabled){transform:translateY(-2px)}
.quiz-submit-wrap .qb-submit:disabled{opacity:.55;cursor:default;box-shadow:none}
.quiz-submit-wrap .quiz-note{margin:0 2px 10px}
.quiz-bar .qb-reset{background:#eef2ff;color:#3730a3}
.quiz-bar .qb-reset:hover{background:#e0e7ff;transform:translateY(-2px)}
.quiz-bar .qb-score{
  margin-left:auto;text-align:right;line-height:1.2;min-width:0;
  font-weight:900;color:#334155;
}
.quiz-bar .qb-score small{display:block;font-size:11px;font-weight:700;color:#64748b}
.quiz-bar .qb-score b{font-size:20px;color:#3730a3}
.quiz-bar .qb-score.done b{color:#15803d}
.quiz-bar .qb-score.low b{color:#dc2626}
.q .opt{
  display:block;width:100%;text-align:left;margin:7px 0 0;
  border:1.5px solid #cbd5e1;background:#fff;padding:10px 13px;border-radius:12px;
  cursor:pointer;transition:.15s;font:inherit;color:inherit;
}
.q .opt:hover:not(:disabled){background:#eef2ff;border-color:#a5b4fc}
.q .opt.picked{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.12);font-weight:800}
.q .opt:disabled{cursor:default;opacity:1}
.q .opt.right{background:#dcfce7;border-color:#22c55e;color:#14532d;font-weight:800}
.q .opt.wrong{background:#fee2e2;border-color:#ef4444;color:#7f1d1d;font-weight:800}
.q.unanswered{border-color:#f59e0b!important;box-shadow:0 0 0 3px rgba(245,158,11,.18)!important}
.q .answer{margin-top:10px;padding:8px 12px;background:#f8fafc}
.q.is-right .answer{background:#f0fdf4}
.q.is-wrong .answer{background:#fef2f2}
.quiz-note{display:none;margin:10px 2px 0;font-size:13px;font-weight:800;color:#b45309}
.quiz-note.show{display:block}
@media(max-width:560px){
  .quiz-bar{gap:7px;padding:8px}
  .quiz-bar button{padding:10px 11px;font-size:13.5px}
  .quiz-bar .qb-score b{font-size:17px}
  .quiz-bar .qb-score small{font-size:10px}
}

/* คำนำ = กล่องภาพรวม */

/* กล่องเนื้อหา: การ์ดมีเลขลำดับ */

html body .page .sec-card:hover{transform:none!important;box-shadow:0 8px 22px rgba(0,0,0,.14)!important}

html body .page .sec-card h3{

  font-size:18px!important;font-weight:700!important;line-height:1.35!important;color:var(--ink)!important;
  border-bottom:1px solid var(--line)!important}
html body .page .sec-card h3::before{
  content:counter(sec,decimal-leading-zero)!important;flex:none;display:grid!important;place-items:center;
  width:38px!important;min-width:38px;height:38px!important;border-radius:13px!important;

html body .page .sec-card ul{list-style:none!important;padding:0!important;margin:0!important}
html body .page .sec-card li{
  position:relative;margin:0!important;padding:12px 0 12px 26px;

html body .page .sec-card li+li{border-top:1px dashed color-mix(in srgb,var(--line) 80%,transparent)}
html body .page .sec-card li::before{
  content:"";position:absolute;left:4px;top:23px;width:8px;height:8px;border-radius:50%;

/* จุดที่ควรจำ */

/* ═════════ 2) ปุ่ม "เลือกโหมดใหม่": เข้ม ชัด อยากกด ═════════ */
html body .quiz .qx-link.qx-swap{
  display:flex!important;align-items:center;justify-content:center;gap:10px;

  box-shadow:0 12px 26px rgba(37,99,235,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.18)!important;

html body .quiz .qx-link.qx-swap:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 16px 32px rgba(37,99,235,.6),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.18)!important}

html[data-theme="light"] body .qx-review-sheet{--gt:#15803d;--rt:#be123c;--bt:#1d4ed8;--vt:#6d28d9}

/* หัว */
html body .qx-review-head{background:linear-gradient(135deg,rgba(37,99,235,.3),rgba(6,182,212,.12))!important;padding:18px 18px 16px!important}

html body .qx-review-head h4{font-size:24px!important;font-weight:800!important;margin:4px 0 5px!important}
html body .qx-review-kicker{font-size:11px!important;font-weight:800;letter-spacing:.8px;color:var(--bt)!important}

html body .qx-review-summary-score{font-size:17px!important;font-weight:800;color:var(--bt)!important}

/* แท็บ: ทั้งหมด=ฟ้า · ตอบถูก=เขียว · ตอบผิด=แดง */
html body .qx-review-filters{display:flex!important;gap:8px!important;flex-wrap:nowrap!important;padding:12px 14px!important;background:var(--panel);border-bottom:1px solid var(--line)}
html body .qx-review-filter{
  --c:#3b82f6;--ct:var(--bt);--g1:#2563eb;--g2:#0ea5e9;
  flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 10px!important;
  border-radius:999px!important;font-size:14.5px!important;font-weight:700;white-space:nowrap;cursor:pointer;
  color:var(--ct)!important;background:color-mix(in srgb,var(--c) 12%,transparent)!important;
  border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent)!important;transition:transform .12s,box-shadow .15s}
html body .qx-review-filter:nth-child(2){--c:#22c55e;--ct:var(--gt);--g1:#15803d;--g2:#22c55e}
html body .qx-review-filter:nth-child(3){--c:#ef4444;--ct:var(--rt);--g1:#dc2626;--g2:#f87171}
html body .qx-review-filter[aria-pressed="true"]{
  color:#fff!important;border-color:transparent!important;
  background:linear-gradient(135deg,var(--g1),var(--g2))!important;
  box-shadow:0 8px 18px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}
html body .qx-review-filter:active{transform:scale(.96)}
html body .qx-review-filter .count{
  display:inline-grid!important;place-items:center;min-width:24px;height:24px;margin:0!important;padding:0 7px;border-radius:99px;
  font-size:12.5px!important;font-weight:800;color:inherit;background:color-mix(in srgb,var(--c) 22%,transparent)}
html body .qx-review-filter[aria-pressed="true"] .count{background:rgba(255,255,255,.26)}

html body .qx-review-list{padding:14px 14px 24px!important;gap:14px!important;background:color-mix(in srgb,#3b82f6 5%,var(--bg))}

/* การ์ดโจทย์ */

  box-shadow:0 8px 22px rgba(0,0,0,.18)!important}

html body .qx-review-list .qx-rv.bad{border-color:color-mix(in srgb,#ef4444 38%,var(--line))!important;background:linear-gradient(180deg,color-mix(in srgb,#ef4444 8%,var(--panel)),var(--panel) 65%)!important}
html[data-theme="light"] body .qx-review-list .qx-rv.ok{background:linear-gradient(180deg,#f0fdf4,#fff 65%)!important}
html[data-theme="light"] body .qx-review-list .qx-rv.bad{background:linear-gradient(180deg,#fff1f2,#fff 65%)!important}

html body .qx-review-list .qx-rv-h{display:flex;align-items:flex-start!important;gap:12px!important}
html body .qx-review-list .qx-no{flex:none;width:38px!important;height:38px!important;border-radius:13px!important;font-size:14px!important;font-weight:800;color:#fff!important;
  background:linear-gradient(135deg,#16a34a,#22c55e)!important;box-shadow:0 6px 14px rgba(34,197,94,.35)}
html body .qx-review-list .qx-rv.bad .qx-no{background:linear-gradient(135deg,#dc2626,#f87171)!important;box-shadow:0 6px 14px rgba(239,68,68,.35)}
html body .qx-review-list .qx-rv-q{flex:1;min-width:0;padding-top:6px;font-size:16px!important;font-weight:700;line-height:1.5;color:var(--ink)!important}

html body .qx-review-list .qx-rv-status{
  flex:none;display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:5px 12px!important;border-radius:99px!important;
  font-size:12.5px!important;font-weight:800;border:1px solid transparent}
html body .qx-review-list .qx-rv-status.ok{background:rgba(34,197,94,.16)!important;color:var(--gt)!important;border-color:rgba(34,197,94,.45)}
html body .qx-review-list .qx-rv-status.bad{background:rgba(239,68,68,.15)!important;color:var(--rt)!important;border-color:rgba(239,68,68,.45)}
html body .qx-review-list .qx-rv-status.ok::before{content:"✓"}
html body .qx-review-list .qx-rv-status.bad::before{content:"✕"}

/* คำตอบของคุณ / เฉลย */
html body .qx-review-list .qx-rv-a{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;margin:14px 0 0!important}

html body .qx-review-list .qx-rv-answer-row{display:flex;flex-direction:column;align-items:flex-start;gap:4px!important;padding:11px 14px!important;border-radius:14px!important;border:1.5px solid var(--line)!important;background:transparent!important}
html body .qx-review-list .qx-rv-label{display:flex;align-items:center;font-size:12px!important;font-weight:800;letter-spacing:.3px}

html body .qx-review-list .qx-rv-answer{font-size:15.5px!important;line-height:1.5;font-weight:700}
html body .qx-review-list .qx-rv-answer b,html body .qx-review-list .qx-rv-answer .r,html body .qx-review-list .qx-rv-answer .g{font-weight:800;color:var(--ink)!important}

html body .qx-review-list .qx-rv-answer-row.yours.selected-ok,
html body .qx-review-list .qx-rv-answer-row.correct{background:color-mix(in srgb,#22c55e 12%,var(--panel))!important;border-color:rgba(34,197,94,.55)!important}
html body .qx-review-list .qx-rv-answer-row.yours.selected-ok .qx-rv-label,
html body .qx-review-list .qx-rv-answer-row.correct .qx-rv-label{color:var(--gt)!important}
html body .qx-review-list .qx-rv-answer-row.yours.selected-ok .qx-rv-answer b,
html body .qx-review-list .qx-rv-answer-row.correct .qx-rv-answer b{color:var(--gt)!important}

html[data-theme="light"] body .qx-review-list .qx-rv-answer-row.correct{background:#f0fdf4!important}

  setH("subjLogo",'<span class="lg-ico">'+hi(icon)+'</span><span class="lg-txt">'+escH(S.logo||name)+'</span>');

  set("subjBadge",S.badge||("บทเรียน · "+name));

  set("subjDesc",S.desc||"");
  setH("subjFooter",'<span class="ft-ico">'+hi(icon)+'</span> '+escH(S.footer||(name+" · เรียนให้เข้าใจ ทบทวนได้ทุกเมื่อ")));
  const sr=document.getElementById("search");
  if(sr) sr.placeholder="ค้นหาใน "+name+(S.searchHint?" เช่น "+S.searchHint+"...":"");
})();

const isQuizTopic=(t,i)=> i===topics.length-1;   // บทสุดท้ายเป็นหน้า Quiz เสมอ
let currentTopic=0;                               // บทที่เปิดอยู่ (ใช้ไฮไลท์ในเมนู)

/* ---------- เมนูบทเรียน ---------- */
const menu=document.getElementById("menuList");
function buildMenu(list=topics){
 menu.innerHTML="";
 let lastPart="";
 if(!list.length){
   const empty=document.createElement("div");
   empty.className="menu-section";
   empty.textContent="ไม่พบหน้าที่ค้นหา";
   menu.appendChild(empty);
   return;
 }
 list.forEach((t)=>{
   const original=topics.indexOf(t);
   const title=t.title.trim();

   // หัวกลุ่ม: ใช้ t.part ก่อน ถ้าไม่มีให้แยกจาก "หมวด · ชื่อบท"; บท Quiz จัดเข้ากลุ่ม Quiz
   let part=t.part ? t.part : (title.includes("·") ? title.split("·")[0].trim() : "");
   if(!t.part && (/^(mini\s*)?quiz\b/i.test(title) || isQuizTopic(t,original))) part="Quiz";

   if(part!==lastPart){
     const label=document.createElement("div");
     label.className="menu-section";
     label.textContent=part || "เนื้อหาทั้งหมด";
     menu.appendChild(label);
     lastPart=part;
   }

   const b=document.createElement("button");
   b.className="topic-btn"+(original===currentTopic?" active":"");
   b.dataset.topicIndex=original;

   const cleanTitle=(!t.part && title.includes("·"))
     ? title.split("·").slice(1).join("·").trim()
     : title;
   const cleanSub=(t.sub||"").replace(/^บทย่อย:\s*/,"").trim();

   b.innerHTML=`<span class="topic-num">${String(original+1).padStart(2,"0")}</span>
   <span class="topic-copy">
     <span class="topic-label">${cleanTitle}</span>
     <span class="topic-sub">${cleanSub}</span>
   </span>
   <span class="topic-arrow">›</span>`;

   b.onclick=()=>{showTopic(original);closeMenu()};
   menu.appendChild(b);
 });
}
buildMenu();

function filterMenu(){
 const q=document.getElementById("search").value.toLowerCase();
 buildMenu(topics.filter(t=>((t.title||"")+" "+(t.part||"")+" "+(t.sub||"")+" "+(t.intro||"")).toLowerCase().includes(q)));
}

/* ---------- แสดงบทเรียน ---------- */
function renderFormula(text){
 if(!text) return "";
 const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
 const rows=lines.map(line=>{
  if(line.includes("=")){
   return `<div class="f-row"><div class="f-eq">${line}</div></div>`;
  }
  if(line.includes("|")){
   const chips=line.split("|").map(seg=>`<span class="f-chip">${seg.trim()}</span>`).join("");
   return `<div class="f-row"><div class="f-chips">${chips}</div></div>`;
  }
  const ci=line.indexOf(":");
  if(ci!==-1){
   const label=line.slice(0,ci).trim();
   const rest=line.slice(ci+1).trim();
   const items=rest.split(",").map(x=>x.trim()).filter(Boolean);
   if(items.length>1){
    const chips=items.map(x=>`<span class="f-chip">${x}</span>`).join("");
    return `<div class="f-row"><span class="f-label">${label}</span><div class="f-chips">${chips}</div></div>`;
   }
   return `<div class="f-row f-plain"><span>▸</span><span><b>${label}:</b> ${rest}</span></div>`;
  }
  return `<div class="f-row f-plain"><span>▸</span><span>${line}</span></div>`;
 }).join("");
 return `<div class="f-title">${hi("calc")} สูตร / หลักจำ</div>${rows}`;
}
function showTopic(i){
 const t=topics[i];
 if(!t) return;
 const last=i===topics.length-1;
 let body="";
 if(t.sections && t.sections.length){
  t.sections.forEach((s,n)=>{
   try{
    const items=Array.isArray(s[1])?s[1]:(s[1]?[s[1]]:[]);   // รับทั้ง array และ string เดี่ยว ๆ
    body+=`<section class="sec-card"><h3>${s[0]||""}</h3>${items.length?`<ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${s[2]||""}</section>`;
   }catch(err){
    console.error("[บท "+(i+1)+" กล่อง "+(n+1)+"]",err);
    body+=`<section class="sec-card"><h3>${hi("warn")} กล่องนี้ข้อมูลผิดรูปแบบ</h3><p class="small">หน้า ${i+1} กล่องที่ ${n+1}</p></section>`;
   }
  });
 }
 let quiz="";
 if(last){
  quiz=`<div class="quiz"><div id="quizArea"></div></div>`;
 }
 document.getElementById("page").innerHTML=`
  <div class="topic-head">
   <div class="topic-no">${i+1}</div>
   <div><h2>${t.title}</h2>
   ${t.sub?`<div class="subtitle">${t.sub}</div>`:""}</div>
  </div>
  ${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${body}
  ${t.formula?`<div class="formula">${renderFormula(t.formula)}</div>`:""}
  ${t.note?`<div class="note"><b>${hi("star",{fill:1})} จุดที่ควรจำ</b><br>${t.note}</div>`:""}

const QZ_STAR='<svg class="hi" viewBox="0 0 24 24"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 3 1.1-6.2L3 9.7l6.2-.9z"/></svg>';
// ข้อที่มีตัวเลือกแบบ "ถูกทุกข้อ / ข้อ ก และ ข" จะไม่สลับตัวเลือก (กันคำตอบเพี้ยน)
const QZ_FIX=/ทั้งหมด|ทุกข้อ|ไม่มีข้อ|ถูกทั้ง|ผิดทั้ง|ข้อ\s*[กขคงจ](?![ก-๙])|ข้อ\s*[A-Da-d](?![A-Za-z])|all of|none of|both/i;

let _qzKey="";

/* ----- หน้าเริ่มต้น ----- */
// โหมดฝึก = สุ่มบางส่วน (เน้นข้อที่เคยพลาด) · โหมดสอบ = ครบทุกข้อ
function qzPracN(N){
  if(typeof quizPracticeCount==="number"&&quizPracticeCount>0) return Math.min(N,quizPracticeCount);   // ตั้งจากบล็อก ③
  return N<=5?N:Math.min(N,15,Math.max(5,Math.round(N*0.4)));
}

/* ----- เริ่มทำ ----- */
function qzBuild(only,mode){
  const qs=getQuiz(), N=qs.length;
  let idxs=qs.map((_,n)=>n);
  if(only&&only.length) idxs=idxs.filter(n=>only.includes(n));
  else if(mode==="practice"){
    const n=qzPracN(N);
    if(n<N){   // สุ่ม n ข้อ โดยเอาข้อที่เคยพลาดขึ้นก่อนไม่เกินครึ่งหนึ่ง
      const wr=(qzSt.get().wrong||[]).filter(x=>x<N), pool=qzShuf(idxs);
      const w=pool.filter(x=>wr.includes(x)), r=pool.filter(x=>!wr.includes(x)), h=Math.ceil(n/2);
      idxs=w.slice(0,h).concat(r,w.slice(h)).slice(0,n).sort((a,b)=>a-b);
    }
  }
  if(QZ.shuffle) idxs=qzShuf(idxs);
  QZ.items=idxs.map(n=>{
    const q=qs[n], right=String(q[5]==null?"":q[5]).trim().toUpperCase();
    let opts=QL.map((l,k)=>({t:q[k+1],ok:l===right})).filter(o=>o.t!=null&&o.t!=="");
    if(QZ.shuffle&&!opts.some(o=>QZ_FIX.test(String(o.t)))) opts=qzShuf(opts);
    return {n,q:q[0],opts,why:q[6]||"",pick:null,lock:false};
  });
}
function qzStart(mode,only){
  QZ.mode=mode; QZ.only=(only&&only.length)?only:null; QZ.i=0; QZ.sec=0; QZ.streak=0; QZ.maxStreak=0;
  QZ.submitted=false; QZ.stopped=false; QZ.confirm=false; QZ.view="play"; QZ._bar=0;
  qzCdKill(); qzCloseReview();
  qzBuild(QZ.only,mode);
  clearInterval(QZ.tm);
  QZ.tm=setInterval(()=>{
    const el=document.getElementById("qzTime");
    if(!el){ clearInterval(QZ.tm); return; }
    const cu=QZ.items[QZ.i];
    if(document.hidden||QZ.submitted||QZ.stopped||(QZ.mode==="practice"&&cu&&cu.lock)) return;   // พักเวลาตอนดูเฉลย
    QZ.sec++; el.textContent=qzFmt(QZ.sec);
  },1000);
  qzPlay(true); qzScrollTo("quizArea");
}

/* ----- หน้าทำข้อสอบ ----- */
const QZ_CD=3;   // วินาทีนับถอยหลังก่อนไปข้อถัดไป (โหมดฝึก)
function qzCdKill(){ clearTimeout(QZ.autoT); QZ.cd=false; }

  }).join("");
  let fb="";   // ไม่แสดงเฉลย/คำอธิบายทันที — ดูได้ที่ปุ่มทบทวนหลังจบข้อสอบ

    </div>

  }

      </div>
      <div class="qx-bar"><i id="qxBarI" style="width:${from}%"></i></div>
      <div class="qx-barrow">
        <span>${prac?`ทำแล้ว ${answered}/${N} · ถูก ${okc}`:`ตอบแล้ว ${answered}/${N}`}</span>
      </div>
      ${dots}
    </div>
    <div class="qx-card">

  const bi=document.getElementById("qxBarI");
  if(bi&&from!==pct){ void bi.offsetWidth; bi.style.width=pct+"%"; }   // บังคับ reflow แล้วให้แถบวิ่งไปค่าใหม่
  const dc=document.getElementById("qxDots"), cur=dc&&dc.querySelector(".cur");
  if(dc&&cur) dc.scrollLeft=cur.offsetLeft-dc.clientWidth/2+cur.clientWidth/2;

/* นับถอยหลังไปข้อถัดไป (โหมดฝึก) */
function qzCdRun(it){
  let n=QZ_CD;
  const tick=()=>{
    if(!QZ.cd||QZ.view!=="play"||QZ.items[QZ.i]!==it) return;
    n--;
    if(n<=0){ QZ.cd=false; qzNext(); return; }
    const a=document.getElementById("qxCdN"); if(a) a.textContent=n;
    QZ.autoT=setTimeout(tick,1000);
  };
  QZ.autoT=setTimeout(tick,1000);
}
function qzCdStop(){
  if(!QZ.cd) return;
  qzCdKill();
  document.querySelectorAll("#qxDock .qx-btn.auto").forEach(x=>x.classList.remove("auto"));
}
function qzCancelAuto(){ qzCdStop(); }
function qzQuit(){ clearInterval(QZ.tm); qzCdKill(); QZ.confirm=false; qzIntro(); qzScrollTo("quizArea"); }
function qzGo(k){
  if(k<0||k>=QZ.items.length) return;
  qzCdKill(); QZ.i=k; qzPlay(true); qzScrollTo("quizArea");
}
function qzNext(){
  qzCdKill();
  if(QZ.i>=QZ.items.length-1){ if(QZ.mode==="practice") qzFinish(); else qzAsk(); return; }
  qzGo(QZ.i+1);
}
function qzPick(k){
  const it=QZ.items[QZ.i]; if(!it||QZ.submitted) return;
  if(QZ.mode==="practice"){
    if(it.lock) return;
    it.pick=k; it.lock=true;
    const ok=it.opts[k].ok;
    QZ.streak=ok?QZ.streak+1:0; QZ.maxStreak=Math.max(QZ.maxStreak,QZ.streak);
    // ตอบครบทุกข้อแล้ว → หยุดเวลาทันที
    if(QZ.items.every(x=>x.lock)){ QZ.stopped=true; clearInterval(QZ.tm); }
    try{ navigator.vibrate&&navigator.vibrate(ok?12:[25,40,25]); }catch(e){}
    qzCdKill(); QZ.cd=true;       // ตอบแล้ว → เริ่มนับถอยหลัง 3 วินาที
    qzPlay(false);
    qzCdRun(it);
    const dk=document.getElementById("qxDock"); if(dk) dk.scrollIntoView({behavior:"smooth",block:"nearest"});

}

function qzBack(){

/* ----- ส่งคำตอบ + สรุปผล ----- */
function qzFinish(){
  if(QZ.mode==="exam"&&QZ.items.some(x=>x.pick==null)) return qzAsk();   // ตอบไม่ครบ = ส่งไม่ได้
  QZ.confirm=false; QZ.submitted=true; clearInterval(QZ.tm); qzCdKill();
  const T=QZ.items.length; let ok=0,skip=0;
  QZ.items.forEach(x=>{ if(x.pick==null) skip++; else if(qzOk(x)) ok++; });
  const wrongIdx=QZ.items.filter(x=>!qzOk(x)).map(x=>x.n);
  const pct=T?Math.round(ok/T*100):0;
  const st=qzSt.get(), prev=st.best||null; let newBest=false;
  if(!QZ.only){
    st.attempts=(st.attempts||0)+1;
    if(!prev||pct>prev.pct||(pct===prev.pct&&QZ.sec<prev.sec)){ newBest=!!prev&&pct>prev.pct; st.best={score:ok,total:T,pct,sec:QZ.sec}; }
    st.wrong=wrongIdx;
  } else st.wrong=(st.wrong||[]).filter(n=>wrongIdx.includes(n));
  qzSt.set(st);
  QZ.res={T,ok,skip,wrong:T-ok-skip,pct,newBest,prev};
  QZ.view="result"; QZ.filter="all";
  qzResult();
  if(pct>=80) qzConfetti();
  qzScrollTo("quizArea");
}
function qzResult(){
  const area=qzArea(); if(!area) return;
  const R=QZ.res, prac=QZ.mode==="practice";
  const m=R.pct===100?["trophy","เต็มทุกข้อ! สุดยอดมาก"]:R.pct>=80?["spark","เก่งมาก ทำได้ดีมาก"]:R.pct>=60?["thumb","ทำได้ดี ขยับอีกนิดก็เยี่ยม"]:R.pct>=50?["target","ทำต่ออีกนิด จะเก่งขึ้นแน่นอน"]:["flame","ลองดูเฉลยแล้วทำใหม่อีกครั้ง"];
  const col=R.pct>=80?"#22c55e":R.pct>=50?"#38bdf8":"#f59e0b";
  const C=2*Math.PI*52, off=C*(1-R.pct/100);
  const avg=R.T?Math.round(QZ.sec/R.T):0;
  QZ.reviewOpen=false;
  area.innerHTML=`<div class="qx qx-in">
   <div class="qx-res">
    <div class="qx-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="bg"/><circle cx="60" cy="60" r="52" class="fg" stroke="${col}" style="--c:${C.toFixed(1)};--o:${off.toFixed(1)}" stroke-dasharray="${C.toFixed(1)}"/></svg>
     <div class="qx-ring-t"><b>${R.pct}%</b><span>${R.ok}/${R.T} ข้อ</span></div></div>
    <div class="qx-stars">${[1,2,3].map(n=>`<span class="${n<=(R.pct>=90?3:R.pct>=70?2:R.pct>=50?1:0)?"on":""}" style="animation-delay:${.5+n*.18}s">${QZ_STAR}</span>`).join("")}</div>
    <div class="qx-res-m">${hi(m[0])}<b>${m[1]}</b></div>
    ${R.newBest?`<div class="qx-chip gold">${hi("trophy")} สถิติใหม่! (เดิม ${R.prev.pct}%)</div>`:""}
    <div class="qx-stats">
      <div><b class="g">${R.ok}</b><span>ถูก</span></div>
      <div><b class="r">${R.wrong+R.skip}</b><span>ผิด/ไม่ตอบ</span></div>
      <div><b>${qzFmt(QZ.sec)}</b><span>เวลาที่ใช้</span></div>
      <div><b>${prac?"x"+QZ.maxStreak:avg+"s"}</b><span>${prac?"คอมโบสูงสุด":"เฉลี่ย/ข้อ"}</span></div>
    </div>
    <div class="qx-row qx-result-actions">
     <button type="button" class="qx-btn pri qx-review-trigger" onclick="qzOpenReview()"><span class="qx-review-trigger-ico">${hi("check",{c:"#fff"})}</span><span class="qx-review-trigger-copy"><b>ดูเฉลยคำตอบ</b><small>ตรวจคำตอบและคำอธิบายทุกข้อ</small></span><span class="qx-review-trigger-arrow" aria-hidden="true">›</span></button>
     <button type="button" class="qx-btn" onclick="qzStart('${QZ.mode}')">${hi("refresh",{c:"currentColor"})} ทำใหม่</button>
    </div>
    <button type="button" class="qx-link qx-swap" onclick="qzQuit()">${hi("grid",{c:"currentColor"})} เลือกโหมดใหม่</button>
   </div>
  </div>`;
}
function qzReviewHtml(){
  return QZ.items.map((x,k)=>{
    const ok=qzOk(x), ci=x.opts.findIndex(o=>o.ok);
    const yourAnswer=x.pick==null?'<span class="r">ไม่ได้ตอบ</span>':`<span class="${ok?"g":"r"}">${QL[x.pick]}. ${x.opts[x.pick].t}</span>`;
    return `<article class="qx-rv ${ok?"ok":"bad"}" data-qz-category="${x.pick==null?"skip":(ok?"correct":"wrong")}">
      <div class="qx-rv-h"><span class="qx-no">${String(k+1).padStart(2,"0")}</span><div class="qx-rv-q">${x.q}</div><span class="qx-rv-status ${ok?"ok":"bad"}">${ok?"ตอบถูก":(x.pick==null?"ยังไม่ตอบ":"ตอบผิด")}</span></div>
      <div class="qx-rv-a">
        <div class="qx-rv-answer-row yours ${x.pick==null?"unanswered":(ok?"selected-ok":"selected-bad")}"><span class="qx-rv-label">คำตอบของคุณ</span><span class="qx-rv-answer"><b>${yourAnswer}</b></span></div>
        <div class="qx-rv-answer-row correct"><span class="qx-rv-label">เฉลยที่ถูกต้อง</span><span class="qx-rv-answer"><b>${ci>=0?QL[ci]+". "+x.opts[ci].t:"-"}</b></span></div>
      </div>
      ${x.why?`<div class="qx-exp"><div class="qx-exp-h"><span class="qx-exp-ico">${hi("bulb")}</span><b>คำอธิบาย</b></div><div class="qx-exp-t">${x.why}</div></div>`:""}
    </article>`;
  }).join("");
}
function qzOpenReview(){
  if(QZ.view!=="result"||QZ.reviewOpen) return;
  QZ.reviewOpen=true;
  const area=qzArea(); if(!area) return;
  const R=QZ.res||{T:QZ.items.length,ok:QZ.items.filter(qzOk).length};
  document.body.insertAdjacentHTML("beforeend",`<div class="qx-review-ov" id="qxReviewModal" role="dialog" aria-modal="true" aria-labelledby="qxReviewTitle" onclick="if(event.target===this)qzCloseReview()">
    <section class="qx-review-sheet">
      <div class="qx-review-drag" aria-label="ปัดลงเพื่อปิดหน้าต่างเฉลย"><span></span></div>
      <div class="qx-review-head"><div class="qx-review-heading"><span class="qx-review-kicker">ทบทวนผลการทำแบบทดสอบ</span><h4 id="qxReviewTitle">เฉลยคำตอบ</h4><p>ดูคำตอบที่เลือก เทียบกับคำตอบที่ถูกต้องได้ทีละข้อ</p><div class="qx-review-summary"><span class="qx-review-summary-score">${R.ok} / ${R.T}</span><span>ข้อที่ตอบถูก</span></div></div><button type="button" class="qx-review-close" onclick="qzCloseReview()" aria-label="ปิดหน้าต่างเฉลย"><span aria-hidden="true">×</span></button></div>
      <div class="qx-review-filters" role="group" aria-label="แบ่งประเภทเฉลย">
        <button type="button" class="qx-review-filter" aria-pressed="true" onclick="qzReviewFilter('all',this)">ทั้งหมด <span class="count">${R.T}</span></button>
        <button type="button" class="qx-review-filter" aria-pressed="false" onclick="qzReviewFilter('correct',this)">ตอบถูก <span class="count">${QZ.items.filter(x=>x.pick!=null&&qzOk(x)).length}</span></button>
        <button type="button" class="qx-review-filter" aria-pressed="false" onclick="qzReviewFilter('wrong',this)">ตอบผิด <span class="count">${QZ.items.filter(x=>x.pick!=null&&!qzOk(x)).length}</span></button>
      </div>
      <div class="qx-review-list">${qzReviewHtml()}</div>
    </section>
  </div>`);
  document.documentElement.classList.add("qz-review-open"); document.body.classList.add("qz-review-open");
  const modal=document.getElementById("qxReviewModal"), sheet=modal&&modal.querySelector(".qx-review-sheet");
  const close=modal&&modal.querySelector(".qx-review-close"); if(close) close.focus({preventScroll:true});
  // คำอธิบายมีสถานะเปิด/ปิดชัดเจนเมื่อแตะ
  if(modal) modal.querySelectorAll(".qx-review-list details").forEach(d=>{
    const label=d.querySelector(".qx-rv-summary-text");
    const sync=()=>{if(label) label.textContent=d.open?"ซ่อนคำอธิบาย":"ดูคำอธิบายข้อนี้";};
    d.addEventListener("toggle",sync); sync();
  });
  // ปัดลงปิด: จับตรงไหนของหน้าต่างก็ได้ (ในรายการต้องเลื่อนถึงบนสุดก่อน) ตามนิ้วแบบลื่น ๆ + ปล่อยเร็ว ๆ ก็ปิด
  if(sheet){
    const list=modal.querySelector(".qx-review-list");
    let y0=0,x0=0,dy=0,t0=0,st=0,last=0,vy=0;   // st: 0 ไม่ลาก · 1 รอดูทิศทาง · 2 กำลังลาก
    const dim=v=>{ modal.style.background="rgba(3,8,22,"+Math.max(.1,.78*(1-v/(sheet.offsetHeight*.9)))+")"; };
    sheet.addEventListener("touchstart",e=>{
      if(e.touches.length!==1){ st=0; return; }
      const t=e.touches[0]; y0=t.clientY; x0=t.clientX; dy=0; t0=last=Date.now(); vy=0;
      st=(!list.contains(e.target)||list.scrollTop<=0)?1:0;
    },{passive:true});
    sheet.addEventListener("touchmove",e=>{
      if(!st) return;
      const t=e.touches[0], ddy=t.clientY-y0, ddx=t.clientX-x0;
      if(st===1){
        if(ddy>6&&ddy>Math.abs(ddx)){ st=2; sheet.style.transition="none"; }
        else if(ddy<-6||Math.abs(ddx)>10){ st=0; return; }
        else return;
      }
      const now=Date.now(); vy=(ddy-dy)/Math.max(1,now-last); last=now;
      dy=Math.max(0,ddy);
      if(e.cancelable) e.preventDefault();
      sheet.style.transform="translate3d(0,"+dy+"px,0)"; dim(dy);
    },{passive:false});
    const end=()=>{
      if(st!==2){ st=0; return; } st=0;
      sheet.style.transition="transform .26s cubic-bezier(.2,.8,.2,1)";
      if(dy>sheet.offsetHeight*.22||vy>.55){
        sheet.style.transform="translate3d(0,105%,0)"; modal.style.transition="background .26s"; modal.style.background="rgba(3,8,22,0)";
        setTimeout(qzCloseReview,240);
      } else { sheet.style.transform=""; modal.style.background=""; }
    };
    sheet.addEventListener("touchend",end,{passive:true});
    sheet.addEventListener("touchcancel",end,{passive:true});
  }
}
function qzReviewFilter(kind,button){
  const modal=document.getElementById("qxReviewModal"); if(!modal) return;
  modal.querySelectorAll(".qx-review-filter").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));
  modal.querySelectorAll(".qx-review-list .qx-rv").forEach(card=>{
    card.hidden=kind!=="all"&&card.dataset.qzCategory!==kind;
  });
}
function qzCloseReview(){
  QZ.reviewOpen=false;
  const modal=document.getElementById("qxReviewModal"); if(modal) modal.remove();
  document.documentElement.classList.remove("qz-review-open"); document.body.classList.remove("qz-review-open");
}

document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&QZ.reviewOpen) qzCloseReview(); });
function qzConfetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box=document.createElement("div"); box.className="qx-conf";
  const cols=["#38bdf8","#22c55e","#fbbf24","#f472b6","#a78bfa","#fb923c"];
  for(let i=0;i<44;i++){
    const p=document.createElement("i");
    p.style.cssText="left:"+(Math.random()*100)+"%;background:"+cols[i%cols.length]+";animation-delay:"+(Math.random()*.5)+"s;animation-duration:"+(1.8+Math.random()*1.4)+"s;transform:rotate("+(Math.random()*360)+"deg)";
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(),3600);
}

/* คีย์ลัด: 1-4 หรือ A-D เลือกคำตอบ · ← → เปลี่ยนข้อ */
document.addEventListener("keydown",function(e){
  if(QZ.view!=="play"||QZ.submitted||QZ.confirm||e.metaKey||e.ctrlKey||e.altKey) return;
  if(!qzArea()) return;
  const t=e.target; if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
  const it=QZ.items[QZ.i]; if(!it) return;
  const k=String(e.key).toLowerCase();
  let idx=-1;
  if(k.length===1){ idx="1234".indexOf(k); if(idx<0) idx="abcd".indexOf(k); }
  if(idx>=0&&idx<it.opts.length){ qzPick(idx); return; }
  if(k==="arrowright"){ if(QZ.mode==="exam"?QZ.i<QZ.items.length-1:it.lock) qzNext(); }
  else if(k==="arrowleft"){ if(QZ.i>0) qzGo(QZ.i-1); }
  else if(k==="enter"&&(!t||t===document.body)&&QZ.mode==="practice"&&it.lock) qzNext();
});
/* ปัดซ้าย/ขวาที่การ์ดคำถามเพื่อเปลี่ยนข้อ */
(function(){
  let x0=0,y0=0,on=false;
  document.addEventListener("touchstart",e=>{
    const c=e.target.closest&&e.target.closest(".qx-card"); on=!!c&&QZ.view==="play";
    if(on){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!on) return; on=false;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)<70||Math.abs(dy)>45||QZ.confirm) return;
    const it=QZ.items[QZ.i]; if(!it) return;
    const more=QZ.i<QZ.items.length-1;
    if(dx<0){ if(more&&(QZ.mode==="exam"||it.lock)) qzNext(); }
    else if(QZ.mode==="exam"&&QZ.i>0) qzGo(QZ.i-1);
  },{passive:true});
})();
let qzSubmitted=false;   // (คงไว้เพื่อความเข้ากันได้กับโค้ดเก่า)
function getQuiz(){
  if(typeof quizQuestions!=="undefined"&&Array.isArray(quizQuestions)) return quizQuestions;
  if(typeof quizBanks!=="undefined"&&quizBanks.length) return quizBanks[quizBanks.length-1].questions||[];
  return [];
}

/* ---------- เชื่อมกับ CONTENT HUB (ปุ่ม ⌂ = กลับไปรายการบทเรียนของวิชานี้) ---------- */
function goHomeFromSubject(){
 closeMenu();
 try{
  if(window.parent && window.parent!==window){
   if(typeof window.parent.goHome==="function"){ window.parent.goHome(); return; }
   window.parent.postMessage({type:"content-hub-home"},"*"); return;
  }
 }catch(e){
  try{ window.parent.postMessage({type:"content-hub-home"},"*"); return; }catch(_){}
 }
 window.location.href = location.protocol==="file:" ? "index.html" : "/";
}
function openMenu(){document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show")}
function closeMenu(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show")}

document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  const ex=document.getElementById("exModal");
  if(ex&&ex.classList.contains("show")) closeExplain();
});

/* ---------- ตรวจข้อมูลตอนโหลด (เปิด Console ดูคำเตือนได้; ไม่กระทบหน้าเว็บ) ---------- */
(function validateSubjectData(){
  const w=m=>console.warn("[ตรวจข้อมูล] "+m);
  if(!topics.length) return w("ไม่มีบทเรียนเลย");
  const lt=topics[topics.length-1];
  if(lt.sections&&lt.sections.length) w("บทสุดท้ายต้องเป็นหน้า Quiz (sections ว่าง)");
  topics.forEach((t,i)=>{ if(!t.title) w("บทที่ "+(i+1)+" ไม่มี title"); });
  getQuiz().forEach((q,k)=>{
    if(!Array.isArray(q)||q.length<6) return w("Quiz ข้อ "+(k+1)+": ต้องมี 6 ช่อง (โจทย์, A, B, C, D, เฉลย)");
    if(!/^[A-D]$/.test(String(q[5]).trim().toUpperCase())) w("Quiz ข้อ "+(k+1)+": เฉลยต้องเป็น A/B/C/D");
  });
})();

/* ---------- ลื่นไหล: ซ่อนหัวเมื่อเลื่อนลง / โผล่เมื่อเลื่อนขึ้น + โหมดฝังใน Hub ---------- */
try{ if(window.parent && window.parent!==window) document.documentElement.classList.add("embedded"); }
catch(e){ document.documentElement.classList.add("embedded"); }
(function(){
  const h=document.querySelector("header"); let lastY=window.pageYOffset, tick=false;
  window.addEventListener("scroll",()=>{
    if(tick) return; tick=true;
    requestAnimationFrame(()=>{
      const y=window.pageYOffset;
      if(y>90 && y>lastY+6) h.classList.add("hide");
      else if(y<lastY-6 || y<90) h.classList.remove("hide");
      lastY=y; tick=false;
    });
  },{passive:true});
})();
// เปิดบทใหม่ → เล่นแอนิเมชันเข้าอีกครั้ง
(function(){
  const orig=showTopic;
  showTopic=function(i){ const p=document.getElementById("page"); p.style.animation="none"; void p.offsetWidth; p.style.animation=""; orig(i); document.querySelector("header").classList.remove("hide"); };
})();

// ปุ่มเลื่อนขึ้นบน
(function(){
  const b=document.createElement("button"); b.className="to-top"; b.type="button"; b.setAttribute("aria-label","เลื่อนขึ้นบน");
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  b.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  document.body.appendChild(b);
  addEventListener("scroll",()=>b.classList.toggle("show",window.pageYOffset>700),{passive:true});
})();

showTopic(0);
