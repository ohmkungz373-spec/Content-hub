  const denied = pushOK && Notification.permission === 'denied';
  b.classList.toggle('on', pushOn && !denied); b.setAttribute('aria-checked', pushOn && !denied ? 'true' : 'false'); b.disabled = !pushOK || denied;
  $('ntSwTx').textContent = !pushOK ? 'เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน' : denied ? 'ถูกบล็อกในเบราว์เซอร์ เปิดได้ที่การตั้งค่าเว็บไซต์' : pushOn ? 'เปิดอยู่ · วิชาใหม่ บทเรียนใหม่ และกำหนดส่งการบ้าน' : 'ปิดอยู่ · แตะเพื่อเปิดรับแจ้งเตือน';
}
function ntRender(){
  const box = $('ntBox');
  const list = NT.length ? NT.map(n => { const k = NT_CLR[n.kind] ? n.kind : 'other';
    return `<button class="nt-it${ntFresh.has(n.id) ? ' new' : ''}" data-nt="${esc(n.id)}" type="button" style="--c:${NT_CLR[k]}"><span class="ni">${NT_IC[k]}</span><span class="nx"><b>${esc(n.title)}</b>${n.body ? '<span>' + esc(n.body) + '</span>' : ''}<small><i>${NT_LBL[k]}</i>· ${ntAgo(n.ts)}</small></span>${NT_GO}</button>`; }).join('')
    : `<div class="nt-em">${BELL}<br>ยังไม่มีประวัติการแจ้งเตือน<br><small>วิชาใหม่ บทเรียนใหม่ และเตือนการบ้านจะมาแสดงที่นี่</small></div>`;
  box.innerHTML = `<div class="grab"></div><div class="nt-h"><b>การแจ้งเตือน</b><button class="nt-x" data-ntclose type="button" aria-label="ปิด">${X_ICON}</button></div>
    <button class="nt-sw" id="ntSw" type="button" role="switch"><span class="ti">${BELL}</span><span class="tx"><b>รับการแจ้งเตือน</b><small id="ntSwTx"></small></span><span class="sw"></span></button>
    <div class="nt-lh"><b>ประวัติ</b>${NT.length ? '<button type="button" data-ntclear>ล้างทั้งหมด</button>' : ''}</div>
    <div class="nt-list">${list}</div>`;
  ntPaintSwitch();
}
function ntOpen(){
  const bg = $('ntBg'), box = $('ntBox'); box.classList.remove('out');
  ntFresh = new Set(NT.filter(x => !x.read).map(x => x.id));
  ntRender(); bg.classList.remove('hidden');
  if (ntFresh.size) { NT.forEach(x => x.read = true); ntSave(); }
  ntCapture();
}
function ntClose(instant){
  const bg = $('ntBg'), box = $('ntBox'); if (bg.classList.contains('hidden')) return;
  if (instant) { bg.classList.add('hidden'); return; }
  box.classList.add('out'); bg.querySelector('.mback').style.cssText = 'transition:opacity .22s;opacity:0';
  setTimeout(() => { bg.classList.add('hidden'); box.classList.remove('out'); bg.querySelector('.mback').style.cssText = ''; }, 220);
}
$('pushBtn').onclick = ntOpen;
$('ntBg').addEventListener('click', e => {
  if (e.target.classList.contains('mback') || e.target.closest('[data-ntclose]')) return ntClose();
  if (e.target.closest('#ntSw')) return pushToggle();
  if (e.target.closest('[data-ntclear]')) { NT = []; ntFresh = new Set(); ntSave(); return ntRender(); }
  const it = e.target.closest('[data-nt]'); if (!it) return;
  const n = NT.find(x => x.id === it.dataset.nt); if (!n) return;
  ntClose(true); ntGo(n);
});
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ntBg').classList.contains('hidden')) ntClose(); });
if (pushOK) {
  navigator.serviceWorker.addEventListener('message', e => {   // (ถ้า sw.js ส่งข้อความมา) บันทึกประวัติ / เปิดหน้าตามแจ้งเตือนที่เพิ่งกด
    const d = e.data || {};
    if (d.type === 'push' && d.title) { if (ntAdd({ title: d.title, body: d.body || '', url: d.url || '/', ts: d.ts })) { ntSave(); if (!$('ntBg').classList.contains('hidden')) ntRender(); } }
    else if (d.type === 'open' && d.url) ntGo({ url: d.url });
  });
  setTimeout(ntCapture, 1200);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) ntCapture(); });
  setInterval(ntCapture, 60000);
}
ntBadge();

/* ---------- การบ้าน: ซิงก์กำหนดส่งไปเซิร์ฟเวอร์ (ส่งแจ้งเตือนตอนเช้า) + เตือนในเครื่อง ---------- */
let hwSyncT = 0;
function hwSync(now){
  clearTimeout(hwSyncT);
  hwSyncT = setTimeout(async () => {
    if (!pushOK || Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (!sub) return;
      const items = hwLoad().filter(x => x.due && !x.done).slice(0, 60).map(x => ({ id: x.id, title: x.title, subj: ((SUBJECTS || []).find(s => s.id === x.subj) || {}).name || '', due: x.due, time: x.time || '' }));
      await fetch('/api/hw-sync', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subscription: sub.toJSON(), items }) });
    } catch(e) {}
  }, now ? 0 : 1500);
}
async function hwAlerts(){
  if (!pushOK || Notification.permission !== 'granted') return;
  let seen = {}; try { seen = JSON.parse(store.get('hwAl') || '{}'); } catch(e) {}
  const now = Date.now(), fire = [];
  for (const k in seen) if (now - seen[k] > 14 * 864e5) delete seen[k];
  for (const x of hwLoad()) {
    if (x.done || !x.due) continue;
    const left = new Date(x.due + 'T' + (x.time || '23:59') + ':00').getTime() - now;
    if (isNaN(left) || left < -864e5) continue;
    const st = left < 0 ? 'over' : (x.time && left <= 36e5) ? 'h1' : left <= 864e5 ? 'd1' : '';
    if (!st || seen[x.id + ':' + st]) continue;
    seen[x.id + ':' + st] = now; fire.push({ x, st });
  }
  if (!fire.length) return;
  store.set('hwAl', JSON.stringify(seen));
  fire.forEach(({ x, st }) => ntAdd({ title: st === 'over' ? 'เลยกำหนดส่งการบ้านแล้ว' : st === 'h1' ? 'การบ้านเหลือไม่ถึง 1 ชั่วโมง' : 'ใกล้ถึงกำหนดส่งการบ้าน', body: x.title + (x.time ? ' · ' + x.time + ' น.' : ''), url: '/?hw=' + encodeURIComponent(x.id), kind: 'hw' }));
  ntSave();
  try {
    const reg = await navigator.serviceWorker.ready;
    fire.slice(0, 3).forEach(({ x, st }) => reg.showNotification(st === 'over' ? 'เลยกำหนดส่งการบ้านแล้ว' : st === 'h1' ? 'การบ้านเหลือไม่ถึง 1 ชั่วโมง' : 'ใกล้ถึงกำหนดส่งการบ้าน', { body: x.title + (x.time ? ' · ' + x.time + ' น.' : ''), icon: '/icon-192.png', badge: '/icon-192.png', tag: 'hw-' + x.id, data: { url: '/?hw=' + encodeURIComponent(x.id), local: true } }));
  } catch(e) {}
}
setTimeout(hwAlerts, 2500); setInterval(hwAlerts, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) hwAlerts(); });

/* กันการดึงหน้าจอลงจนสุด (pull-to-refresh / ยางยืด) ทุกกรณี */
(function(){
  let y0 = 0;
  const scrolledInside = el => { for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) { if (el.scrollTop > 0 && el.scrollHeight > el.clientHeight) return true; } return false; };
  document.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (e.touches.length !== 1) return;
    const pullingDown = e.touches[0].clientY - y0 > 0;
    if (pullingDown && (window.scrollY || document.documentElement.scrollTop) <= 0 && !scrolledInside(e.target) && e.cancelable) e.preventDefault();
  }, {passive:false});
})();

/* ปุ่มรีเฟรช: หน้าบทเรียน = โหลดบทเรียนใหม่ / หน้าอื่น = โหลดหน้าเว็บใหม่ */
$('refBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>';
$('refBtn').onclick = () => {
  const b = $('refBtn'); b.classList.remove('rot'); void b.offsetWidth; b.classList.add('rot');
  if (!$('chapterView').classList.contains('hidden')) {
    const f = $('vframe').querySelector('iframe');
    try { if (f && f.contentWindow) { f.contentWindow.location.reload(); return; } } catch(e) {}
    return route();
  }
  setTimeout(() => location.reload(), 250);
};
