<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1020">
<title>CONTENT HUB | เนื้อหา ม.4 เทอม 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080d1b;--panel:#0f1830;--panel2:#16224a;--line:#1e2d57;--ink:#eaf0ff;--muted:#8499c4;--blue:#3b82f6;--cyan:#38bdf8;--acc:#3b82f6;color-scheme:dark}
html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans Thai",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100dvh}
body:before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(620px 360px at 10% -6%,#2563eb55,transparent),radial-gradient(520px 320px at 100% 4%,#06b6d438,transparent),
  linear-gradient(#ffffff06 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/44px 44px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:30;background:#080d1be8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.logo{font-weight:700;letter-spacing:1px;white-space:nowrap;font-size:16px;cursor:pointer}
.logo span{color:var(--cyan)}
.crumb{flex:1;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;transition:.15s;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--blue);box-shadow:0 0 16px #3b82f655}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#0ea5e9));border-color:transparent;font-weight:600;color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 35%,transparent)}
.icon-btn{width:40px;padding:0;font-size:18px}
.wrap{max-width:1100px;margin:auto;padding:0 14px 70px}

/* hero */
.hero{padding:34px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--cyan);border:1px solid #38bdf84d;background:#38bdf812;border-radius:999px;padding:3px 13px}
.kicker:before{content:"";width:7px;height:7px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee}
h1{font-size:clamp(38px,9vw,64px);line-height:1.05;margin:14px 0 8px;letter-spacing:-1px;font-weight:700}
h1 span{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--line);background:#ffffff08;border-radius:999px;padding:3px 12px}
.pill b{color:var(--ink)}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:20px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 22%,var(--panel)),var(--panel));transition:.15s}
.cont:hover{box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 30%,transparent)}
.cont small{color:var(--cyan);font-size:12px;display:block}
.cont b{display:block;line-height:1.3}
.cont .go{margin-left:auto;font-size:26px;color:var(--cyan)}

/* tools */
.tools{position:sticky;top:56px;z-index:20;background:linear-gradient(#080d1bf2 80%,transparent);padding:14px 0 6px;margin-top:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;transition:.15s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 18px #3b82f655}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:12px 0}
.search kbd{font:12px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.search .x{color:var(--muted);font-size:22px;padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted);transition:.15s}
.chip.on{background:linear-gradient(135deg,#2563eb,#0ea5e9);border-color:transparent;color:#fff;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 10px}
.row h2{margin:0;font-size:18px}.count{color:var(--muted);font-size:14px}

/* subject cards (2 คอลัมน์บนมือถือ) */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:136px;text-align:left;padding:14px;border-radius:20px;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--acc) 28%,var(--line));
  background:radial-gradient(160px 120px at 0 0,color-mix(in srgb,var(--acc) 26%,transparent),transparent),var(--panel);
  transition:.2s;animation:in .4s both}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 12px 30px color-mix(in srgb,var(--acc) 30%,transparent)}
.card:active{transform:scale(.97)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 55%,#0f1830),color-mix(in srgb,var(--acc) 18%,#0f1830));box-shadow:inset 0 1px 0 #ffffff25}
.card b{font-size:15.5px;line-height:1.3;font-weight:600;margin-top:auto}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.code{font-size:11.5px;color:color-mix(in srgb,var(--acc) 60%,#fff);font-weight:600;letter-spacing:.3px}
.n{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.card.empty{opacity:.62}
.pin{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:#ffffff66;transition:.15s}
.pin:hover{background:#ffffff14;color:#fff}
.pin.on{color:#fbbf24;text-shadow:0 0 12px #fbbf2499}

/* subject page */
.banner{position:relative;display:flex;align-items:center;gap:14px;margin:18px 0 14px;padding:18px;border-radius:22px;border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));
  background:radial-gradient(260px 160px at 0 0,color-mix(in srgb,var(--acc) 35%,transparent),transparent),var(--panel)}
.banner .ico{width:64px;height:64px;font-size:34px;border-radius:19px}
.banner h1{font-size:clamp(22px,5.5vw,34px);margin:0;line-height:1.2;letter-spacing:0}
.banner .pin{top:10px;right:10px}
.start{width:100%;margin-bottom:14px;padding:13px;font-size:16px;border-radius:14px}
.list{display:grid;gap:8px}
.chap{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:.15s;min-height:60px;animation:in .35s both}
.chap:hover{border-color:var(--acc);box-shadow:0 6px 22px color-mix(in srgb,var(--acc) 25%,transparent)}
.chap i{flex:none;font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 70%,#0f1830),color-mix(in srgb,var(--acc) 30%,#0f1830))}
.chap span{flex:1;line-height:1.4}
.chap u{text-decoration:none;color:var(--muted);font-size:22px}
.msg{color:var(--muted);text-align:center;padding:44px 12px;border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}

/* viewer */
.viewer{display:flex;flex-direction:column;height:calc(100dvh - 57px)}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.vbar .t{flex:1;min-width:0;text-align:center;font-size:14px;line-height:1.3;padding:4px 8px;border-radius:12px}
.vbar .t:hover{background:var(--panel2)}
.vbar .t b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vbar .t small{display:block;color:var(--muted);font-size:12px}
.vframe{flex:1;background:#fff;position:relative}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.spin{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:14px;z-index:2}
.spin:before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--cyan);animation:r .8s linear infinite;margin-bottom:-60px}
@keyframes r{to{transform:rotate(360deg)}}
.sheet-bg{position:fixed;inset:0;z-index:50;background:#000a;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:75dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 14px;animation:up .25s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.sheet h3{margin:2px 4px 12px;font-size:16px}
.sheet .chap{margin-bottom:8px;animation:none}
.sheet .chap.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel))}
footer{text-align:center;color:#5d709b;font-size:13px;padding:24px}
@media(max-width:520px){.logo{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="btn hidden" id="backBtn" aria-label="ย้อนกลับ">‹ กลับ</button>
    <div class="logo" id="logo">◆ CONTENT <span>HUB</span></div>
    <div class="crumb" id="crumb"></div>
  </div>
</header>

<main id="home" class="wrap">
  <section class="hero">
    <span class="kicker" id="tagline">เนื้อหา ม.4 เทอม 2</span>
    <h1>CONTENT <span>HUB</span></h1>
    <div class="pills"><span class="pill"><b id="sSub">0</b> วิชา</span><span class="pill"><b id="sChap">0</b> บทเรียน</span></div>
    <button class="cont hidden" id="cont"></button>
  </section>
  <div class="tools">
    <label class="search"><span>⌕</span><input id="q" type="search" placeholder="ค้นหาวิชา หรือรหัสวิชา" autocomplete="off"><button class="x hidden" id="clr" aria-label="ล้าง">×</button><kbd id="kbd">/</kbd></label>
    <div class="chips" id="chips"></div>
  </div>
  <div class="row"><h2>วิชาทั้งหมด</h2><span class="count" id="count"></span></div>
  <div class="grid" id="grid"></div>
</main>

<main id="subjectView" class="wrap hidden"></main>

<section id="chapterView" class="viewer hidden">
  <div class="vbar">
    <button class="btn icon-btn" id="prevBtn" aria-label="บทก่อนหน้า">‹</button>
    <button class="t" id="vtitle" aria-label="เลือกบทเรียน"></button>
    <button class="btn icon-btn" id="nextBtn" aria-label="บทถัดไป">›</button>
  </div>
  <div class="vframe" id="vframe"></div>
</section>

<div class="sheet-bg hidden" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<footer id="foot">◆ CONTENT HUB</footer>

<script>
let SUBJECTS = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ---------- วิชาที่ปักหมุด ---------- */
let pins = [];
try { pins = JSON.parse(store.get('pins') || '[]'); } catch(e) {}
const isPinned = id => pins.includes(id);
function togglePin(id){
  pins = isPinned(id) ? pins.filter(x => x !== id) : [...pins, id];
  store.set('pins', JSON.stringify(pins));
}

/* ---------- หมวดวิชา (ดูจากตัวอักษรแรกของรหัสวิชา) ---------- */
const CATS = [
  {k:'all', name:'ทั้งหมด'},
  {k:'pin', name:'⭐ ที่ปักไว้'},
  {k:'lang', name:'ภาษา', color:'#f59e0b', test:c => 'ทอ'.includes(c)},
  {k:'math', name:'คณิตศาสตร์', color:'#a78bfa', test:c => c === 'ค'},
  {k:'sci',  name:'วิทยาศาสตร์', color:'#22c55e', test:c => c === 'ว'},
  {k:'soc',  name:'สังคม', color:'#f97316', test:c => c === 'ส'},
  {k:'other',name:'สุขภาพ/ศิลปะ/การงาน', color:'#ec4899', test:c => 'พศง'.includes(c)}
];
const catOf = s => CATS.slice(2).find(c => c.test((s.code || '')[0] || '')) || CATS[CATS.length - 1];
let activeCat = 'all';

const views = ['home','subjectView','chapterView'];
function show(v){
  views.forEach(x => $(x).classList.toggle('hidden', x !== v));
  $('foot').classList.toggle('hidden', v === 'chapterView');
  $('backBtn').classList.toggle('hidden', v === 'home');
  $('logo').classList.toggle('hidden', v !== 'home' && matchMedia('(max-width:520px)').matches);
  if (v !== 'chapterView') window.scrollTo(0, 0);
}

/* ---------- หน้าแรก ---------- */
function renderContinue(){
  const b = $('cont');
  const last = (store.get('last') || '').split('/');
  const s = SUBJECTS.find(x => x.id === last[0]);
  const c = s && s.chapters.find(x => x.id === last[1]);
  if (!c) { b.classList.add('hidden'); return; }
  b.style.setProperty('--acc', catOf(s).color);
  b.innerHTML = `<span class="ico">${esc(s.icon)}</span><span><small>▶ เรียนต่อจากครั้งก่อน</small><b>${esc(c.title)}</b><small style="color:var(--muted)">${esc(s.name)}</small></span><span class="go">›</span>`;
  b.onclick = () => go(`/${s.id}/${c.id}`);
  b.classList.remove('hidden');
}

function renderChips(){
  $('chips').innerHTML = CATS.map(c => `<button class="chip ${c.k === activeCat ? 'on' : ''}" data-k="${c.k}">${esc(c.name)}</button>`).join('');
}

function renderGrid(){
  const q = $('q').value.trim().toLowerCase();
  $('clr').classList.toggle('hidden', !q);
  $('kbd').classList.toggle('hidden', !!q);
  let list = SUBJECTS.filter(s =>
    (activeCat === 'all' || (activeCat === 'pin' ? isPinned(s.id) : catOf(s).k === activeCat)) &&
    (!q || (s.name + ' ' + s.code).toLowerCase().includes(q)));
  list = [...list].sort((a, b) => isPinned(b.id) - isPinned(a.id));
  $('grid').innerHTML = list.length ? list.map((s, i) => `
    <button class="card ${s.chapters.length ? '' : 'empty'}" data-id="${esc(s.id)}" style="--acc:${catOf(s).color};animation-delay:${Math.min(i, 12) * 30}ms">
      <span class="ico">${esc(s.icon)}</span>
      <span class="pin ${isPinned(s.id) ? 'on' : ''}" data-pin="${esc(s.id)}" role="button" aria-label="ปักหมุด">${isPinned(s.id) ? '★' : '☆'}</span>
      <b>${esc(s.name)}</b>
      <span class="tags"><span class="code">${esc(s.code)}</span><span class="n">${s.chapters.length ? s.chapters.length + ' บท' : 'เร็ว ๆ นี้'}</span></span>
    </button>`).join('')
    : `<div class="msg">${activeCat === 'pin' && !q ? 'ยังไม่มีวิชาที่ปักหมุด<br>กดดาว ☆ ที่การ์ดวิชาเพื่อปักไว้' : 'ไม่พบวิชาที่ค้นหา<br>ลองพิมพ์ชื่ออื่น หรือเลือก "ทั้งหมด"'}</div>`;
  $('count').textContent = `${list.length} วิชา`;
}

function renderHome(){
  $('sSub').textContent = SUBJECTS.length;
  $('sChap').textContent = SUBJECTS.reduce((n, s) => n + s.chapters.length, 0);
  renderContinue(); renderChips(); renderGrid();
  $('crumb').textContent = '';
  show('home');
}

/* ---------- หน้าวิชา ---------- */
function renderSubject(s){
  const cat = catOf(s);
  const last = (store.get('last') || '').split('/');
  const resume = last[0] === s.id ? s.chapters.find(c => c.id === last[1]) : null;
  const target = resume || s.chapters[0];
  $('subjectView').style.setProperty('--acc', cat.color);
  $('subjectView').innerHTML = `
    <div class="banner"><span class="ico">${esc(s.icon)}</span><div><h1>${esc(s.name)}</h1><span class="code">${esc(s.code)} · ${s.chapters.length} บทเรียน</span></div>
      <button class="pin ${isPinned(s.id) ? 'on' : ''}" id="spin" aria-label="ปักหมุด">${isPinned(s.id) ? '★' : '☆'}</button></div>
    ${s.chapters.length ? `
    <button class="btn primary start" data-id="${esc(target.id)}">${resume ? '▶ เรียนต่อ: ' + esc(target.title) : '▶ เริ่มเรียนบทแรก'}</button>
    <div class="list">${s.chapters.map((c, i) => `<button class="chap" data-id="${esc(c.id)}" style="animation-delay:${Math.min(i, 12) * 30}ms"><i>${i + 1}</i><span>${esc(c.title)}</span><u>›</u></button>`).join('')}</div>`
    : `<div class="msg">ยังไม่มีบทเรียนในวิชานี้<br>เร็ว ๆ นี้ ✨</div>`}`;
  $('spin').onclick = () => { togglePin(s.id); renderSubject(s); };
  $('crumb').textContent = s.name;
  show('subjectView');
}

/* ---------- หน้าอ่านบทเรียน ---------- */
function openSheet(s, i){
  $('sheet').style.setProperty('--acc', catOf(s).color);
  $('sheet').innerHTML = `<h3>${esc(s.icon)} ${esc(s.name)}</h3>` + s.chapters.map((c, k) =>
    `<button class="chap ${k === i ? 'cur' : ''}" data-go="/${esc(s.id)}/${esc(c.id)}"><i>${k + 1}</i><span>${esc(c.title)}</span></button>`).join('');
  $('sheetBg').classList.remove('hidden');
  const cur = $('sheet').querySelector('.cur'); if (cur) cur.scrollIntoView({block:'center'});
}
const closeSheet = () => $('sheetBg').classList.add('hidden');
$('sheetBg').addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { closeSheet(); go(b.dataset.go); }
  else if (e.target === $('sheetBg')) closeSheet();
});

function renderChapter(s, i){
  const c = s.chapters[i];
  const url = k => `/${s.id}/${s.chapters[k].id}`;
  store.set('last', `${s.id}/${c.id}`);
  closeSheet();
  $('vtitle').innerHTML = `<b>${esc(c.title)}</b><small>${esc(s.name)} · บท ${i + 1}/${s.chapters.length} ▾</small>`;
  $('vtitle').onclick = () => openSheet(s, i);
  $('prevBtn').disabled = i === 0;
  $('nextBtn').disabled = i === s.chapters.length - 1;
  $('prevBtn').onclick = () => go(url(i - 1));
  $('nextBtn').onclick = () => go(url(i + 1));
  // สร้าง iframe ใหม่ทุกครั้ง → ไม่สร้าง history ซ้อน ปุ่มย้อนกลับของมือถือจึงทำงานปกติ
  const f = document.createElement('iframe');
  const spin = document.createElement('div');
  spin.className = 'spin'; spin.textContent = 'กำลังโหลดบทเรียน...';
  f.title = c.title;
  f.addEventListener('load', () => spin.remove());
  f.src = `/content/${encodeURIComponent(s.id)}/${encodeURIComponent(c.file)}`;
  $('vframe').replaceChildren(f, spin);
  $('crumb').textContent = '';
  show('chapterView');
}

/* ---------- ระบบหน้า (URL) ---------- */
function go(path){ history.pushState(null, '', path); route(); }
function route(){
  closeSheet();
  const parts = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const s = SUBJECTS.find(x => x.id === parts[0]);
  if (!s) return renderHome();
  if (parts[1]) {
    const i = s.chapters.findIndex(c => c.id === parts[1]);
    if (i >= 0) return renderChapter(s, i);
  }
  renderSubject(s);
}

const curSubject = () => location.pathname.split('/').filter(Boolean)[0];
$('grid').addEventListener('click', e => {
  const p = e.target.closest('[data-pin]');
  if (p) { e.stopPropagation(); togglePin(p.dataset.pin); renderGrid(); return; }
  const b = e.target.closest('.card'); if (b) go('/' + b.dataset.id);
});
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { activeCat = b.dataset.k; renderChips(); renderGrid(); } });
$('subjectView').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) go(`/${curSubject()}/${b.dataset.id}`); });
$('backBtn').onclick = () => go(location.pathname.split('/').filter(Boolean).length > 1 ? '/' + curSubject() : '/');
$('logo').onclick = () => go('/');
$('q').addEventListener('input', renderGrid);
$('clr').onclick = () => { $('q').value = ''; renderGrid(); $('q').focus(); };
window.addEventListener('popstate', route);
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape') closeSheet();
  if (tag === 'input') return;
  if (e.key === '/' && !$('home').classList.contains('hidden')) { e.preventDefault(); $('q').focus(); }
  if (!$('chapterView').classList.contains('hidden')) {
    if (e.key === 'ArrowLeft' && !$('prevBtn').disabled) $('prevBtn').click();
    if (e.key === 'ArrowRight' && !$('nextBtn').disabled) $('nextBtn').click();
  }
});

fetch('/subjects.json').then(r => r.json()).then(d => {
  SUBJECTS = d.subjects || [];
  const cfg = d.config || {};
  if (cfg.tagline) $('tagline').textContent = cfg.tagline;
  document.title = `${cfg.siteTitle || 'CONTENT HUB'} | ${cfg.tagline || ''}`;
  route();
}).catch(() => { $('grid').innerHTML = '<div class="msg">โหลดรายการวิชาไม่สำเร็จ ลองรีเฟรชหน้านี้</div>'; });
</script>
</body>
</html>
