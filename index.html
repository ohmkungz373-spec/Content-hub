<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed"><title>คลังเนื้อหา ม.4 เทอม 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Mitr:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#241b4b;--muted:#6b6590;--line:#ebe6fb;--p:#7c3aed;--head:"Mitr","Noto Sans Thai",sans-serif;--sans:"Noto Sans Thai",system-ui,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fbf9ff;min-height:100vh;padding-bottom:var(--sb)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #c4b5fd;outline-offset:2px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#f5f0ff,#eef0ff 50%,#f7f3ff)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:fl 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:#c4b5fd}
.bg i:nth-child(2){width:38vmax;height:38vmax;right:-12vmax;top:6vmax;background:#a5b4fc;animation-delay:-5s}
.bg i:nth-child(3){width:36vmax;height:36vmax;left:18vmax;bottom:-16vmax;background:#ddd6fe;animation-delay:-9s}
@keyframes fl{to{transform:translate(4vmax,5vmax) scale(1.15)}}
.appbar{position:sticky;top:0;z-index:20;padding-top:var(--st);background:rgba(255,255,255,.7);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.8)}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
.appbar .wrap{height:62px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--head);font-size:18px}
.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);box-shadow:0 8px 20px rgba(124,58,237,.35)}
.hero{padding:34px 0 8px}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--p);box-shadow:0 6px 16px rgba(124,58,237,.1)}
.hero h1{font-family:var(--head);font-weight:700;font-size:clamp(38px,9vw,72px);line-height:1.12;margin:14px 0 8px;background:linear-gradient(90deg,#5b21b6,#8b5cf6 50%,#5b21b6);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:220% center}}
.hero p{margin:0;color:var(--muted);font-size:16px}
.stats{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.stat{flex:1;min-width:96px;padding:12px 14px;border-radius:20px;color:#fff;box-shadow:0 12px 26px rgba(0,0,0,.12)}
.stat b{display:block;font-family:var(--head);font-size:26px;line-height:1.1}.stat span{font-size:12px;opacity:.92}
.stat:nth-child(1){background:linear-gradient(135deg,#6d28d9,#8b5cf6)}.stat:nth-child(2){background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.search{position:relative;margin-top:20px}
.search input{width:100%;height:58px;border:2px solid #fff;border-radius:20px;background:rgba(255,255,255,.95);padding:0 50px;font-size:16px;box-shadow:0 12px 32px rgba(124,58,237,.14)}
.search input:focus{outline:0;border-color:#c4b5fd}
.search .gl{position:absolute;left:18px;top:15px;font-size:20px}
.clear{position:absolute;right:11px;top:12px;width:34px;height:34px;border-radius:50%;background:#efeafc;color:var(--muted)}.clear[hidden]{display:none}
.filters{display:flex;gap:9px;overflow:auto;padding:14px 0 4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;padding:9px 16px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted)}
.filter.on{color:#fff;border-color:transparent;background:var(--c,#7c3aed);box-shadow:0 8px 20px color-mix(in srgb,var(--c,#7c3aed) 40%,transparent)}
.cont{width:100%;display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px 18px;border-radius:24px;text-align:left;color:#fff;background:linear-gradient(120deg,#6d28d9,#8b5cf6);box-shadow:0 16px 36px rgba(124,58,237,.34);transition:transform .15s}
.cont:hover{transform:translateY(-2px)}.cont .ic{font-size:34px;width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.cont small{display:block;opacity:.9;font-size:12px;font-weight:700}.cont b{display:block;font-size:17px;line-height:1.3}.cont .go{margin-left:auto;background:#fff;color:#6d28d9;font-weight:800;padding:9px 16px;border-radius:14px;white-space:nowrap}
.sec{margin-top:28px}.sh{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sh h2{margin:0;font-family:var(--head);font-weight:600;font-size:20px}.sh span{font-size:12px;font-weight:700;color:#fff;background:var(--c);padding:3px 11px;border-radius:99px}
.sh:after{content:"";flex:1;height:3px;border-radius:9px;background:linear-gradient(90deg,var(--c),transparent);opacity:.35}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:930px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;text-align:left;min-height:170px;padding:16px;border-radius:26px;color:#fff;overflow:hidden;background:linear-gradient(150deg,var(--c),#a78bfa);box-shadow:0 14px 30px color-mix(in srgb,var(--c) 38%,transparent);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 22px 40px color-mix(in srgb,var(--c) 48%,transparent)}
.card:before{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.2)}
.card .em{position:relative;width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:33px;margin-bottom:22px;box-shadow:0 8px 18px rgba(0,0,0,.14)}
.card h3{position:relative;margin:0;font-family:var(--head);font-weight:600;font-size:17px;line-height:1.3}.card p{position:relative;margin:3px 0 0;font-size:12px;font-weight:600;opacity:.95}


.empty{padding:34px 18px;border:2px dashed #d8cffa;border-radius:24px;text-align:center;color:var(--muted);background:rgba(255,255,255,.6)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.btn{margin-top:14px;padding:10px 20px;border-radius:99px;background:var(--p);color:#fff;font-weight:700}
.sp{padding:22px 18px 80px}.back{padding:10px 18px;border-radius:99px;background:#fff;border:1.5px solid var(--line);color:var(--p);font-weight:700;box-shadow:0 6px 16px rgba(124,58,237,.1)}
.sbanner{position:relative;display:flex;gap:20px;align-items:center;margin:20px 0 22px;padding:26px;border-radius:32px;color:#fff;overflow:hidden;background:linear-gradient(140deg,var(--c),#a78bfa);box-shadow:0 20px 44px color-mix(in srgb,var(--c) 40%,transparent)}
.sbanner:before{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.sbanner .em{width:92px;height:92px;flex:none;border-radius:28px;background:#fff;display:grid;place-items:center;font-size:50px;box-shadow:0 12px 26px rgba(0,0,0,.16);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.sbanner h1{position:relative;margin:0;font-family:var(--head);font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1.15}.sbanner p{position:relative;margin:5px 0 0;font-weight:600;opacity:.95}

.start{display:block;width:100%;margin:0 0 20px;padding:17px;border-radius:22px;color:#fff;font-weight:800;font-size:18px;background:linear-gradient(120deg,#6d28d9,#8b5cf6);box-shadow:0 14px 30px rgba(109,40,217,.34);transition:transform .15s}.start:hover{transform:translateY(-2px)}
.ch{position:relative;width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;margin:12px 0;border-radius:22px;background:rgba(255,255,255,.92);border:2px solid #fff;box-shadow:0 8px 24px rgba(80,60,160,.09);transition:transform .15s,box-shadow .15s}
.ch:hover{transform:translateX(4px);box-shadow:0 12px 30px rgba(80,60,160,.16)}
.ch .n{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font-family:var(--head);font-size:17px;color:#fff;background:linear-gradient(135deg,var(--c),#a78bfa)}
.ch b{display:block;font-size:15.5px;line-height:1.4}.ch small{color:var(--muted);font-weight:600}.ch .ar{margin-left:auto;font-size:26px;color:var(--c)}

.reader{position:fixed;inset:0;z-index:40;background:#f3efff;display:none}.reader.show{display:block}
.rbar{padding:calc(var(--st) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#6d28d9,#8b5cf6);color:#fff;position:relative}
.rbar:after{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--w,0%);background:#ddd6fe;transition:width .3s}
.rt{flex:1;min-width:0}.rt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-family:var(--head);font-weight:500}.rt span{font-size:11.5px;opacity:.92}
.rb{width:42px;height:42px;flex:none;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:20px;font-weight:700}.rb:hover{background:rgba(255,255,255,.35)}.rb:disabled{opacity:.35;cursor:not-allowed}
.reader iframe{display:block;width:100%;height:calc(100dvh - 66px - var(--st) - var(--sb));border:0;background:#fff}
@media(min-width:800px){.reader iframe{max-width:940px;margin:16px auto 0;border-radius:22px;box-shadow:0 24px 60px rgba(60,40,140,.22);height:calc(100dvh - 82px - var(--st) - var(--sb))}}
.picker{position:fixed;inset:0;z-index:60;display:none}.picker.show{display:block}.pb{position:absolute;inset:0;background:rgba(30,20,70,.5)}
.ps{position:absolute;left:0;right:0;bottom:0;max-height:80dvh;background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .22s ease;max-width:640px;margin:auto}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}.ph b{font-family:var(--head);font-size:18px}.ph button{width:38px;height:38px;border-radius:12px;background:#f1edff}
.pl{overflow:auto;padding:4px 14px calc(18px + var(--sb))}
.pi{width:100%;display:flex;align-items:center;gap:12px;padding:12px;margin:6px 0;border-radius:16px;border:1.5px solid var(--line);text-align:left}
.pi.on{border-color:var(--p);background:#f5f0ff}.pi .pn{width:34px;height:34px;border-radius:11px;background:#efe9ff;color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.pi b{flex:1;font-size:14px}.pi em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--p);padding:4px 10px;border-radius:99px}
.foot{text-align:center;color:#8a83ad;font-size:12.5px;padding:40px 0 60px}
@media(max-width:600px){.sbanner{padding:20px 18px;gap:14px;border-radius:26px}.sbanner .em{width:64px;height:64px;font-size:34px;border-radius:20px}.cont .go{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header class="appbar"><div class="wrap"><button class="brand" id="home" type="button" aria-label="กลับหน้าแรก"><span class="logo">📚</span>Content Hub</button></div></header>
<main id="main" class="wrap">
<section class="hero"><span class="pill" id="eyebrow">ห้องสมุดเนื้อหาออนไลน์</span><h1 id="title">คลังเนื้อหา ม.4 เทอม 2</h1><p id="subtitle">กำลังโหลด...</p>
<div class="stats"><div class="stat"><b id="nS">–</b><span>วิชา</span></div><div class="stat"><b id="nC">–</b><span>บทเรียน</span></div></div>
<div id="contBox"></div>
<div class="search"><span class="gl">🔍</span><input id="search" placeholder="ค้นหาวิชา หรือบทเรียน..." autocomplete="off" aria-label="ค้นหา"><button id="clear" class="clear" type="button" hidden aria-label="ล้างคำค้นหา">✕</button></div>
<div id="filters" class="filters"></div></section>
<section id="shelves"></section>
</main>
<section id="sp" class="wrap sp" hidden></section>
<div id="reader" class="reader"><div class="rbar" id="rbar"><button id="rClose" class="rb" aria-label="ปิดบทเรียน">✕</button><div class="rt"><b id="rTitle">บทเรียน</b><span id="rSub"></span></div><button id="rPick" class="rb" aria-label="เลือกบท">☰</button><button id="rPrev" class="rb" aria-label="บทก่อนหน้า">‹</button><button id="rNext" class="rb" aria-label="บทถัดไป">›</button></div><iframe id="frame" title="บทเรียน"></iframe></div>
<div id="picker" class="picker"><div class="pb" id="pb"></div><div class="ps"><div class="ph"><b>เลือกบท</b><button id="pClose" aria-label="ปิด">✕</button></div><div class="pl" id="pl"></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st={data:null,group:'ทั้งหมด',q:'',s:null,i:0};let last=null;
try{last=JSON.parse(localStorage.getItem('hub-last')||'null')}catch{}
const save=()=>{try{localStorage.setItem('hub-last',JSON.stringify(last))}catch{}};
const col=()=>'#7c3aed';
async function load(){try{st.data=await(await fetch('/hub.json?x='+Date.now(),{cache:'no-store'})).json()}catch{st.data={title:'คลังเนื้อหา ม.4 เทอม 2',subtitle:'โหลดข้อมูลไม่สำเร็จ',groups:[],subjects:[]}}
route()}
function route(){const f=decodeURIComponent(location.hash.slice(1)),s=f&&st.data.subjects.find(x=>x.folder===f);hideReader();
if(s){st.s=s;$('#main').hidden=true;$('#sp').hidden=false;subjectPage()}else{st.s=null;$('#main').hidden=false;$('#sp').hidden=true;home()}scrollTo(0,0)}
addEventListener('hashchange',route);
function home(){const d=st.data,all=d.subjects,tc=all.reduce((n,s)=>n+s.chapters.length,0);
$('#title').textContent=d.title||'คลังเนื้อหา';$('#subtitle').textContent=d.subtitle||'รวมบทเรียนทั้งหมดไว้ในที่เดียว';$('#nS').textContent=all.length;$('#nC').textContent=tc;
const ls=last&&all.find(s=>s.folder===last.f),lc=ls&&ls.chapters[last.i];
$('#contBox').innerHTML=lc?`<button class="cont" id="cont"><span class="ic">${ls.icon}</span><span><small>▶ เรียนต่อจากครั้งก่อน</small><b>${esc(ls.name)} · ${esc(lc.title)}</b></span><span class="go">เรียนต่อ</span></button>`:'';
$('#filters').innerHTML=['ทั้งหมด',...(d.groups||[]).map(g=>g.name)].map(g=>`<button class="filter${g===st.group?' on':''}" data-g="${esc(g)}" style="--c:${g==='ทั้งหมด'?'#7c3aed':col(g)}">${esc(g)}</button>`).join('');shelves()}
function shelves(){const q=st.q.trim().toLowerCase(),by={};
st.data.subjects.filter(s=>(st.group==='ทั้งหมด'||s.group===st.group)&&(!q||(s.name+' '+s.group+' '+s.chapters.map(c=>c.title).join(' ')).toLowerCase().includes(q))).forEach(s=>(by[s.group]??=[]).push(s));
$('#shelves').innerHTML=Object.entries(by).map(([g,a])=>`<section class="sec"><div class="sh" style="--c:${col(g)}"><h2>${esc(g)}</h2><span>${a.length} วิชา</span></div><div class="grid">${a.map(card).join('')}</div></section>`).join('')||`<div class="empty"><b>ไม่พบรายการ 🔎</b>ลองเปลี่ยนคำค้นหรือเลือกกลุ่มอื่น<br><button id="reset" class="btn">ล้างตัวกรอง</button></div>`}
function card(s){const n=s.chapters.length;return `<button class="card" data-f="${esc(s.folder)}" style="--c:${col(s.group)}"><div class="em">${s.icon}</div><h3>${esc(s.name)}</h3><p>${n?n+' บท':'ยังไม่มีบท'}</p></button>`}
function subjectPage(){const s=st.s,c=col(s.group),r=last&&last.f===s.folder&&s.chapters[last.i]?last.i:-1;
$('#sp').innerHTML=`<button class="back" id="back">‹ ทุกวิชา</button><div class="sbanner" style="--c:${c}"><div class="em">${s.icon}</div><div><h1>${esc(s.name)}</h1><p>${esc(s.group)} · ${s.chapters.length} บท</p></div></div>`+
(s.chapters.length?`<button class="start" id="start">${r>=0?'▶ เรียนต่อ: '+esc(s.chapters[r].title):'▶ เริ่มเรียนบทแรก'}</button>`+s.chapters.map((x,i)=>`<button class="ch" data-i="${i}" style="--c:${c}"><span class="n">${i+1}</span><span><b>${esc(x.title)}</b></span><span class="ar">›</span></button>`).join(''):`<div class="empty"><b>ยังไม่มีบทเรียน 📭</b>วางไฟล์ .html / .md / .txt ใน <code>content/${esc(s.folder)}/</code> แล้วรีเฟรช</div>`);
$('#back').onclick=()=>{location.hash=''};const b=$('#start');if(b)b.onclick=()=>openCh(s,r>=0?r:0)}
function openCh(s,i){const c=s.chapters[i];if(!c)return;st.s=s;st.i=i;last={f:s.folder,i};save();
$('#rTitle').textContent=c.title;$('#rSub').textContent=s.name+' · บท '+(i+1)+'/'+s.chapters.length;$('#rbar').style.setProperty('--w',((i+1)/s.chapters.length*100)+'%');
$('#frame').src='/content/'+encodeURIComponent(s.folder)+'/'+c.file.split('/').map(encodeURIComponent).join('/');$('#reader').classList.add('show');document.body.style.overflow='hidden';
$('#rPrev').disabled=i<=0;$('#rNext').disabled=i>=s.chapters.length-1}
function hideReader(){$('#reader').classList.remove('show');$('#picker').classList.remove('show');document.body.style.overflow='';$('#frame').src='about:blank'}
function closeReader(){hideReader();if(st.s)subjectPage()}
function pick(){const s=st.s;$('#pl').innerHTML=s.chapters.map((c,i)=>`<button class="pi${i===st.i?' on':''}" data-i="${i}"><span class="pn">${i+1}</span><b>${esc(c.title)}</b>${i===st.i?'<em>กำลังอ่าน</em>':''}</button>`).join('');$('#picker').classList.add('show')}
$('#search').oninput=e=>{st.q=e.target.value;$('#clear').hidden=!st.q;shelves()};
$('#clear').onclick=()=>{st.q='';$('#search').value='';$('#clear').hidden=true;$('#search').focus();shelves()};
$('#home').onclick=()=>{if(location.hash)location.hash='';else{st.group='ทั้งหมด';st.q='';$('#search').value='';route()}};
$('#filters').onclick=e=>{const b=e.target.closest('[data-g]');if(b){st.group=b.dataset.g;home()}};
$('#contBox').onclick=e=>{if(e.target.closest('#cont')){const s=st.data.subjects.find(x=>x.folder===last.f);location.hash='#'+encodeURIComponent(s.folder);openCh(s,last.i)}};
$('#shelves').onclick=e=>{if(e.target.closest('#reset')){st.q='';st.group='ทั้งหมด';$('#search').value='';$('#clear').hidden=true;home();return}const b=e.target.closest('[data-f]');if(b)location.hash='#'+encodeURIComponent(b.dataset.f)};
$('#sp').onclick=e=>{const b=e.target.closest('[data-i]');if(b)openCh(st.s,+b.dataset.i)};
$('#rClose').onclick=closeReader;$('#rPick').onclick=pick;$('#pClose').onclick=$('#pb').onclick=()=>$('#picker').classList.remove('show');
$('#pl').onclick=e=>{const b=e.target.closest('[data-i]');if(b){$('#picker').classList.remove('show');openCh(st.s,+b.dataset.i)}};
$('#rPrev').onclick=()=>openCh(st.s,st.i-1);$('#rNext').onclick=()=>openCh(st.s,st.i+1);
addEventListener('keydown',e=>{if(!$('#reader').classList.contains('show'))return;if(e.key==='Escape'){$('#picker').classList.contains('show')?$('#picker').classList.remove('show'):closeReader()}});
load();
</script></body></html>
