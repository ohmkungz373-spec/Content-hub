<html lang="th">
<head>

<meta name="theme-color" content="#0a1020">

<title>CONTENT HUB | เนื้อหา ม.4 เทอม 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none}
:root{--bg:#080d1b;--s0:#0b1226;--s1:#0f1830;--s2:#111b36;--s3:#152248;--line2:#2a3d6e;--panel:var(--s1);--panel2:#16224a;--line:#1e2d57;--ink:#eaf0ff;--muted:#8499c4;--blue:#3b82f6;--cyan:#38bdf8;--acc:#3b82f6;color-scheme:dark}
html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans Thai",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100dvh}
body:before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(620px 360px at 10% -6%,#2563eb55,transparent),radial-gradient(520px 320px at 100% 4%,#06b6d438,transparent),
  linear-gradient(color-mix(in srgb,var(--ink) 2%,transparent) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,color-mix(in srgb,var(--ink) 2%,transparent) 1px,transparent 1px) 0 0/44px 44px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.logo{font-weight:700;letter-spacing:1px;white-space:nowrap;font-size:16px;cursor:pointer}
.logo span{color:var(--cyan)}
.crumb{flex:1;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;transition:.15s;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--blue);box-shadow:0 0 16px #3b82f655}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#0ea5e9));border-color:transparent;font-weight:600;color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 35%,transparent)}
.icon-btn{width:40px;padding:0;font-size:18px}
.wrap{max-width:1100px;margin:auto;padding:0 14px 70px}

/* hero */
.hero{padding:34px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--cyan);border:1px solid #38bdf84d;background:#38bdf812;border-radius:999px;padding:3px 13px}
.kicker:before{content:"";width:7px;height:7px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee}
h1{font-size:clamp(38px,9vw,64px);line-height:1.05;margin:14px 0 8px;letter-spacing:-1px;font-weight:700}
h1 span{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 3%,transparent);border-radius:999px;padding:3px 12px}
.pill b{color:var(--ink)}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:20px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 22%,var(--panel)),var(--panel));transition:.15s}
.cont:hover{box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 30%,transparent)}
.cont small{color:var(--cyan);font-size:12px;display:block}
.cont b{display:block;line-height:1.3}
.cont .go{margin-left:auto;font-size:26px;color:var(--cyan)}

/* tools */
.tools{position:sticky;top:56px;z-index:20;background:linear-gradient(color-mix(in srgb,var(--bg) 95%,transparent) 80%,transparent);padding:14px 0 6px;margin-top:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;transition:.15s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 18px #3b82f655}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:12px 0}
.search kbd{font:12px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.search .x{color:var(--muted);font-size:22px;padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted);transition:.15s}
.chip.on{background:linear-gradient(135deg,#2563eb,#0ea5e9);border-color:transparent;color:#fff;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 10px}
.row h2{margin:0;font-size:18px}.count{color:var(--muted);font-size:14px}

/* subject cards (2 คอลัมน์บนมือถือ) */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:136px;text-align:left;padding:14px;border-radius:20px;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--acc) 28%,var(--line));
  background:radial-gradient(160px 120px at 0 0,color-mix(in srgb,var(--acc) 26%,transparent),transparent),var(--panel);
  transition:.2s;animation:in .4s both}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 12px 30px color-mix(in srgb,var(--acc) 30%,transparent)}
.card:active{transform:scale(.97)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 55%,var(--s1)),color-mix(in srgb,var(--acc) 18%,var(--s1)));box-shadow:inset 0 1px 0 #ffffff25}
.card b{font-size:15.5px;line-height:1.3;font-weight:600;margin-top:auto}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.code{font-size:11.5px;color:color-mix(in srgb,var(--acc) 60%,#fff);font-weight:600;letter-spacing:.3px}
.n{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.card.empty{opacity:.62}
.pin{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:#ffffff66;transition:.15s}
.pin:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:#fff}
.pin.on{color:#fbbf24;text-shadow:0 0 12px #fbbf2499}

/* subject page */
.banner{position:relative;display:flex;align-items:center;gap:14px;margin:18px 0 14px;padding:18px;border-radius:22px;border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));
  background:radial-gradient(260px 160px at 0 0,color-mix(in srgb,var(--acc) 35%,transparent),transparent),var(--panel)}
.banner .ico{width:64px;height:64px;font-size:34px;border-radius:19px}
.banner h1{font-size:clamp(22px,5.5vw,34px);margin:0;line-height:1.2;letter-spacing:0}
.banner .pin{top:10px;right:10px}
.start{width:100%;margin-bottom:14px;padding:13px;font-size:16px;border-radius:14px}
.list{display:grid;gap:8px}
.chap{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:.15s;min-height:60px;animation:in .35s both}
.chap:hover{border-color:var(--acc);box-shadow:0 6px 22px color-mix(in srgb,var(--acc) 25%,transparent)}
.chap i{flex:none;font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 70%,var(--s1)),color-mix(in srgb,var(--acc) 30%,var(--s1)))}
.chap span{flex:1;line-height:1.4}
.chap u{text-decoration:none;color:var(--muted);font-size:22px}
.msg{color:var(--muted);text-align:center;padding:44px 12px;border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}

/* viewer */
.viewer{display:flex;flex-direction:column;height:calc(100dvh - 57px)}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.vbar .t{flex:1;min-width:0;text-align:center;font-size:14px;line-height:1.3;padding:4px 8px;border-radius:12px}
.vbar .t:hover{background:var(--panel2)}
.vbar .t b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vbar .t small{display:block;color:var(--muted);font-size:12px}
.vframe{flex:1;background:#fff;position:relative}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.spin{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:14px;z-index:2}
.spin:before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--cyan);animation:r .8s linear infinite;margin-bottom:-60px}
@keyframes r{to{transform:rotate(360deg)}}
.sheet-bg{position:fixed;inset:0;z-index:50;background:#000a;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:75dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 14px;animation:up .25s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.sheet h3{margin:2px 4px 12px;font-size:16px}
.sheet .chap{margin-bottom:8px;animation:none}
.sheet .chap.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel))}
footer{text-align:center;color:#5d709b;font-size:13px;padding:24px}
@media(max-width:520px){.logo{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;display:inline-block}
.ic.fill{fill:currentColor}
.ico{color:#fff}.ico .ic{width:56%;height:56%}
.pin .ic{width:21px;height:21px}.pin.on{text-shadow:none;filter:drop-shadow(0 0 8px #fbbf2499)}
.btn .ic,.cont small .ic{width:1em;height:1em;vertical-align:-.12em}
/* ดาว: เด่นชัด */
.chip.star{width:46px;padding:0;display:grid;place-items:center;color:#fbbf24;background:#fbbf2420;border-color:#fbbf2480}
.chip.star .ic{width:22px;height:22px}
.chip.star.on{background:linear-gradient(135deg,#f59e0b,#fcd34d);color:#451a03;border-color:transparent;box-shadow:0 0 20px #fbbf2480}
.pin{width:44px;height:44px;top:5px;right:5px;background:#00000045;border:1.5px solid #fbbf2466;color:#fbbf24b3}
.pin:hover{background:#fbbf2426;color:#fbbf24}
.pin:active{transform:scale(.88)}
.pin .ic{width:25px;height:25px}
.pin.on{background:#fbbf2426;border-color:#fbbf24;color:#fbbf24;box-shadow:0 0 16px #fbbf2466}
.pin.on .ic{filter:drop-shadow(0 0 6px #fbbf24aa)}
.banner .pin{top:10px;right:10px}
/* โลโก้วิชาแบบสี */
.sic{display:block;width:100%;height:100%}
.ico{background:color-mix(in srgb,var(--acc) 14%,var(--s0))!important;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ico .sic{width:72%;height:72%}
.sheet h3 .sic{display:inline-block;width:1.4em;height:1.4em;vertical-align:-.35em}

/* ===== หน้ารวมแบบแบ่งหมวด: 1 หมวด = 1 บรรทัด เลื่อนซ้าย-ขวา ===== */
.groups{display:grid;gap:26px}
.grp-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.grp-h i{flex:none;width:5px;height:22px;border-radius:3px;background:var(--acc);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 60%,transparent)}
.grp-h h3{margin:0;font-size:17px;font-weight:600}
.grp-h .n{margin-left:auto;font-size:13px}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 14px 10px;margin:0 -14px;scroll-padding-left:14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:156px;min-height:150px;scroll-snap-align:start}
.rail .card b{font-size:15px}
@media(min-width:640px){.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;overflow:visible;padding:2px 0;margin:0}.rail .card{width:auto}}
.card:focus-visible,.chip:focus-visible,.chap:focus-visible,.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.chips{position:relative}
.tools{box-shadow:0 10px 18px -14px #000}

/* ===== ปุ่มย้อนกลับ (แดง) ===== */
#backBtn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ef4444,#dc2626);border:0;color:#fff;font-weight:700;padding:8px 16px 8px 11px;border-radius:12px;box-shadow:0 6px 18px #ef444459,inset 0 1px 0 #ffffff40}
#backBtn:hover{box-shadow:0 8px 24px #ef444499,inset 0 1px 0 #ffffff40}
#backBtn:active{transform:scale(.95)}
#backBtn .ic{width:20px;height:20px;stroke-width:2.8}
/* ===== ปุ่มก่อนหน้า / ถัดไป ===== */
.vbar{gap:8px;padding:10px;background:linear-gradient(var(--s3),var(--s1));box-shadow:0 6px 20px #0008;position:relative;z-index:3}
.nav{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:none;min-width:48px;height:46px;padding:0 14px;border-radius:14px;font-weight:700;font-size:14px;color:#fff;border:1px solid transparent;transition:.15s}
.nav .ic{width:20px;height:20px;stroke-width:2.8}
.nav.next{background:linear-gradient(135deg,#2563eb,#0ea5e9);box-shadow:0 6px 20px #2563eb66,inset 0 1px 0 #ffffff40}
.nav.prev{background:var(--line);border-color:#3b82f688}
.nav:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px #38bdf866}
.nav:active:not(:disabled){transform:scale(.94)}
.nav:disabled{opacity:.28;box-shadow:none;background:var(--s3);border-color:var(--line)}
.vbar .t{background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);padding:5px 10px;min-height:46px}
.vbar .t b{font-size:15px}
@media(max-width:430px){.nav span{display:none}.nav{width:48px;padding:0}}

/* ===== แนวตั้ง: แต่ละหมวดเรียงลงมา การ์ด 2 คอลัมน์ ===== */
html{overflow-x:hidden}
body{overflow-x:clip;max-width:100%}
.rail,.rail.x{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:visible;scroll-snap-type:none;padding:2px 0;margin:0}
.rail .card{width:auto;min-height:140px}
@media(min-width:640px){.rail{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
/* ===== ปุ่มดาว: เบาลง ไม่สว่างจ้า ===== */
.pin{width:36px;height:36px;top:8px;right:8px;background:color-mix(in srgb,var(--ink) 5%,transparent);border:1px solid #ffffff1f;color:#ffffff59;box-shadow:none}
.pin .ic{width:19px;height:19px}
.pin:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:#fbbf24b3}
.pin.on{background:#fbbf2414;border-color:#fbbf2447;color:#fbbf24b8;box-shadow:none}
.pin.on .ic,.banner .pin.on .ic{filter:none}
.banner .pin{top:10px;right:10px}
.chip.star{background:color-mix(in srgb,var(--ink) 5%,transparent);border-color:#ffffff1f;color:#fbbf24a6}
.chip.star.on{background:#fbbf2426;color:#fbbf24;border-color:#fbbf2459;box-shadow:none}

/* ===== ปุ่มย้อนกลับ: ฟ้า (ทับสีแดงเดิม) ===== */
#backBtn{background:linear-gradient(135deg,#38bdf8,#2563eb)!important;color:#fff!important;border:0!important;box-shadow:0 6px 18px #2563eb66,inset 0 1px 0 #ffffff55!important}
#backBtn:hover{box-shadow:0 8px 26px #38bdf899,inset 0 1px 0 #ffffff55!important}

/* ===== หน้าวิชา: ใช้ง่ายขึ้น ===== */
#backBtn{min-height:38px;padding:6px 14px 6px 10px!important;font-size:14px}
.banner{gap:14px;margin:14px 0 14px;padding:14px;border-radius:20px}
.banner .ico{width:56px;height:56px;border-radius:17px}
.banner h1{font-size:clamp(20px,5.4vw,28px);padding-right:48px}
.pills2{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.p-code,.p-n{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 11px}
.p-code{color:color-mix(in srgb,var(--acc) 55%,#fff);background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.p-n{color:var(--muted);border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 3%,transparent)}
.startcard{display:flex;align-items:center;gap:12px;width:100%;min-height:70px;margin:0 0 20px;padding:12px 16px 12px 12px;border-radius:18px;text-align:left;color:#fff;background:linear-gradient(135deg,#2563eb,#0ea5e9);box-shadow:0 10px 26px #2563eb59,inset 0 1px 0 #ffffff40;transition:.15s}
.startcard:hover{box-shadow:0 12px 32px #38bdf866,inset 0 1px 0 #ffffff40}
.startcard:active{transform:scale(.98)}
.startcard .play{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ffffff2b}
.startcard .play .ic{width:20px;height:20px}
.startcard .tx{flex:1;min-width:0}
.startcard small{display:block;font-size:12.5px;opacity:.9}
.startcard b{display:block;font-size:16.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.startcard .go{font-size:28px;line-height:1;opacity:.9}
.list{gap:10px}
.chap{min-height:68px;padding:12px 14px;border-radius:18px}
.chap i{width:42px;height:42px;border-radius:13px;font-size:16px}
.chap span{font-size:16px;font-weight:500}
.chap u{font-size:26px;color:color-mix(in srgb,var(--acc) 70%,#fff)}
.chap.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,var(--panel))}
.tag{display:inline-block;margin-left:8px;font-style:normal;font-size:11.5px;font-weight:600;color:#fff;background:color-mix(in srgb,var(--acc) 80%,#000);border-radius:999px;padding:1px 9px;vertical-align:1px}



/* ===== ความสวยระดับพรีเมียม (โครงเดิม ฟังก์ชันเดิม) ===== */
body:before{background:
 radial-gradient(700px 420px at 8% -8%,#2563eb59,transparent),
 radial-gradient(560px 360px at 100% 2%,#06b6d440,transparent),
 radial-gradient(520px 420px at 50% 112%,#7c3aed2b,transparent),
 linear-gradient(color-mix(in srgb,var(--ink) 3%,transparent) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,color-mix(in srgb,var(--ink) 3%,transparent) 1px,transparent 1px) 0 0/44px 44px}
.top{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,#3b82f666,#22d3ee66,#3b82f622) 1}
.logo{font-weight:700;letter-spacing:1.5px}
/* hero */

.chip{background:linear-gradient(var(--s2),var(--s1));border-color:var(--line2)}

/* หัวหมวด */
.groups{gap:32px}

.grp-h h3{flex:none;font-size:18px;font-weight:700;letter-spacing:.2px}
.grp-h::after{content:"";flex:1;height:1px;order:1;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 55%,transparent),transparent)}
.grp-h .n{order:2;margin-left:0;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);color:color-mix(in srgb,var(--acc) 40%,#fff);background:color-mix(in srgb,var(--acc) 12%,transparent);padding:1px 11px;border-radius:999px}
/* การ์ดวิชา */
.card{border:1px solid transparent;border-radius:22px;
 background:radial-gradient(180px 130px at 0 0,color-mix(in srgb,var(--acc) 30%,transparent),transparent) padding-box,linear-gradient(155deg,var(--s3),var(--s0)) padding-box,linear-gradient(150deg,color-mix(in srgb,var(--acc) 75%,#fff),color-mix(in srgb,var(--acc) 14%,var(--line)) 45%,var(--line)) border-box;
 background-clip:padding-box,padding-box,border-box;
 box-shadow:0 10px 26px #00000059,inset 0 1px 0 color-mix(in srgb,var(--ink) 7%,transparent)}
.card::after{content:"";position:absolute;right:-34px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%);pointer-events:none}
.card>.ico,.card>b,.card>.tags{position:relative;z-index:1}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 38px color-mix(in srgb,var(--acc) 34%,#000)}
.card b{font-weight:600;font-size:15.5px}
.ico{background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 34%,var(--s0)),color-mix(in srgb,var(--acc) 10%,var(--s0)))!important;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent)!important;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 30%,transparent),inset 0 1px 0 #ffffff26!important}
.code{font-weight:700;color:color-mix(in srgb,var(--acc) 55%,#fff)}
.n{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.pin{background:#0000004d;border-color:#ffffff1f}
/* หน้าวิชา */
.banner{border:1px solid transparent;border-radius:26px;padding:18px;
 background:radial-gradient(320px 200px at 0 0,color-mix(in srgb,var(--acc) 38%,transparent),transparent) padding-box,linear-gradient(155deg,var(--s3),var(--s0)) padding-box,linear-gradient(140deg,color-mix(in srgb,var(--acc) 85%,#fff),color-mix(in srgb,var(--acc) 12%,var(--line)) 50%,var(--line)) border-box;
 background-clip:padding-box,padding-box,border-box;box-shadow:0 16px 40px color-mix(in srgb,var(--acc) 20%,#000)}
.banner .ico{width:62px;height:62px;border-radius:19px}
.banner h1{letter-spacing:-.3px}
.startcard{position:relative;overflow:hidden;background:linear-gradient(135deg,#2f6df0,#0ea5e9);box-shadow:0 12px 30px #2563eb66,inset 0 1px 0 #ffffff59}
.startcard::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff33 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,65%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.row h2{font-weight:700}
.chap{border:1px solid transparent;border-radius:18px;
 background:linear-gradient(var(--s2),var(--s1)) padding-box,linear-gradient(135deg,color-mix(in srgb,var(--acc) 38%,var(--line)),var(--line) 60%) border-box;
 background-clip:padding-box,border-box;box-shadow:0 4px 14px #0000003d}

/* ===== สวยเพิ่มอีกขั้น ===== */
body:after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;will-change:transform;
 background:radial-gradient(380px 380px at 22% 30%,#3b82f629,transparent 70%),radial-gradient(340px 340px at 78% 62%,#22d3ee22,transparent 70%),radial-gradient(300px 300px at 40% 90%,#a855f71f,transparent 70%);
 animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
/* ส่วนหัว */
h1{font-size:clamp(42px,11.5vw,76px);line-height:1;margin:16px 0 12px}
.hero{position:relative}
.hero:before{content:"";position:absolute;left:-40px;top:6px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#3b82f640,transparent 70%);filter:blur(10px);z-index:-1;pointer-events:none}
.logo span{text-shadow:0 0 18px #22d3ee80}
.sico{flex:none;color:#7da2e0}
.search:focus-within .sico{color:#38bdf8}
/* ไอคอนหมวด */
.grp-h i{display:none}
.gi{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
 background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 40%,var(--s0)),color-mix(in srgb,var(--acc) 12%,var(--s0)));
 border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 32%,transparent),inset 0 1px 0 #ffffff2e}
.gi .ic{width:20px;height:20px;color:#fff;stroke-width:2.2}
.grp-h h3{font-size:19px}
/* การ์ด: แสงวาบตอนกด/ชี้ + เส้นสีด้านล่าง */
.card:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 38%,#ffffff1f 50%,transparent 62%);transform:translateX(-130%);transition:transform .9s}
.card:hover:before,.card:active:before{transform:translateX(130%)}
.card .tags{margin-top:2px}
.card.empty .ico{filter:saturate(.6)}
.card:active{transform:scale(.97)}
.ico .sic{filter:drop-shadow(0 3px 6px #0006)}
/* ต่อจากครั้งก่อน: ลูกศรมีวงเรือง */
.cont .go{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#38bdf826;border:1px solid #38bdf866;font-size:24px;line-height:1;box-shadow:0 0 18px #38bdf840}
.cont b{font-size:17px}
/* หน้าวิชา */
.banner:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);pointer-events:none}
.banner>*{position:relative;z-index:1}
.banner>.pin{position:absolute}
.startcard .play{background:#ffffff33;box-shadow:0 0 0 6px color-mix(in srgb,var(--ink) 8%,transparent)}
.startcard b{font-size:17px}
.chap u{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--acc) 16%,transparent);color:color-mix(in srgb,var(--acc) 60%,#fff);font-size:22px;line-height:1;flex:none}
.chap:hover u{background:var(--acc);color:#fff}
.chap span{font-weight:500}
/* ปุ่ม */
.btn,.chip,.card,.chap,.startcard,.nav{transition:transform .2s,box-shadow .25s,border-color .2s,background .2s}
#backBtn:active{transform:scale(.94)}
.logo{text-shadow:0 0 22px #3b82f650}
footer{background:linear-gradient(90deg,transparent,#3b82f61f,transparent);border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);margin-top:20px}
:focus-visible{outline:2px solid #38bdf8;outline-offset:3px;border-radius:12px}
@media(prefers-reduced-motion:reduce){body:after,.startcard:after{animation:none!important}}

 border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:none;background-clip:border-box;
 background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 42%,var(--s0)),color-mix(in srgb,var(--acc) 10%,var(--s0)))}

/* ===== popup วิชา (กดการ์ดวิชาแล้วขึ้นรายการบท ไม่เต็มหน้า) ===== */
#subjBg{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center}

#subjBg.hidden{display:none!important}
#subjBox{position:relative;width:100%;max-width:560px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;padding:8px 14px 20px;background:linear-gradient(var(--s3),var(--s1));border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -20px 60px #000a;animation:msheet .34s cubic-bezier(.22,1,.36,1);will-change:transform;-webkit-overflow-scrolling:touch}

#subjBox .mclose{position:absolute;right:0;top:0;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 7%,transparent);border:1px solid var(--line);color:var(--ink)}

@keyframes mfade{from{opacity:0}}

/* ตอนเปิด popup: หยุดอนิเมชันพื้นหลังที่กินเครื่อง + ปิดอนิเมชันซ้อนข้างใน */
html.m-open body:after,html.m-open .kicker:before{animation:none}

/* ================= อัปเกรด: ส่วนหัว + ปุ่มย้อนกลับ + แถบเลื่อนบท ================= */
.top-in{padding:9px 14px;min-height:60px;gap:12px}
.viewer{height:calc(100dvh - 61px)}
.tools{top:60px}
header.top{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 88%,transparent),color-mix(in srgb,var(--bg) 70%,transparent));-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-image:none;border-bottom:1px solid transparent;box-shadow:0 10px 30px -18px #000c}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,#3b82f6aa 22%,#22d3eecc 50%,#a78bfa99 78%,transparent)}
html[data-theme="light"] header.top{background:linear-gradient(180deg,#ffffffe6,#eaf1fbd9);box-shadow:0 10px 26px -18px #1b2a5066}

/* --- ปุ่มย้อนกลับ --- */
header.top #backBtn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;gap:9px;height:42px;min-height:42px;padding:0 17px 0 6px!important;border-radius:999px!important;border:1px solid #ffffff40!important;
 background:linear-gradient(135deg,#2f6df0 0%,#2455d6 55%,#4338ca 100%)!important;color:#fff!important;font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;
 box-shadow:0 10px 24px -6px #2563ebb3,0 2px 6px #0003,inset 0 1px 0 #ffffff80,inset 0 -3px 8px #1e1b4b55!important;
 transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .25s,filter .2s}
header.top #backBtn::before{content:"";position:absolute;inset:0 0 50% 0;z-index:-1;border-radius:inherit;background:linear-gradient(#ffffff3d,#ffffff00);pointer-events:none}
header.top #backBtn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:46%;z-index:-1;background:linear-gradient(105deg,transparent,#ffffff59,transparent);transform:translateX(-140%) skewX(-18deg);pointer-events:none}
header.top #backBtn:hover::after,header.top #backBtn:focus-visible::after{transform:translateX(330%) skewX(-18deg);transition:transform .75s ease}
header.top #backBtn:hover{filter:brightness(1.07) saturate(1.1);box-shadow:0 14px 30px -6px #2563ebcc,0 2px 6px #0003,inset 0 1px 0 #ffffff99,inset 0 -3px 8px #1e1b4b55!important}
header.top #backBtn:active{transform:scale(.93);filter:brightness(.97)}
header.top #backBtn .bk-ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffffff2e;box-shadow:inset 0 1px 0 #ffffff66,0 2px 5px #0003;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s}
header.top #backBtn .bk-ic .ic{width:18px;height:18px;stroke-width:3}
header.top #backBtn:hover .bk-ic{transform:translateX(-3px);background:#ffffff40}
header.top #backBtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
html[data-theme="light"] header.top #backBtn{background:linear-gradient(135deg,#2f6df0 0%,#2250d8 55%,#3730a3 100%)!important;box-shadow:0 8px 20px -6px #2250d899,0 1px 3px #1b2a5040,inset 0 1px 0 #ffffff80,inset 0 -3px 8px #1e1b4b4d!important}

/* --- ปุ่มสลับธีม --- */
header.top .themebtn{position:relative;overflow:hidden;width:42px;height:42px;min-height:42px;border-radius:14px;color:#fbbf24;
 background:linear-gradient(145deg,color-mix(in srgb,var(--ink) 12%,transparent),color-mix(in srgb,var(--ink) 3%,transparent));
 border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 0 #ffffff26,0 8px 18px -8px #000a}

header.top .themebtn:hover svg{transform:rotate(18deg) scale(1.08)}
header.top .themebtn.tgl svg{animation:tspin .6s cubic-bezier(.3,1.3,.5,1)}
@keyframes tspin{from{transform:rotate(-140deg) scale(.3);opacity:0}}
html[data-theme="light"] header.top .themebtn{color:#4f46e5;background:linear-gradient(145deg,#fff,#e9effc);border-color:var(--line2);box-shadow:inset 0 1px 0 #fff,0 8px 18px -10px #1b2a5066}

/* --- ปุ่มแจ้งเตือน --- */
header.top #pushBtn{color:var(--muted);transition:transform .15s,background .25s,color .25s,border-color .25s,box-shadow .25s}
header.top #pushBtn:active{transform:scale(.88)}
header.top #pushBtn svg{filter:none;transform-origin:50% 8%}
header.top #pushBtn:hover svg{transform:none}
header.top #pushBtn::after{content:"";position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid var(--bg,#0b1020);transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}

header.top #pushBtn.busy{opacity:.7;pointer-events:none}
header.top #pushBtn.ring svg{animation:bring .7s ease}
@keyframes bring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(11deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}

.viewer .vbar{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px 13px;border-bottom:0;z-index:3;
 background:linear-gradient(180deg,var(--s3),var(--s1));box-shadow:0 14px 30px -16px #000d,inset 0 1px 0 #ffffff0f;animation:vbIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes vbIn{from{opacity:0;transform:translateY(-12px)}}
.viewer .vbar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.viewer .vbar::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);border-radius:0 3px 3px 0;background:linear-gradient(90deg,#3b82f6,#22d3ee 60%,#a78bfa);box-shadow:0 0 12px #22d3ee99;transition:width .55s cubic-bezier(.22,1,.36,1)}
.viewer .vbar.single::before,.viewer .vbar.single::after{display:none}

.viewer .vbar .nav{position:relative;flex:none;width:48px;min-width:48px;height:48px;padding:0;border-radius:16px;display:grid;place-items:center;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer}

.viewer .vbar .nav:hover:not(:disabled){transform:translateY(-2px)}
.viewer .vbar .nav.prev:hover:not(:disabled) .ic{transform:translateX(-3px)}
.viewer .vbar .nav.next:hover:not(:disabled) .ic{transform:translateX(3px)}
.viewer .vbar .nav:active:not(:disabled){transform:scale(.92)}
.viewer .vbar .nav:disabled{opacity:1;cursor:not-allowed;color:color-mix(in srgb,var(--ink) 30%,transparent);background:color-mix(in srgb,var(--ink) 5%,transparent);border-color:color-mix(in srgb,var(--ink) 9%,transparent);box-shadow:none}

 background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 8%,transparent),color-mix(in srgb,var(--ink) 2%,transparent));border:1px solid var(--line2);
 box-shadow:inset 0 1px 0 #ffffff14,0 8px 18px -12px #000b;transition:transform .15s,border-color .2s,box-shadow .2s}

 background:linear-gradient(135deg,#2f6df0,#2455d6 55%,#4338ca);box-shadow:0 12px 26px -6px #2563ebb3,0 2px 6px #0004,inset 0 1px 0 #ffffff80;

.search .x{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:20px;line-height:1;padding:0;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.search .x.hidden{display:none}
/* 2) แถบค้นหาไม่ลอยตามตอนเลื่อน */
.tools{position:static!important;top:auto!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:none!important}
/* 3) ปุ่มย้อนกลับใหม่: เรียบ สะอาด */
header.top #backBtn,html[data-theme="light"] header.top #backBtn{
  height:40px;min-height:40px;padding:0 16px 0 5px!important;gap:8px;border-radius:999px!important;
  background:var(--panel)!important;color:var(--ink)!important;font-size:14.5px;font-weight:600;letter-spacing:.2px;
  border:1px solid var(--line2)!important;box-shadow:0 2px 8px #0000001f!important;filter:none;
  transition:transform .15s,border-color .2s,box-shadow .2s,background .2s}
header.top #backBtn::before,header.top #backBtn::after{display:none!important}
header.top #backBtn .bk-ic{width:30px;height:30px;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;box-shadow:0 2px 6px #2563eb55;transition:transform .2s}
header.top #backBtn .bk-ic .ic{width:16px;height:16px;stroke-width:2.8}
header.top #backBtn:hover,html[data-theme="light"] header.top #backBtn:hover{filter:none;border-color:#38bdf8!important;box-shadow:0 4px 14px #2563eb33!important}
header.top #backBtn:hover .bk-ic{transform:translateX(-2px);background:linear-gradient(135deg,#3b82f6,#06b6d4)}
header.top #backBtn:active{transform:scale(.95)}
.noanim,.noanim *{animation:none!important}

/* ===== โหมดมืดแบบถนอมสายตา ===== */
html:not([data-theme="light"]){
  --bg:#121826;--s0:#171e30;--s1:#1b2338;--s2:#202a42;--s3:#27324d;
  --panel:var(--s1);--panel2:#27324d;--line:#2c3856;--line2:#3b4a6e;
  --ink:#e4e9f4;--muted:#a3b0cc;--blue:#5b9bf8;--cyan:#5cc8f5}
/* พื้นหลัง: ลดแสงจ้าและเส้นตาราง หยุดการเคลื่อนไหว */
html:not([data-theme="light"]) body:before{background:
  radial-gradient(700px 420px at 8% -8%,#3b6fd426,transparent),
  radial-gradient(560px 360px at 100% 2%,#22a6c41c,transparent),
  linear-gradient(#ffffff08 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/44px 44px}
html:not([data-theme="light"]) body:after{display:none}
/* ข้อความอ่านง่ายขึ้น */
html:not([data-theme="light"]) .row .count,html:not([data-theme="light"]) .p-n{color:#cdd6ea}
html:not([data-theme="light"]) .p-code{color:#eef2fb}
html:not([data-theme="light"]) .chap u,html:not([data-theme="light"]) .sico{color:#9db0d8}
html:not([data-theme="light"]) footer{color:#7f8fb3}
html:not([data-theme="light"]) .pill b{color:#8fd8f7}
html:not([data-theme="light"]) h1 span{background:linear-gradient(90deg,#8ab8ff,#5cc8f5);-webkit-background-clip:text;background-clip:text;filter:none}
html:not([data-theme="light"]) .kicker{box-shadow:none;color:#8fd8f7}
/* การ์ด: เส้นขอบชัดขึ้น เงาและแสงเรืองเบาลง */
html:not([data-theme="light"]) .card{box-shadow:var(--st),0 2px 8px #0000002e}
html:not([data-theme="light"]) .card:hover{box-shadow:var(--st),0 8px 22px #00000050}
html:not([data-theme="light"]) .ico{box-shadow:0 4px 10px #0000003a,inset 0 1px 0 #ffffff1a!important}
html:not([data-theme="light"]) .grp-h i{box-shadow:none}
html:not([data-theme="light"]) .chip{color:#c4cee6}
html:not([data-theme="light"]) .chip.on{color:#fff;box-shadow:0 4px 12px #2563eb40,inset 0 1px 0 #ffffff40}
html:not([data-theme="light"]) .search input::placeholder{color:#8794b3}
html:not([data-theme="light"]) .search:focus-within{box-shadow:0 0 0 3px #5cc8f526}
html:not([data-theme="light"]) .startcard::after{display:none}
html:not([data-theme="light"]) #subjBox{box-shadow:0 -12px 36px #0007}

/* ===== บันทึกการบ้าน ===== */
header.top .hwbtn{position:relative;flex:none;width:42px;height:42px;min-height:42px;padding:0;display:grid;place-items:center;border-radius:14px;margin-left:auto;color:var(--cyan)}
header.top .hwbtn svg{width:21px;height:21px}
header.top .hwbtn + .themebtn{margin-left:0}
header.top .themebtn + .hwbtn{margin-left:0}
/* ไม่มีแสง/เงาสีฟ้าตอนกดหรือแตะค้าง — เขียวเฉพาะตอนเปิดแจ้งเตือนอยู่ */
header.top .hwbtn:hover:not(:disabled),header.top #pushBtn:not(.on):hover:not(:disabled){box-shadow:none;border-color:var(--line)}
header.top .hwbtn,header.top #pushBtn{outline:0}
.hwbtn .bd{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:linear-gradient(135deg,#f43f5e,#ef4444);color:#fff;font-size:11px;font-weight:700;line-height:19px;text-align:center;border:2px solid var(--bg);box-shadow:0 2px 8px #ef444466}
#hwBg{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#hwBg.hidden{display:none!important}
#hwBg .mback{position:absolute;inset:0;background:#000b;animation:mfade .25s both}
html[data-theme="light"] #hwBg .mback{background:#0b1b4080}
#hwBox{position:relative;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:6px 14px 22px;background:linear-gradient(var(--s3),var(--s1));border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;animation:msheet .34s cubic-bezier(.22,1,.36,1);box-shadow:0 -16px 50px #0006}
html[data-theme="light"] #hwBox{box-shadow:0 -8px 30px #1b2a5026}
@media(min-width:640px){#hwBg{align-items:center;padding:20px}#hwBox{border-radius:28px;border-bottom:1px solid var(--line2);max-height:86dvh;animation:mpop .25s ease}#hwBox .grab{display:none}}
.hw-top{touch-action:none;cursor:grab}
#hwBox .grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 8px}
.hw-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hw-head .logo2{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#3b82f6,#06b6d4);box-shadow:0 8px 20px #3b82f655}
.hw-head .logo2 svg{width:23px;height:23px}
.hw-head h2{margin:0;font-size:18px;line-height:1.2}
.hw-head small{display:block;color:var(--muted);font-size:12.5px}
.hw-x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 7%,transparent);border:1px solid var(--line);color:var(--ink)}
.hw-x svg{width:15px;height:15px}
.hw-prog{height:7px;border-radius:9px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;margin:0 0 14px}
.hw-prog i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#22c55e,#06b6d4);transition:width .5s cubic-bezier(.22,1,.36,1)}
.hw-form{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
.hw-row{display:flex;gap:8px}
.hw-form input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;outline:0;transition:.15s}
.hw-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.hw-add{flex:none;width:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:26px;line-height:1;background:linear-gradient(135deg,#2563eb,#0ea5e9);box-shadow:0 8px 18px #2563eb55;transition:.12s}
.hw-add:active{transform:scale(.92)}
.hw-lab{font-size:11.5px;color:var(--muted);margin:0 0 5px 3px;font-weight:500;letter-spacing:.2px}
.hw-form>*,.hw-form div{min-width:0}
.hw-pick{display:flex;align-items:center;gap:10px;width:100%;padding:7px 12px 7px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);text-align:left;transition:.14s;color:var(--ink)}
.hw-pick:active{transform:scale(.98)}
.hw-pick.has{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--s2))}
.hw-pick .si,.pc .si{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c,#64748b) 18%,transparent)}
.hw-pick .si .sic,.pc .si .sic{width:24px;height:24px;display:block}
.hw-pick .si svg.gen,.pc .si svg.gen{width:17px;height:17px;color:var(--muted)}
.hw-pick .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hw-pick .nm small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.hw-pick .chev{flex:none;width:18px;height:18px;color:var(--muted)}
#hwBg:has(#hwPick) #hwBox{overflow:hidden!important;touch-action:none}
#hwPick{position:absolute;inset:0;z-index:3;overscroll-behavior:contain;display:flex;align-items:flex-end;justify-content:center}
#hwPick .pb{position:absolute;inset:0;background:#0009;animation:mfade .2s both;touch-action:none;overscroll-behavior:contain}
#hwPick .ps{position:relative;width:100%;max-width:480px;max-height:78dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 14px 20px;background:linear-gradient(var(--s3),var(--s1));border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;animation:msheet .3s cubic-bezier(.22,1,.36,1)}
@media(min-width:640px){#hwPick{align-items:center;padding:20px}#hwPick .ps{border-radius:26px;border-bottom:1px solid var(--line2);animation:mpop .22s ease}}
#hwPick .pt{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.hw-dt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dtb{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:4px 10px 4px 6px;border-radius:12px;text-align:left;font-size:13.5px;font-weight:600;color:var(--ink);transition:.14s;border:1.5px solid #3b82f666;background:linear-gradient(135deg,#3b82f61f,#0ea5e914)}
.dtb.t{border-color:#f59e0b66;background:linear-gradient(135deg,#f59e0b1f,#f9731614)}
.dtb svg{flex:none;width:22px;height:22px}
.dtb .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtb .v.ph{font-weight:400;color:var(--muted)}
.dtb:active{transform:scale(.98)}
#hwPick .cal-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
#hwPick .cal-h b{flex:1;text-align:center;font-size:14.5px}
.cnav{display:inline-flex;align-items:center;gap:2px;padding:5px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--s2);font-size:11.5px;font-weight:600;color:var(--ink)}
.cnav svg{width:12px;height:12px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g.sl{animation:calL .22s ease}.cal-g.sr{animation:calR .22s ease}
@keyframes calL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes calR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.cal-w{font-size:11px;font-weight:700;text-align:center;padding:2px 0;color:var(--muted)}
.cal-w.su{color:#ef4444}.cal-w.sa{color:#8b5cf6}
.cd{height:36px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink);background:transparent;border:1.5px solid transparent;transition:.12s}
.cd.past{color:var(--muted);opacity:.65}
.cd.today{border-color:#f59e0b;color:#d97706;font-weight:700}
.cd.on{background:linear-gradient(135deg,#2563eb,#0ea5e9);border-color:transparent;color:#fff;font-weight:700;opacity:1;box-shadow:0 6px 14px -4px #2563eb99}
.cd:active{transform:scale(.92)}
.cd.empty{pointer-events:none}
.pa{display:flex;gap:8px;margin-top:10px}
.pa button{flex:1;padding:8px 6px;border-radius:12px;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--s2);color:var(--ink)}
.pa button.pri{background:linear-gradient(135deg,#2563eb,#0ea5e9);border-color:transparent;color:#fff}
.pa button.wrn{color:#ef4444;border-color:#ef444444;background:#ef444414}
.tv{text-align:center;font-size:30px;font-weight:700;letter-spacing:2px;margin:0 0 6px;background:linear-gradient(135deg,#f59e0b,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.wlab{display:grid;grid-template-columns:1fr 24px 1fr;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.wrow{position:relative;display:grid;grid-template-columns:1fr 24px 1fr;height:180px}
.wrow .colon{align-self:center;text-align:center;font-size:22px;font-weight:700;color:var(--muted)}
.wband{position:absolute;left:0;right:0;top:72px;height:36px;border-radius:12px;pointer-events:none;background:linear-gradient(135deg,#f59e0b24,#f9731624);border:1.5px solid #f59e0b77}
.wheel{height:180px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;padding:72px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wi{height:36px;display:grid;place-items:center;scroll-snap-align:center;font-size:17px;font-weight:500;color:var(--muted);cursor:pointer;user-select:none}
.wi.on{color:var(--ink);font-weight:700;font-size:19px}
#hwPick .pt b{font-size:17px}
#hwPick .pt .hw-x{margin-left:auto}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:11px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--c,#64748b) 35%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--c,#64748b) 13%,var(--panel)),var(--panel));text-align:left;min-width:0;transition:.14s}
.pc:active{transform:scale(.96)}
.pc.on{border-color:var(--c,var(--blue));box-shadow:0 6px 18px color-mix(in srgb,var(--c,var(--blue)) 32%,transparent)}
.pc .si{width:40px;height:40px}
.pc .si .sic{width:29px;height:29px}
.pc b{display:block;font-size:13.5px;line-height:1.3;font-weight:600;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc small{color:var(--muted);font-size:11px;margin-top:-4px}
.pc.gen{grid-column:1/-1;flex-direction:row;align-items:center}
.hw-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:14px 0 10px;border-radius:14px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.hw-tab{padding:8px;border-radius:11px;font-size:13.5px;color:var(--muted);font-weight:500;transition:.15s}
.hw-tab.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 2px 8px #0003}
.hw-tab b{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);font-size:12px}
.hw-tab.on b{background:var(--blue);color:#fff}
.hw-list{display:grid;gap:9px}
.hw-sw{position:relative;border-radius:18px;overflow:hidden;user-select:none;-webkit-user-select:none}
.hw-sw.new{animation:hwin .35s cubic-bezier(.22,1,.36,1)}
@keyframes hwin{from{opacity:0;transform:translateY(-10px) scale(.97)}}
.hw-sw .bg{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 20px;color:#fff;font-weight:600;font-size:14px;opacity:0;transition:opacity .12s}
.hw-sw .bg svg{width:22px;height:22px;transition:transform .15s}
.hw-sw .bg.l{background:linear-gradient(90deg,#16a34a,#22c55e);justify-content:flex-start}
.hw-sw .bg.r{background:linear-gradient(270deg,#dc2626,#ef4444);justify-content:flex-end}
.hw-sw[data-dir=r] .bg.l,.hw-sw[data-dir=l] .bg.r{opacity:1}
.hw-sw[data-ok="1"] .bg svg{transform:scale(1.3)}
.hw-it{position:relative;display:flex;align-items:center;gap:11px;padding:11px 10px 11px 14px;border:1px solid var(--line);border-left:5px solid var(--c,#64748b);border-radius:18px;background:var(--panel);touch-action:pan-y;cursor:grab;will-change:transform}
.hw-it.late{background:color-mix(in srgb,#ef4444 7%,var(--panel))}
.hw-ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;transition:.18s}
.hw-ck svg{width:15px;height:15px}
.hw-ck:hover{border-color:#22c55e}
.hw-it.done .hw-ck{background:#22c55e;border-color:#22c55e;color:#fff;transform:scale(1.06)}
.hw-it .tx{min-width:0;flex:1}
.hw-it .tx b{display:block;font-size:15px;line-height:1.35;word-break:break-word;font-weight:600}
.hw-it.done .tx b{text-decoration:line-through;color:var(--muted);font-weight:500}
.hw-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.hw-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 3px;border-radius:999px;font-size:11.5px;font-weight:500;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink);max-width:100%}
.hw-tag .sic{width:17px;height:17px;display:block;flex:none}
.hw-tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hw-it .tx{display:flex;flex-direction:column}
.hw-it .tx .hw-meta{order:-1;margin:0 0 5px}
.hw-it .hw-tag{font-size:14.5px;font-weight:600;padding:3px 12px 3px 4px;gap:6px}
.hw-it .hw-tag .sic{width:22px;height:22px}
.hw-it .hw-due{font-size:12.5px}
.hw-due{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--muted)}
.hw-due.late{background:#ef444422;color:#ef4444}
.hw-due.soon{background:#f59e0b24;color:#d97706}
.hw-due.ok{background:#22c55e22;color:#16a34a}
.hw-del{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted);opacity:.7}
.hw-del:hover{color:#ef4444;opacity:1}
.hw-del svg{width:16px;height:16px}
.hw-empty{text-align:center;color:var(--muted);padding:26px 8px 18px;font-size:14px;line-height:1.7}
.hw-empty big{display:block;width:72px;height:72px;margin:0 auto 8px}
.hw-empty big svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px #0ea5e944)}
.hw-due.tm{background:#6366f122;color:#6366f1}
.hw-newbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px 16px;border-radius:16px;font-size:15.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2563eb,#0ea5e9);box-shadow:0 10px 22px -6px #2563eb88,inset 0 1px 0 #ffffff55;transition:.12s}
.hw-newbtn:active{transform:scale(.98)}
.hw-newbtn svg{width:20px;height:20px}
#hwBg:has(#hwNew) #hwBox{overflow:hidden!important}
#hwNew{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:16px}
#hwNew .nb{position:absolute;inset:0;background:#000a;animation:mfade .2s both}
#hwNew .nc{position:relative;width:100%;max-width:420px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 18px;border-radius:24px;background:linear-gradient(var(--s3),var(--s1));border:1px solid var(--line2);box-shadow:0 24px 60px #0009;animation:mpop .24s cubic-bezier(.22,1,.36,1)}
#hwNew .nh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
#hwNew .nh b{font-size:17px}
#hwNew .nh .hw-x{margin-left:auto}
#hwNew .hw-form{padding:0;border:0;background:transparent}
#hwNew input[type=text]{width:100%}
#hwNew textarea{width:100%;min-height:72px;resize:none;font:inherit;font-size:15px;line-height:1.45;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:10px 13px;outline:0;transition:.15s}
#hwNew textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.hw-desc{font-size:12.5px;line-height:1.4;color:var(--muted);margin:2px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.hw-it[data-open]{cursor:pointer;transition:transform .12s}
.hw-it[data-open]:active{transform:scale(.985)}
.hw-chev{flex:none;display:grid;place-items:center;color:var(--muted);opacity:.7}
.hw-chev svg{width:16px;height:16px}
.hw-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 10px;font-size:12px;color:var(--muted)}
.hw-st{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:#f59e0b22;color:#d97706}
.hw-st.ok{background:#22c55e22;color:#16a34a}
.pa button.okb{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:transparent;color:#fff}
#hwNew .nc.view{padding-top:0}
.vhero{position:relative;margin:0 -16px 14px;padding:16px 16px 18px;border-radius:24px 24px 0 0;color:#fff;background:linear-gradient(135deg,var(--c,#3b82f6),color-mix(in srgb,var(--c,#3b82f6) 55%,#6366f1));overflow:hidden}
.vhero:before{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:#ffffff1f}
.vhero:after{content:"";position:absolute;right:30px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:#ffffff14}
.vhero .cap{position:relative;font-size:12px;font-weight:600;letter-spacing:.3px;opacity:.85;margin:0 0 12px}
.vhero .vx{position:absolute;right:12px;top:12px;z-index:1;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:#ffffff2e}
.vhero .vx svg{width:16px;height:16px}
.vhero .vs{position:relative;display:flex;align-items:center;gap:12px}
.vhero .vi{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:#ffffffeb;box-shadow:0 8px 18px -6px #0006}
.vhero .vi .sic{width:34px;height:34px}
.vhero .vi svg.gen,.vhero .vi>svg:not(.sic){width:26px;height:26px;color:var(--c,#3b82f6)}
.vhero .vt2{min-width:0}
.vhero .vt2 small{display:block;font-size:15px;font-weight:600;opacity:.95;margin-bottom:2px}
.vhero .vt2 b{display:block;font-size:19px;line-height:1.3;word-break:break-word;font-weight:700}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.vt{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:14px;border:1px solid var(--line);background:var(--s2)}
.vt svg{flex:none;width:30px;height:30px}
.vt small{display:block;font-size:11.5px;color:var(--muted)}
.vt b{display:block;font-size:14px;font-weight:700}
.vlab{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 5px 2px}
.vdesc{border-left:4px solid var(--c,#3b82f6)!important}
.vfoot{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 4px}
.vtitle{font-size:18px;font-weight:700;line-height:1.35;word-break:break-word;margin:0 0 8px}
.vdesc{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;padding:11px 13px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin:0 0 10px}
.vdesc.none{color:var(--muted);font-style:italic}
.vbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--s2)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 13px;font-size:13.5px}
.vrow+.vrow{border-top:1px solid var(--line)}
.vrow span{color:var(--muted);flex:none}
.vrow b{font-weight:600;text-align:right;min-width:0}
#hwNew .nc.cf{max-width:340px;text-align:center}
.cf-i{width:60px;height:60px;margin:2px auto 10px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;box-shadow:0 10px 22px -6px #ef444499}
.cf-i svg{width:28px;height:28px}
.cf-t{font-size:18px;font-weight:700;margin:0 0 4px}
.cf-n{font-size:14px;font-weight:600;word-break:break-word;margin:0 0 6px}
.cf-s{font-size:12.5px;color:var(--muted);margin:0 0 4px;line-height:1.5}
.pa button.dng{background:linear-gradient(135deg,#dc2626,#ef4444);border-color:transparent;color:#fff}
.hw-hint{text-align:center;color:var(--muted);font-size:11.5px;margin-top:10px}
.hw-clear{display:block;margin:12px auto 0;color:var(--muted);font-size:12.5px;text-decoration:underline}
#hwToast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:14px;background:#111827;color:#fff;font-size:13.5px;box-shadow:0 10px 30px #0008;animation:hwin .25s both;white-space:nowrap}
#hwToast button{color:#38bdf8;font-weight:700;padding:2px 6px}

/* ปิดการดึงลงเพื่อรีเฟรช (กดโลโก้แทน) */
html,body{overscroll-behavior-y:none}

/* ปุ่มรีเฟรช (ข้างปุ่มย้อนกลับ) */
header.top .refbtn{flex:none;width:40px;height:40px;min-height:40px;padding:0;display:grid;place-items:center;border-radius:14px;color:var(--cyan)}
header.top .refbtn svg{width:20px;height:20px;transition:transform .5s cubic-bezier(.3,1.2,.5,1)}
header.top .refbtn.rot svg{transform:rotate(360deg)}
html[data-theme="light"] header.top .refbtn{color:#2563eb;background:linear-gradient(145deg,#fff,#e9effc);border-color:var(--line2);box-shadow:inset 0 1px 0 #fff,0 8px 18px -10px #1b2a5066}
header.top .refbtn:active{transform:scale(.93)}
header.top #pushBtn{color:var(--cyan)}
#pushBtn + #themeBtn{margin-left:0}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="btn hidden" id="backBtn" aria-label="ย้อนกลับ"></button>
    <button class="btn refbtn hidden" id="refBtn" type="button" aria-label="รีเฟรช" title="รีเฟรช"></button>
    <div class="logo" id="logo">◆ CONTENT <span>HUB</span></div>
    <div class="crumb" id="crumb"></div>
    <button class="btn themebtn" id="pushBtn" type="button" aria-label="เปิดการแจ้งเตือน" title="เปิดการแจ้งเตือน"></button>
    <button class="btn hwbtn" id="hwBtn" type="button" aria-label="บันทึกการบ้าน" title="บันทึกการบ้าน"></button>
    <button class="btn themebtn" id="themeBtn" type="button"></button>
  </div>
</header>

<main id="home" class="wrap">
  <section class="hero">
    <span class="kicker" id="tagline">เนื้อหา ม.4 เทอม 2</span>
    <h1>CONTENT <span>HUB</span></h1>
    <div class="pills"><span class="pill"><b id="sSub">0</b> วิชา</span><span class="pill"><b id="sChap">0</b> บทเรียน</span></div>
    <button class="cont hidden" id="cont"></button>
  </section>
  <div class="tools">
    <label class="search"><svg class="sico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="ค้นหาวิชา หรือรหัสวิชา" autocomplete="off"><button class="x hidden" id="clr" aria-label="ล้าง">×</button><kbd id="kbd">/</kbd></label>

  </div>
  <div class="row"><h2>วิชาทั้งหมด</h2><span class="count" id="count"></span></div>

</main>

<main id="subjectView" class="wrap hidden"></main>

<section id="chapterView" class="viewer hidden">
  <div class="vbar">
    <button class="nav prev" id="prevBtn" aria-label="บทก่อนหน้า"></button>
    <button class="t" id="vtitle" aria-label="เลือกบทเรียน"></button>
    <button class="nav next" id="nextBtn" aria-label="บทถัดไป"></button>
  </div>
  <div class="vframe" id="vframe"></div>
</section>

const SUBJ_KEYS = {"globe":["ภูมิศาสตร์","ภูมิภาค","สังคม","พลเมือง","geograph","world","earth"],"planet":["ดาราศาสตร์","อวกาศ","โลกและ","space","astro"],"bio":["ชีว","พันธุ","bio","สิ่งมีชีวิต"],"flask":["เคมี","chem","วิทยาศาสตร์","science"],"atom":["ฟิสิกส์","physic","ไฟฟ้า"],"chart":["ฟังก์ชัน","สถิติ","กราฟ","function","statistic"],"calc":["คณิต","math","เลข","แคลคูลัส"],"code":["คอมพิวเตอร์","เทคโนโลยี","โปรแกรม","code","computer","ดิจิทัล"],"history":["ประวัติศาสตร์","history","ศาสนา","วัฒนธรรม"],"thai":["ภาษาไทย","วรรณ","ไทย"],"english":["อังกฤษ","english","ภาษา","language"],"music":["ดนตรี","music","นาฏศิลป์"],"art":["ศิลปะ","art","วาด","ทัศนศิลป์"],"sport":["พละ","กีฬา","พลศึกษา","sport"],"health":["สุขศึกษา","สุขภาพ","health"],"coin":["เศรษฐ","การเงิน","บัญชี","econom","ธุรกิจ"],"tools":["การงาน","อาชีพ","ช่าง","งานบ้าน","tool"]};
const SUBJ_EMOJI = {"🌍":"globe","🌏":"globe","🌎":"globe","🌐":"globe","⚛️":"atom","⚛":"atom","🧪":"flask","🔬":"bio","🧬":"bio","🧮":"calc","➗":"calc","📐":"calc","📈":"chart","📊":"chart","📖":"book","📚":"book","📕":"book","💻":"code","🖥️":"code","🏛️":"history","🎵":"music","🎶":"music","🎨":"art","⚽":"sport","🏀":"sport","❤️":"health","🪐":"planet","🚀":"planet","💰":"coin","🛠️":"tools","🔧":"tools","🇹🇭":"thai","🔤":"english"};
const subjIconKey = (v,name) => {
  v=String(v==null?"":v).trim();
  if(SUBJ_ICONS[v]) return v;
  const t=String(name||"").toLowerCase();
  for(const k in SUBJ_KEYS){ if(SUBJ_KEYS[k].some(w=>t.includes(w))) return k; }
  return SUBJ_EMOJI[v]||"book";
};
// icon: ชื่อโลโก้ (globe planet atom flask bio calc chart code history thai english music art sport health coin tools book) หรือ <svg>…</svg> เอง; ถ้าไม่ระบุ/ไม่รู้จัก จะเดาจากชื่อวิชา
const subjIcon = (v,name) => { v=String(v==null?"":v).trim(); if(v.startsWith("<svg")) return v; return '<svg class="sic" viewBox="0 0 64 64" aria-hidden="true">'+SUBJ_ICONS[subjIconKey(v,name)]+'</svg>'; };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  remove(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- วิชารายการโปรด ---------- */
let pins = [];
try { pins = JSON.parse(store.get('pins') || '[]'); } catch(e) {}
const isPinned = id => pins.includes(id);
function togglePin(id){
  pins = isPinned(id) ? pins.filter(x => x !== id) : [...pins, id];
  store.set('pins', JSON.stringify(pins));
}

/* ---------- หมวดวิชา (ดูจากตัวอักษรแรกของรหัสวิชา) ---------- */
const CATS = [
  {k:'all', name:'ทั้งหมด'},
  {k:'pin', name:'รายการโปรด'},
  {k:'lang', name:'ภาษา', color:'#f59e0b', test:c => 'ทอ'.includes(c)},
  {k:'math', name:'คณิตศาสตร์', color:'#a78bfa', test:c => c === 'ค'},
  {k:'sci',  name:'วิทยาศาสตร์', color:'#22c55e', test:c => c === 'ว'},
  {k:'soc',  name:'สังคม', color:'#f97316', test:c => c === 'ส'},
  {k:'other',name:'สุขภาพ/ศิลปะ/การงาน', color:'#ec4899', test:c => 'พศง'.includes(c)}
];
const catOf = s => CATS.slice(2).find(c => c.test((s.code || '')[0] || '')) || CATS[CATS.length - 1];
let activeCat = 'all';

const views = ['home','subjectView','chapterView'];
function show(v){
  views.forEach(x => $(x).classList.toggle('hidden', x !== v));
  $('foot').classList.toggle('hidden', v === 'chapterView');
  $('backBtn').classList.toggle('hidden', v === 'home');
  $('refBtn').classList.toggle('hidden', v === 'home');
  $('logo').classList.toggle('hidden', v !== 'home' && matchMedia('(max-width:520px)').matches);
  if (v !== 'chapterView') window.scrollTo(0, 0);
  updTop();
}

/* ---------- หน้าแรก ---------- */
function renderContinue(){
  const b = $('cont');
  b.classList.add('hidden'); return;
  const last = (store.get('last') || '').split('/');
  const s = SUBJECTS.find(x => x.id === last[0]);
  const c = s && s.chapters.find(x => x.id === last[1]);
  if (!c) { b.classList.add('hidden'); return; }
  b.style.setProperty('--acc', catOf(s).color);
  b.innerHTML = `<span class="ico">${subjIcon(s.icon, s.name)}</span><span><small>${ico('play','fill')} เรียนล่าสุด · กดเพื่อเรียนต่อ</small><b>${esc(c.title)}</b><small style="color:var(--muted)">${esc(s.name)}</small></span><span class="go">›</span>`;
  b.onclick = () => go(`/${s.id}/${c.id}`);
  b.classList.remove('hidden');
}

function renderChips(){
  $('chips').innerHTML = CATS.map(c => c.k === 'pin'
    ? `<button class="chip star ${c.k === activeCat ? 'on' : ''}" data-k="pin" aria-label="รายการโปรด">${ico('star','fill')}</button>`
    : `<button class="chip ${c.k === activeCat ? 'on' : ''}" data-k="${c.k}">${c.color ? `<i class="cdot" style="background:${c.color}"></i>` : ''}${esc(c.name)}</button>`).join('');
}

function cardHTML(s, i){
  return `<button class="card ${s.chapters.length ? '' : 'empty'}" data-id="${esc(s.id)}" style="--acc:${catOf(s).color};animation-delay:${Math.min(i, 8) * 30}ms">
      <span class="wm">${subjIcon(s.icon, s.name)}</span>
      <span class="ico">${subjIcon(s.icon, s.name)}</span>
      <span class="pin ${isPinned(s.id) ? 'on' : ''}" data-pin="${esc(s.id)}" role="button" aria-label="รายการโปรด">${isPinned(s.id) ? ico('star','fill') : ico('star')}</span>
      <b>${esc(s.name)}</b>
      <span class="tags"><span class="code">${esc(s.code)}</span><span class="n">${s.chapters.length ? s.chapters.length + ' บท' : 'เร็ว ๆ นี้'}</span></span>
    </button>`;
}
function groupHTML(name, color, items, star){
  return `<section class="grp" style="--acc:${color}">
    <div class="grp-h"><span class="gi">${ico({"ภาษา":"book","คณิตศาสตร์":"sigma","วิทยาศาสตร์":"atom","สังคม":"globe","รายการโปรด":"star"}[name] || "spark", star ? "fill" : "")}</span><h3>${esc(name)}</h3><span class="n count">${items.length} วิชา</span></div>
    <div class="rail">${items.map(cardHTML).join('')}</div></section>`;
}
function renderGrid(keepAnim){
  $('grid').classList.toggle('noanim', !!keepAnim);
  const q = $('q').value.trim().toLowerCase();
  $('clr').classList.toggle('hidden', !q);
  $('kbd').classList.toggle('hidden', !!q);
  const match = s => !q || (s.name + ' ' + s.code).toLowerCase().includes(q);
  let out = '', total = 0;
  if (activeCat === 'pin') {
    const l = SUBJECTS.filter(s => isPinned(s.id) && match(s));
    total = l.length;
    out = l.length ? groupHTML('รายการโปรด', '#fbbf24', l, true) : '';
  } else {
    const favs = activeCat === 'all' && !q ? SUBJECTS.filter(s => isPinned(s.id)) : [];
    if (favs.length) out += groupHTML('รายการโปรด', '#fbbf24', favs, true);
    CATS.slice(2).forEach(c => {
      if (activeCat !== 'all' && activeCat !== c.k) return;
      const l = SUBJECTS.filter(s => catOf(s).k === c.k && match(s));
      if (!l.length) return;
      total += l.length;
      out += groupHTML(c.name, c.color, l);
    });
  }
  $('grid').innerHTML = out || (activeCat === 'pin' && !q ? '' : `<div class="msg">ไม่พบวิชาที่ค้นหา<br>ลองพิมพ์ชื่ออื่น หรือเลือก "ทั้งหมด"</div>`);
  $('count').textContent = `${total} วิชา`;
}

function renderHome(){
  gridDirty = false;
  $('sSub').textContent = SUBJECTS.length;
  $('sChap').textContent = SUBJECTS.reduce((n, s) => n + s.chapters.length, 0);
  renderContinue(); renderChips(); renderGrid();
  $('crumb').textContent = '';
  show('home');
}

/* ---------- หน้าวิชา ---------- */
function renderSubject(s){
  const cat = catOf(s);
  const last = (store.get('last') || '').split('/');
  const resume = null;
  const target = resume || s.chapters[0];
  $('subjectView').style.setProperty('--acc', cat.color);
  $('subjectView').innerHTML = `
    <div class="banner"><span class="ico">${subjIcon(s.icon, s.name)}</span><div><h1>${esc(s.name)}</h1><div class="pills2"><span class="p-code">${esc(s.code)}</span><span class="p-n">${s.chapters.length} บทเรียน</span></div></div>
      <button class="pin ${isPinned(s.id) ? 'on' : ''}" id="spin" aria-label="รายการโปรด">${isPinned(s.id) ? ico('star','fill') : ico('star')}</button></div>
    ${s.chapters.length ? `
    <button class="startcard" data-id="${esc(target.id)}">
      <span class="play">${ico('play','fill')}</span>
      <span class="tx"><small>${resume ? 'เรียนต่อจากครั้งก่อน' : 'เริ่มเรียน'}</small><b>${esc(target.title)}</b></span>
      <span class="go">›</span>
    </button>
    <div class="row"><h2>บทเรียนทั้งหมด</h2><span class="count">${s.chapters.length} บท</span></div>
    <div class="list">${s.chapters.map((c, i) => `<button class="chap ${resume && c.id === resume.id ? 'cur' : ''}" data-id="${esc(c.id)}" style="animation-delay:${Math.min(i, 12) * 30}ms"><i>${i + 1}</i><span>${esc(c.title)}${resume && c.id === resume.id ? '<em class="tag">ล่าสุด</em>' : ''}</span><u>›</u></button>`).join('')}</div>`
    : `<div class="msg">ยังไม่มีบทเรียนในวิชานี้<br>เร็ว ๆ นี้</div>`}`;
  $('spin').onclick = () => { togglePin(s.id); renderSubject(s); };
  $('crumb').textContent = s.name;
  show('subjectView');
}

/* ---------- หน้าอ่านบทเรียน ---------- */
function openSheet(s, i){
  $('sheet').style.setProperty('--acc', catOf(s).color);
  $('sheet').innerHTML = `<h3>${subjIcon(s.icon, s.name)} ${esc(s.name)}</h3>` + s.chapters.map((c, k) =>
    `<button class="chap ${k === i ? 'cur' : ''}" data-go="/${esc(s.id)}/${esc(c.id)}"><i>${k + 1}</i><span>${esc(c.title)}</span></button>`).join('');
  $('sheetBg').classList.remove('hidden');
  const cur = $('sheet').querySelector('.cur'); if (cur) cur.scrollIntoView({block:'center'});
}
const closeSheet = () => $('sheetBg').classList.add('hidden');
$('sheetBg').addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { closeSheet(); go(b.dataset.go); }
  else if (e.target === $('sheetBg')) closeSheet();
});

function renderChapter(s, i){
  const c = s.chapters[i];
  const url = k => `/${s.id}/${s.chapters[k].id}`;
  store.set('last', `${s.id}/${c.id}`);

// ปัดลงเพื่อปิด popup (มือถือ): ใช้ transform อย่างเดียว อัปเดตผ่าน requestAnimationFrame
(function(){
  const box = $('subjBox'), back = mBack();
  let sy = 0, dy = 0, drag = false, fromHandle = false, ly = 0, lt = 0, vel = 0, raf = 0;
  const apply = () => {
    raf = 0;
    box.style.transform = dy ? `translate3d(0,${dy}px,0)` : '';
    back.style.opacity = String(Math.max(0, 1 - dy / Math.max(260, box.offsetHeight)));
  };
  box.addEventListener('touchstart', e => {
    if (!isMobile() || closing || e.touches.length !== 1) { sy = 0; return; }
    sy = ly = e.touches[0].clientY; lt = e.timeStamp; dy = 0; vel = 0; drag = false;
    fromHandle = !!e.target.closest('.mtop');
  }, {passive:true});
  box.addEventListener('touchmove', e => {
    if (!sy) return;
    const y = e.touches[0].clientY;
    if (!drag) {
      if (!fromHandle && box.scrollTop > 0) { sy = y; return; }          // กำลังเลื่อนรายการอยู่
      if (y - sy > 5) { drag = true; sy = y; box.style.transition = 'none'; back.style.transition = 'none'; }  // sy=y → ไม่กระโดดตอนเริ่มลาก
      else return;
    }
    dy = Math.max(0, y - sy);
    const dt = e.timeStamp - lt;
    if (dt > 0) vel = 0.7 * vel + 0.3 * ((y - ly) / dt);
    ly = y; lt = e.timeStamp;
    if (!raf) raf = requestAnimationFrame(apply);
    e.preventDefault();
  }, {passive:false});
  const end = () => {
    if (!drag) { sy = 0; return; }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    sy = 0; drag = false;
    const h = box.offsetHeight || 1;
    if (dy > Math.min(140, h * 0.25) || vel > 0.6) {
      closing = true;                                                    // ปล่อยต่อจากตำแหน่งนิ้ว
      const dur = Math.max(0.16, Math.min(0.28, 0.28 * (1 - dy / h)));
      box.style.transition = `transform ${dur}s cubic-bezier(.3,.7,.4,1)`;
      back.style.transition = `opacity ${dur}s linear`;
      box.style.transform = 'translate3d(0,100%,0)'; back.style.opacity = '0';
      setTimeout(() => { if (!$('subjBg').classList.contains('hidden')) closeSubj(); }, dur * 1000);
    } else {
      box.style.transition = 'transform .3s cubic-bezier(.22,1,.36,1)';
      back.style.transition = 'opacity .3s';
      box.style.transform = ''; back.style.opacity = '';
      dy = 0;
    }
  };
  box.addEventListener('touchend', end);
  box.addEventListener('touchcancel', end);
})();

function isChapPath(p){
  const a = p.split('/').filter(Boolean).map(decodeURIComponent);
  const s = SUBJECTS.find(x => x.id === a[0]);
  return !!(s && a[1] && s.chapters.some(c => c.id === a[1]));
}
function go(path, st){
  const willChap = isChapPath(path);
  if (willChap && isChapPath(location.pathname)) history.replaceState(history.state, '', path);   // บท→บท: ไม่เพิ่ม history
  else history.pushState(st || (willChap ? {c:1} : null), '', path);
  route();
}
function route(){
  closeSheet();
  const parts = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const s = SUBJECTS.find(x => x.id === parts[0]);
  const homeUp = !$('home').classList.contains('hidden') && $('grid').children.length > 0;
  if (!s) {
    hideSubjModal();
    if (homeUp) { if (gridDirty) { renderGrid(); gridDirty = false; } $('crumb').textContent = ''; return; }   // กลับมาจาก popup: ไม่เด้งขึ้นบนสุด
    return renderHome();
  }
  if (parts[1]) {
    const i = s.chapters.findIndex(c => c.id === parts[1]);
    if (i >= 0) { hideSubjModal(); return renderChapter(s, i); }
  }
  // /<วิชา> = หน้าแรกอยู่ข้างหลัง + popup รายการบท
  if (!homeUp) renderHome();
  openSubjModal(s);
}

const LOCK_CSS = '*{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}input,textarea{-webkit-user-select:text!important;user-select:text!important}';

    d.addEventListener('contextmenu', e => { if (!isField(e.target)) e.preventDefault(); });

    d.addEventListener('dragstart', e => e.preventDefault());
  } catch(err) {}
}
