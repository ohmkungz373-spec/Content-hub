<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06090e"><title>คลังเนื้อหา ม.4 เทอม 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06090e;--pn:#0d121a;--pn2:#121924;--ln:#1b273a;--ln2:#253a5c;--tx:#ecf1f8;--mu:#b09399;--r:#236de5;--hot:#5496ff;--deep:#12489f;--gl:rgba(35,109,229,.38);--head:"Chakra Petch","Noto Sans Thai",sans-serif;--sans:"Noto Sans Thai",system-ui,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;color-scheme:dark}
body{margin:0;font-family:var(--sans);color:var(--tx);background:var(--bg);min-height:100vh;padding-bottom:var(--sb);-webkit-tap-highlight-color:transparent}
::selection{background:var(--r);color:#ffffff}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 44vmax at 88% -8%,rgba(35,109,229,.24),transparent 62%),radial-gradient(50vmax 40vmax at -8% 108%,rgba(18,72,159,.28),transparent 62%),var(--bg)}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(120,172,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,172,255,.045) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(#000000,transparent 75%);mask-image:linear-gradient(#000000,transparent 75%)}
.appbar{position:sticky;top:0;z-index:20;padding-top:var(--st);background:rgba(6,9,14,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.appbar:after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:var(--r);box-shadow:0 0 12px var(--r)}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
.appbar .wrap{height:58px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:.04em}
.logo{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--deep),var(--r));box-shadow:0 0 18px var(--gl)}
.hero{padding:40px 0 6px}
.hero h1{font-family:var(--head);font-weight:700;font-size:clamp(36px,8.5vw,68px);line-height:1.12;margin:0 0 10px;text-shadow:0 0 36px var(--gl)}
.hero h1:after{content:"";display:block;width:72px;height:5px;margin-top:14px;background:var(--r);transform:skewX(-30deg);box-shadow:0 0 16px var(--r)}
.hero p{margin:0;color:var(--mu);font-size:16px}
.stats{display:flex;gap:10px;margin-top:22px}
.stat{min-width:104px;padding:10px 16px 10px 14px;background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--r);border-radius:4px}
.stat b{display:block;font-family:var(--head);font-size:28px;line-height:1.1;color:var(--hot)}.stat span{font-size:12.5px;color:var(--mu)}
.search{position:relative;margin-top:22px}
.search input{width:100%;height:54px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);padding:0 50px 0 48px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:#7d666b}
.search input:focus{outline:0;border-color:var(--r);box-shadow:0 0 0 3px rgba(35,109,229,.22),0 0 24px rgba(35,109,229,.18)}
.search .gl{position:absolute;left:16px;top:17px;color:var(--hot);pointer-events:none}
.clear{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:4px;background:var(--pn2);color:var(--mu)}.clear:hover{color:var(--tx)}.clear[hidden]{display:none}
.filters{display:flex;gap:8px;overflow:auto;padding:14px 0 4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;padding:8px 15px;border-radius:4px;background:var(--pn);border:1px solid var(--ln);font-weight:600;font-size:13.5px;color:var(--mu);transition:.15s}
.filter:hover{border-color:var(--ln2);color:var(--tx)}
.filter.on{color:#ffffff;border-color:var(--r);background:linear-gradient(135deg,var(--deep),var(--r));box-shadow:0 0 18px var(--gl)}
.cont{width:100%;display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px 16px;border-radius:8px;text-align:left;color:#ffffff;background:linear-gradient(110deg,var(--deep),var(--r));border:1px solid rgba(140,184,255,.5);box-shadow:0 12px 34px rgba(35,109,229,.32);transition:transform .15s,box-shadow .15s}
.cont:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(35,109,229,.45)}
.cont .ic{font-size:28px;width:52px;height:52px;border-radius:6px;background:rgba(6,9,14,.35);display:grid;place-items:center;flex:none}
.cont small{display:block;opacity:.9;font-size:12px;font-weight:700}.cont b{display:block;font-size:16.5px;line-height:1.3}
.cont .go{margin-left:auto;background:var(--bg);color:var(--hot);font-family:var(--head);font-weight:700;padding:9px 16px;border-radius:4px;white-space:nowrap}
.sec{margin-top:30px}.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh h2{margin:0;font-family:var(--head);font-weight:600;font-size:20px}
.sh h2:before{content:"";display:inline-block;width:5px;height:18px;margin-right:10px;vertical-align:-2px;background:var(--r);transform:skewX(-20deg);box-shadow:0 0 10px var(--r)}
.sh span{font-size:12px;font-weight:600;color:var(--mu);border:1px solid var(--ln);padding:2px 10px;border-radius:4px}
.sh:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln2),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:930px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;text-align:left;min-height:136px;padding:14px;border-radius:4px;background:linear-gradient(165deg,var(--pn2),var(--pn));border:1px solid var(--ln);transition:transform .18s,border-color .18s,box-shadow .18s}
.card:before,.card:after{content:"";position:absolute;width:14px;height:14px;border:0 solid var(--r);transition:width .18s,height .18s}
.card:before{left:-1px;top:-1px;border-width:2px 0 0 2px}.card:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
.card:hover{transform:translateY(-3px);border-color:var(--ln2);box-shadow:0 10px 30px rgba(35,109,229,.2)}
.card:hover:before,.card:hover:after{width:26px;height:26px}
.card .em{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;font-size:25px;margin-bottom:16px;background:rgba(35,109,229,.1);border:1px solid rgba(35,109,229,.35)}
.card h3{margin:0;font-family:var(--head);font-weight:600;font-size:16.5px;line-height:1.3}.card p{margin:3px 0 0;font-size:12.5px;color:var(--mu)}
.empty{padding:34px 18px;border:1px dashed var(--ln2);border-radius:6px;text-align:center;color:var(--mu);background:rgba(13,18,26,.6)}.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}.empty code{color:var(--hot)}
.btn{margin-top:14px;padding:10px 20px;border-radius:4px;background:var(--r);color:#ffffff;font-weight:700}
.sp{padding:22px 18px 80px}
.back{padding:9px 16px;border-radius:4px;background:var(--pn);border:1px solid var(--ln);color:var(--hot);font-weight:700}.back:hover{border-color:var(--r)}
.sbanner{display:flex;gap:18px;align-items:center;margin:18px 0 20px;padding:22px;border-radius:8px;background:linear-gradient(120deg,rgba(35,109,229,.22),var(--pn) 60%);border:1px solid var(--ln2);border-left:4px solid var(--r);box-shadow:0 0 40px rgba(35,109,229,.12)}
.sbanner .em{width:80px;height:80px;flex:none;border-radius:8px;background:rgba(6,9,14,.5);border:1px solid rgba(35,109,229,.45);display:grid;place-items:center;font-size:44px;box-shadow:0 0 24px var(--gl)}
.sbanner h1{margin:0;font-family:var(--head);font-weight:700;font-size:clamp(26px,6vw,42px);line-height:1.15}.sbanner p{margin:5px 0 0;color:var(--mu);font-weight:600}
.start{display:block;width:100%;margin:0 0 18px;padding:15px;border-radius:6px;color:#ffffff;font-family:var(--head);font-weight:700;font-size:17px;background:linear-gradient(110deg,var(--deep),var(--r));border:1px solid rgba(140,184,255,.45);box-shadow:0 10px 28px rgba(35,109,229,.32);transition:transform .15s}.start:hover{transform:translateY(-2px)}
.ch{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 16px 12px 12px;margin:10px 0;border-radius:6px;background:var(--pn);border:1px solid var(--ln);transition:transform .15s,border-color .15s,background .15s}
.ch:hover{transform:translateX(4px);border-color:var(--r);background:var(--pn2)}
.ch .n{width:44px;height:44px;flex:none;border-radius:4px;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:17px;color:var(--hot);background:rgba(35,109,229,.1);border:1px solid rgba(35,109,229,.4)}
.ch b{display:block;font-size:15.5px;line-height:1.4;font-weight:600}.ch .ar{margin-left:auto;font-size:26px;color:var(--r)}
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);display:none}.reader.show{display:block}
.rbar{padding:calc(var(--st) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;background:var(--pn);border-bottom:1px solid var(--ln);position:relative}
.rbar:after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:var(--w,0%);background:var(--r);box-shadow:0 0 12px var(--r);transition:width .3s}
.rt{flex:1;min-width:0}.rt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-family:var(--head);font-weight:600}.rt span{font-size:11.5px;color:var(--mu)}
.rb{width:40px;height:40px;flex:none;border-radius:4px;background:var(--pn2);border:1px solid var(--ln);color:var(--tx);font-size:19px;font-weight:700;transition:.15s}.rb:hover{border-color:var(--r);color:var(--hot)}.rb:disabled{opacity:.3;cursor:not-allowed}
.reader iframe{display:block;width:100%;height:calc(100dvh - 60px - var(--st) - var(--sb));border:0;background:#ffffff}
@media(min-width:800px){.reader iframe{max-width:940px;margin:16px auto 0;border-radius:6px;border:1px solid var(--ln2);box-shadow:0 0 60px rgba(35,109,229,.18);height:calc(100dvh - 76px - var(--st) - var(--sb))}}
.picker{position:fixed;inset:0;z-index:60;display:none}.picker.show{display:block}.pb{position:absolute;inset:0;background:rgba(2,4,6,.7);backdrop-filter:blur(3px)}
.ps{position:absolute;left:0;right:0;bottom:0;max-height:80dvh;background:var(--pn);border:1px solid var(--ln2);border-top:2px solid var(--r);border-radius:12px 12px 0 0;display:flex;flex-direction:column;animation:up .22s ease;max-width:640px;margin:auto}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}.ph b{font-family:var(--head);font-size:18px}.ph button{width:36px;height:36px;border-radius:4px;background:var(--pn2);border:1px solid var(--ln)}
.pl{overflow:auto;padding:4px 14px calc(18px + var(--sb))}
.pi{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;margin:6px 0;border-radius:6px;border:1px solid var(--ln);text-align:left;transition:border-color .15s}.pi:hover{border-color:var(--ln2)}
.pi.on{border-color:var(--r);background:rgba(35,109,229,.1)}.pi .pn{width:32px;height:32px;border-radius:4px;background:var(--pn2);color:var(--hot);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:13px;flex:none}
.pi b{flex:1;font-size:14px;font-weight:600}.pi em{font-style:normal;font-size:11px;font-weight:700;color:#ffffff;background:var(--r);padding:3px 9px;border-radius:4px}
@media(max-width:600px){.sbanner{padding:18px 16px;gap:14px}.sbanner .em{width:60px;height:60px;font-size:32px}.cont .go{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<header class="appbar"><div class="wrap"><button class="brand" id="home" type="button" aria-label="กลับหน้าแรก"><span class="logo">📚</span>Content Hub</button></div></header>
<main id="main" class="wrap">
<section class="hero"><h1 id="title">คลังเนื้อหา ม.4 เทอม 2</h1><p id="subtitle">กำลังโหลด...</p>
<div class="stats"><div class="stat"><b id="nS">–</b><span>วิชา</span></div><div class="stat"><b id="nC">–</b><span>บทเรียน</span></div></div>
<div id="contBox"></div>
<div class="search"><svg class="gl" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="ค้นหาวิชา หรือบทเรียน..." autocomplete="off" aria-label="ค้นหา"><button id="clear" class="clear" type="button" hidden aria-label="ล้างคำค้นหา">✕</button></div>
<div id="filters" class="filters"></div></section>
<section id="shelves"></section>
</main>
<section id="sp" class="wrap sp" hidden></section>
<div id="reader" class="reader"><div class="rbar" id="rbar"><button id="rClose" class="rb" aria-label="ปิดบทเรียน">✕</button><div class="rt"><b id="rTitle">บทเรียน</b><span id="rSub"></span></div><button id="rPick" class="rb" aria-label="เลือกบท">☰</button><button id="rPrev" class="rb" aria-label="บทก่อนหน้า">‹</button><button id="rNext" class="rb" aria-label="บทถัดไป">›</button></div><iframe id="frame" title="บทเรียน"></iframe></div>
<div id="picker" class="picker"><div class="pb" id="pb"></div><div class="ps"><div class="ph"><b>เลือกบท</b><button id="pClose" aria-label="ปิด">✕</button></div><div class="pl" id="pl"></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st={data:null,group:'ทั้งหมด',q:'',s:null,i:0};let last=null;
try{last=JSON.parse(localStorage.getItem('hub-last')||'null')}catch{}
const save=()=>{try{localStorage.setItem('hub-last',JSON.stringify(last))}catch{}};
const col=()=>'#236de5';
async function load(){try{st.data=await(await fetch('/api/hub?x='+Date.now(),{cache:'no-store'})).json()}catch{st.data={title:'คลังเนื้อหา ม.4 เทอม 2',subtitle:'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ',groups:[],subjects:[]}}
route()}
function route(){const f=decodeURIComponent(location.hash.slice(1)),s=f&&st.data.subjects.find(x=>x.folder===f);hideReader();
if(s){st.s=s;$('#main').hidden=true;$('#sp').hidden=false;subjectPage()}else{st.s=null;$('#main').hidden=false;$('#sp').hidden=true;home()}scrollTo(0,0)}
addEventListener('hashchange',route);
function home(){const d=st.data,all=d.subjects,tc=all.reduce((n,s)=>n+s.chapters.length,0);
$('#title').textContent=d.title||'คลังเนื้อหา';$('#subtitle').textContent=d.subtitle||'รวมบทเรียนทั้งหมดไว้ในที่เดียว';$('#nS').textContent=all.length;$('#nC').textContent=tc;
const ls=last&&all.find(s=>s.folder===last.f),lc=ls&&ls.chapters[last.i];
$('#contBox').innerHTML=lc?`<button class="cont" id="cont"><span class="ic">${ls.icon}</span><span><small>▶ เรียนต่อจากครั้งก่อน</small><b>${esc(ls.name)} · ${esc(lc.title)}</b></span><span class="go">เรียนต่อ</span></button>`:'';
$('#filters').innerHTML=['ทั้งหมด',...(d.groups||[]).map(g=>g.name)].map(g=>`<button class="filter${g===st.group?' on':''}" data-g="${esc(g)}" style="--c:${g==='ทั้งหมด'?'#236de5':col(g)}">${esc(g)}</button>`).join('');shelves()}
function shelves(){const q=st.q.trim().toLowerCase(),by={};
st.data.subjects.filter(s=>(st.group==='ทั้งหมด'||s.group===st.group)&&(!q||(s.name+' '+s.group+' '+s.chapters.map(c=>c.title).join(' ')).toLowerCase().includes(q))).forEach(s=>(by[s.group]??=[]).push(s));
$('#shelves').innerHTML=Object.entries(by).map(([g,a])=>`<section class="sec"><div class="sh" style="--c:${col(g)}"><h2>${esc(g)}</h2><span>${a.length} วิชา</span></div><div class="grid">${a.map(card).join('')}</div></section>`).join('')||`<div class="empty"><b>ไม่พบรายการ 🔎</b>ลองเปลี่ยนคำค้นหรือเลือกกลุ่มอื่น<br><button id="reset" class="btn">ล้างตัวกรอง</button></div>`}
function card(s){const n=s.chapters.length;return `<button class="card" data-f="${esc(s.folder)}" style="--c:${col(s.group)}"><div class="em">${s.icon}</div><h3>${esc(s.name)}</h3><p>${n?n+' บท':'ยังไม่มีบท'}</p></button>`}
function subjectPage(){const s=st.s,c=col(s.group),r=last&&last.f===s.folder&&s.chapters[last.i]?last.i:-1;
$('#sp').innerHTML=`<button class="back" id="back">‹ ทุกวิชา</button><div class="sbanner" style="--c:${c}"><div class="em">${s.icon}</div><div><h1>${esc(s.name)}</h1><p>${esc(s.group)} · ${s.chapters.length} บท</p></div></div>`+
(s.chapters.length?`<button class="start" id="start">${r>=0?'▶ เรียนต่อ: '+esc(s.chapters[r].title):'▶ เริ่มเรียนบทแรก'}</button>`+s.chapters.map((x,i)=>`<button class="ch" data-i="${i}" style="--c:${c}"><span class="n">${i+1}</span><span><b>${esc(x.title)}</b></span><span class="ar">›</span></button>`).join(''):`<div class="empty"><b>ยังไม่มีบทเรียน 📭</b>วางไฟล์ .html / .md / .txt ใน <code>content/${esc(s.folder)}/</code> แล้วรีเฟรช</div>`);
$('#back').onclick=()=>{location.hash=''};const b=$('#start');if(b)b.onclick=()=>openCh(s,r>=0?r:0)}
function openCh(s,i){const c=s.chapters[i];if(!c)return;st.s=s;st.i=i;last={f:s.folder,i};save();
$('#rTitle').textContent=c.title;$('#rSub').textContent=s.name+' · บท '+(i+1)+'/'+s.chapters.length;$('#rbar').style.setProperty('--w',((i+1)/s.chapters.length*100)+'%');
$('#frame').src='/content/'+encodeURIComponent(s.folder)+'/'+c.file.split('/').map(encodeURIComponent).join('/');$('#reader').classList.add('show');document.body.style.overflow='hidden';
$('#rPrev').disabled=i<=0;$('#rNext').disabled=i>=s.chapters.length-1}
function hideReader(){$('#reader').classList.remove('show');$('#picker').classList.remove('show');document.body.style.overflow='';$('#frame').src='about:blank'}
function closeReader(){hideReader();if(st.s)subjectPage()}
function pick(){const s=st.s;$('#pl').innerHTML=s.chapters.map((c,i)=>`<button class="pi${i===st.i?' on':''}" data-i="${i}"><span class="pn">${i+1}</span><b>${esc(c.title)}</b>${i===st.i?'<em>กำลังอ่าน</em>':''}</button>`).join('');$('#picker').classList.add('show')}
$('#search').oninput=e=>{st.q=e.target.value;$('#clear').hidden=!st.q;shelves()};
$('#clear').onclick=()=>{st.q='';$('#search').value='';$('#clear').hidden=true;$('#search').focus();shelves()};
$('#home').onclick=()=>{if(location.hash)location.hash='';else{st.group='ทั้งหมด';st.q='';$('#search').value='';route()}};
$('#filters').onclick=e=>{const b=e.target.closest('[data-g]');if(b){st.group=b.dataset.g;home()}};
$('#contBox').onclick=e=>{if(e.target.closest('#cont')){const s=st.data.subjects.find(x=>x.folder===last.f);location.hash='#'+encodeURIComponent(s.folder);openCh(s,last.i)}};
$('#shelves').onclick=e=>{if(e.target.closest('#reset')){st.q='';st.group='ทั้งหมด';$('#search').value='';$('#clear').hidden=true;home();return}const b=e.target.closest('[data-f]');if(b)location.hash='#'+encodeURIComponent(b.dataset.f)};
$('#sp').onclick=e=>{const b=e.target.closest('[data-i]');if(b)openCh(st.s,+b.dataset.i)};
$('#rClose').onclick=closeReader;$('#rPick').onclick=pick;$('#pClose').onclick=$('#pb').onclick=()=>$('#picker').classList.remove('show');
$('#pl').onclick=e=>{const b=e.target.closest('[data-i]');if(b){$('#picker').classList.remove('show');openCh(st.s,+b.dataset.i)}};
