/* ===== หน้า main ===== */
.mhero{padding:22px 0 4px}
.mhero h1{font-size:clamp(30px,8vw,44px);margin:10px 0 8px;letter-spacing:-.5px}

.tcard .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,transparent)}

.tcard b{display:block;font-size:17px;line-height:1.3;margin-top:3px}

.tt td.b{border-radius:9px;background:color-mix(in srgb,var(--ink) 4%,var(--panel));color:var(--muted);font-size:13px;writing-mode:vertical-rl;letter-spacing:.3em}

const SUBJ_EMOJI = {"🌍":"globe","🌏":"globe","🌎":"globe","🌐":"globe","⚛️":"atom","⚛":"atom","🧪":"flask","🔬":"bio","🧬":"bio","🧮":"calc","➗":"calc","📐":"calc","📈":"chart","📊":"chart","📖":"book","📚":"book","📕":"book","💻":"code","🖥️":"code","🏛️":"history","🎵":"music","🎶":"music","🎨":"art","⚽":"sport","🏀":"sport","❤️":"health","🪐":"planet","🚀":"planet","💰":"coin","🛠️":"tools","🔧":"tools","🇹🇭":"thai","🔤":"english"};
const subjIconKey = (v,name) => {
  v=String(v==null?"":v).trim();
  if(SUBJ_ICONS[v]) return v;
  const t=String(name||"").toLowerCase();
  for(const k in SUBJ_KEYS){ if(SUBJ_KEYS[k].some(w=>t.includes(w))) return k; }
  return SUBJ_EMOJI[v]||"book";
};
// icon: ชื่อโลโก้ (globe planet atom flask bio calc chart code history thai english music art sport health coin tools book) หรือ <svg>…</svg> เอง; ถ้าไม่ระบุ/ไม่รู้จัก จะเดาจากชื่อวิชา
const subjIcon = (v,name) => { v=String(v==null?"":v).trim(); if(v.startsWith("<svg")) return v; return '<svg class="sic" viewBox="0 0 64 64" aria-hidden="true">'+SUBJ_ICONS[subjIconKey(v,name)]+'</svg>'; };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  remove(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- วิชารายการโปรด ---------- */
let pins = [];
try { pins = JSON.parse(store.get('pins') || '[]'); } catch(e) {}
const isPinned = id => pins.includes(id);
function togglePin(id){
  pins = isPinned(id) ? pins.filter(x => x !== id) : [...pins, id];
  store.set('pins', JSON.stringify(pins));
}

/* ---------- หมวดวิชา (ดูจากตัวอักษรแรกของรหัสวิชา) ---------- */
const CATS = [
  {k:'all', name:'ทั้งหมด'},
  {k:'pin', name:'รายการโปรด'},
  {k:'lang', name:'ภาษา', color:'#f59e0b', test:c => 'ทอ'.includes(c)},
  {k:'math', name:'คณิตศาสตร์', color:'#a78bfa', test:c => c === 'ค'},
  {k:'sci',  name:'วิทยาศาสตร์', color:'#22c55e', test:c => c === 'ว'},
  {k:'soc',  name:'สังคม', color:'#f97316', test:c => c === 'ส'},
  {k:'other',name:'สุขภาพ/ศิลปะ/การงาน', color:'#ec4899', test:c => 'พศง'.includes(c)}
];
const catOf = s => CATS.slice(2).find(c => c.test((s.code || '')[0] || '')) || CATS[CATS.length - 1];
let activeCat = 'all';

const views = ['mainView','home','ttView','chapterView'];
function show(v){
  views.forEach(x => $(x).classList.toggle('hidden', x !== v));
  $('foot').classList.toggle('hidden', v === 'chapterView');
  $('bnav').classList.toggle('hidden', v === 'chapterView');
  document.body.classList.toggle('has-bnav', v !== 'chapterView');
  $('bnav').querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === (v === 'mainView' ? 'main' : v)));
  $('backBtn').classList.toggle('hidden', v === 'mainView');
  $('logo').classList.toggle('hidden', v !== 'mainView' && matchMedia('(max-width:520px)').matches);
  if (v !== 'chapterView') window.scrollTo(0, 0);
  updTop();
}

/* ---------- หน้ารวมวิชา ---------- */

function renderChips(){
  $('chips').innerHTML = CATS.map(c => c.k === 'pin'
    ? `<button class="chip star ${c.k === activeCat ? 'on' : ''}" data-k="pin" aria-label="รายการโปรด">${ico('star','fill')}</button>`
    : `<button class="chip ${c.k === activeCat ? 'on' : ''}" data-k="${c.k}">${c.color ? `<i class="cdot" style="background:${c.color}"></i>` : ''}${esc(c.name)}</button>`).join('');
}

function cardHTML(s, i){
  return `<button class="card ${s.chapters.length ? '' : 'empty'}" data-id="${esc(s.id)}" style="--acc:${catOf(s).color};animation-delay:${Math.min(i, 8) * 30}ms">
      <span class="wm">${subjIcon(s.icon, s.name)}</span>
      <span class="ico">${subjIcon(s.icon, s.name)}</span>
      <span class="pin ${isPinned(s.id) ? 'on' : ''}" data-pin="${esc(s.id)}" role="button" aria-label="รายการโปรด">${isPinned(s.id) ? ico('star','fill') : ico('star')}</span>
      <b>${esc(s.name)}</b>
      <span class="tags"><span class="code">${esc(s.code)}</span><span class="n">${s.chapters.length ? s.chapters.length + ' บท' : 'เร็ว ๆ นี้'}</span></span>
    </button>`;
}
function groupHTML(name, color, items, star){
  return `<section class="grp" style="--acc:${color}">
    <div class="grp-h"><span class="gi">${ico({"ภาษา":"book","คณิตศาสตร์":"sigma","วิทยาศาสตร์":"atom","สังคม":"globe","รายการโปรด":"star"}[name] || "spark", star ? "fill" : "")}</span><h3>${esc(name)}</h3><span class="n count">${items.length} วิชา</span></div>
    <div class="rail">${items.map(cardHTML).join('')}</div></section>`;
}
function renderGrid(keepAnim){
  $('grid').classList.toggle('noanim', !!keepAnim);
  const q = $('q').value.trim().toLowerCase();
  $('clr').classList.toggle('hidden', !q);
  $('kbd').classList.toggle('hidden', !!q);
  const match = s => !q || (s.name + ' ' + s.code).toLowerCase().includes(q);
  let out = '', total = 0;
  if (activeCat === 'pin') {
    const l = SUBJECTS.filter(s => isPinned(s.id) && match(s));
    total = l.length;
    out = l.length ? groupHTML('รายการโปรด', '#fbbf24', l, true) : '';
  } else {
    const favs = activeCat === 'all' && !q ? SUBJECTS.filter(s => isPinned(s.id)) : [];
    if (favs.length) out += groupHTML('รายการโปรด', '#fbbf24', favs, true);
    CATS.slice(2).forEach(c => {
      if (activeCat !== 'all' && activeCat !== c.k) return;
      const l = SUBJECTS.filter(s => catOf(s).k === c.k && match(s));
      if (!l.length) return;
      total += l.length;
      out += groupHTML(c.name, c.color, l);
    });
  }
  $('grid').innerHTML = out || (activeCat === 'pin' && !q ? '' : `<div class="msg">ไม่พบวิชาที่ค้นหา<br>ลองพิมพ์ชื่ออื่น หรือเลือก "ทั้งหมด"</div>`);
  $('count').textContent = `${total} วิชา`;
}

function renderHome(){
  gridDirty = false;
  renderChips(); renderGrid();
  $('crumb').textContent = 'วิชาทั้งหมด';
  show('home');
}


/* ---------- หน้าอ่านบทเรียน ---------- */
function openSheet(s, i){
  $('sheet').style.setProperty('--acc', catOf(s).color);
  $('sheet').innerHTML = `<h3>${subjIcon(s.icon, s.name)} ${esc(s.name)}</h3>` + s.chapters.map((c, k) =>
    `<button class="chap ${k === i ? 'cur' : ''}" data-go="/${esc(s.id)}/${esc(c.id)}"><i>${k + 1}</i><span>${esc(c.title)}</span></button>`).join('');
  $('sheetBg').classList.remove('hidden');
  const cur = $('sheet').querySelector('.cur'); if (cur) cur.scrollIntoView({block:'center'});
}
const closeSheet = () => $('sheetBg').classList.add('hidden');
$('sheetBg').addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) { closeSheet(); go(b.dataset.go); }
  else if (e.target === $('sheetBg')) closeSheet();
});

function renderChapter(s, i){
  const c = s.chapters[i];
  const url = k => `/${s.id}/${s.chapters[k].id}`;
  closeSheet();
  const n = s.chapters.length;
  $('vtitle').innerHTML = `<span class="vt-main"><b>${esc(c.title)}</b><small><span class="vt-sub">${esc(s.name)}</span><span class="vt-no">บท ${i + 1}/${n}</span></small></span><span class="vt-chev">${CHEV}</span>`;
  const vb = document.querySelector('.vbar');
  vb.style.setProperty('--p', ((i + 1) / n * 100) + '%');
  vb.classList.toggle('single', n < 2);
  $('vtitle').onclick = () => openSheet(s, i);
  $('prevBtn').disabled = i === 0;
  $('nextBtn').disabled = i === s.chapters.length - 1;
  $('prevBtn').onclick = () => go(url(i - 1));
  $('nextBtn').onclick = () => go(url(i + 1));
  // สร้าง iframe ใหม่ทุกครั้ง → ไม่สร้าง history ซ้อน ปุ่มย้อนกลับของมือถือจึงทำงานปกติ
  const f = document.createElement('iframe');
  const spin = document.createElement('div');
  spin.className = 'spin'; spin.textContent = 'กำลังโหลดบทเรียน...';
  f.title = c.title;
  f.addEventListener('load', () => { spin.remove(); lockDoc(f); });
  f.src = `/content/${encodeURIComponent(s.id)}/${encodeURIComponent(c.file)}`;
  $('vframe').replaceChildren(f, spin);
  $('crumb').textContent = '';
  show('chapterView');
}

// ปัดลงเพื่อปิด popup (มือถือ): ใช้ transform อย่างเดียว อัปเดตผ่าน requestAnimationFrame
(function(){
  const box = $('subjBox'), back = mBack();
  let sy = 0, dy = 0, drag = false, fromHandle = false, ly = 0, lt = 0, vel = 0, raf = 0;
  const apply = () => {
    raf = 0;
    box.style.transform = dy ? `translate3d(0,${dy}px,0)` : '';
    back.style.opacity = String(Math.max(0, 1 - dy / Math.max(260, box.offsetHeight)));
  };
  box.addEventListener('touchstart', e => {
    if (!isMobile() || closing || e.touches.length !== 1) { sy = 0; return; }
    sy = ly = e.touches[0].clientY; lt = e.timeStamp; dy = 0; vel = 0; drag = false;
    fromHandle = !!e.target.closest('.mtop');
  }, {passive:true});
  box.addEventListener('touchmove', e => {
    if (!sy) return;
    const y = e.touches[0].clientY;
    if (!drag) {
      if (!fromHandle && box.scrollTop > 0) { sy = y; return; }          // กำลังเลื่อนรายการอยู่
      if (y - sy > 5) { drag = true; sy = y; box.style.transition = 'none'; back.style.transition = 'none'; }  // sy=y → ไม่กระโดดตอนเริ่มลาก
      else return;
    }
    dy = Math.max(0, y - sy);
    const dt = e.timeStamp - lt;
    if (dt > 0) vel = 0.7 * vel + 0.3 * ((y - ly) / dt);
    ly = y; lt = e.timeStamp;
    if (!raf) raf = requestAnimationFrame(apply);
    e.preventDefault();
  }, {passive:false});
  const end = () => {
    if (!drag) { sy = 0; return; }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    sy = 0; drag = false;
    const h = box.offsetHeight || 1;
    if (dy > Math.min(140, h * 0.25) || vel > 0.6) {
      closing = true;                                                    // ปล่อยต่อจากตำแหน่งนิ้ว
      const dur = Math.max(0.16, Math.min(0.28, 0.28 * (1 - dy / h)));
      box.style.transition = `transform ${dur}s cubic-bezier(.3,.7,.4,1)`;
      back.style.transition = `opacity ${dur}s linear`;
      box.style.transform = 'translate3d(0,100%,0)'; back.style.opacity = '0';
      setTimeout(() => { if (!$('subjBg').classList.contains('hidden')) closeSubj(); }, dur * 1000);
    } else {
      box.style.transition = 'transform .3s cubic-bezier(.22,1,.36,1)';
      back.style.transition = 'opacity .3s';
      box.style.transform = ''; back.style.opacity = '';
      dy = 0;
    }
  };
  box.addEventListener('touchend', end);
  box.addEventListener('touchcancel', end);
})();

function ttInfo(raw){
  if (raw === null) return {type:'e'};

  const [code, room] = Array.isArray(raw) ? raw : [raw, null];
  const [name, teacher, act] = TT_SUBJ[code];

// รวมคาบติดกันที่เป็นวิชาเดียวกัน (ไม่ข้ามช่วงพักเช้า)
function ttBlocks(d){
  const out = [];
  TT_PERIODS.forEach(p => {
    if (p.brk) { out.push({brk:true, s:p.s, e:p.e}); return; }
    const x = ttInfo(TT_WEEK[d][1][TT_LESSON.indexOf(p)]);
    const key = x.type === 'e' ? 'e' : x.type === 'l' ? 'l' : x.code + '|' + x.room;
    const last = out[out.length - 1];
    if (last && !last.brk && last.key === key && x.type !== 'e') { last.e = p.e; last.count++; return; }
    out.push({key, x, s:p.s, e:p.e, count:1});

  const bg = $('ntBg'), box = $('ntBox'); if (bg.classList.contains('hidden')) return;
  if (instant) { bg.classList.add('hidden'); return; }
  box.classList.add('out'); bg.querySelector('.mback').style.cssText = 'transition:opacity .22s;opacity:0';
  ntCloseT = setTimeout(() => { bg.classList.add('hidden'); box.classList.remove('out'); bg.querySelector('.mback').style.cssText = ''; }, 220);   // (เปิดซ้ำภายใน 220ms จะยกเลิกตัวนี้ ไม่ให้ปิดทับ)
}
$('pushBtn').onclick = ntOpen;
$('ntBg').addEventListener('click', e => {
  if (e.target.classList.contains('mback') || e.target.closest('[data-ntclose]')) return ntClose();
  if (e.target.closest('#ntSw')) return pushToggle();
  if (e.target.closest('[data-ntclear]')) { NT = []; ntFresh = new Set(); store.set('ntClr', String(Date.now())); ntSave(); return ntRender(); }
  const it = e.target.closest('[data-nt]'); if (!it) return;
  const n = NT.find(x => x.id === it.dataset.nt); if (!n) return;
  ntClose(true); ntGo(n);
});
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ntBg').classList.contains('hidden')) ntClose(); });
if (pushOK) {
  navigator.serviceWorker.addEventListener('message', e => {   // (ถ้า sw.js ส่งข้อความมา) บันทึกประวัติ / เปิดหน้าตามแจ้งเตือนที่เพิ่งกด
    const d = e.data || {};
    if (d.type === 'push' && d.title) { if (ntAdd({ title: d.title, body: d.body || '', url: d.url || '/', ts: d.ts })) { ntSave(); if (!$('ntBg').classList.contains('hidden')) ntRender(); } }
    else if (d.type === 'open' && d.url) ntGo({ url: d.url });
  });
  setTimeout(ntCapture, 1200);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) ntCapture(); });
  setInterval(() => { if (!document.hidden) ntCapture(); }, 60000);
}
ntBadge();

/* ---------- การบ้าน: ซิงก์กำหนดส่งไปเซิร์ฟเวอร์ (ส่งแจ้งเตือนตอนเช้า) + เตือนในเครื่อง ---------- */
let hwSyncT = 0;
function hwSync(now){
  clearTimeout(hwSyncT);
  hwSyncT = setTimeout(async () => {
    if (!pushOK || Notification.permission !== 'granted') return;
    try {
      const reg = await getReg(), sub = await reg.pushManager.getSubscription(); if (!sub) return;
      const items = hwLoad().filter(x => x.due && !x.done).slice(0, 60).map(x => ({ id: x.id, title: x.title, subj: ((SUBJECTS || []).find(s => s.id === x.subj) || {}).name || '', due: x.due, time: x.time || '' }));
      const r = await fetchT('/api/hw-sync', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subscription: sub.toJSON(), items }) }, 10000);
      if (r.ok) store.remove('hwPend'); else if (r.status >= 500 || r.status === 429) store.set('hwPend', '1');
    } catch(e) { store.set('hwPend', '1'); }     // ไว้ลองใหม่ตอนกลับมาที่แอป / ออนไลน์อีกครั้ง
  }, now ? 0 : 1500);
}
async function hwAlerts(){
  if (!pushOK || Notification.permission !== 'granted') return;
  let seen = {}; try { seen = JSON.parse(store.get('hwAl') || '{}'); } catch(e) {}
  const now = Date.now(), fire = [];
  for (const k in seen) if (now - seen[k] > 14 * 864e5) delete seen[k];
  for (const x of hwLoad()) {
    if (x.done || !x.due) continue;
    const left = new Date(x.due + 'T' + (x.time || '23:59') + ':00').getTime() - now;
    if (isNaN(left) || left < -864e5) continue;
    const st = left < 0 ? 'over' : (x.time && left <= 36e5) ? 'h1' : left <= 864e5 ? 'd1' : '';
    if (!st || seen[x.id + ':' + st]) continue;
    seen[x.id + ':' + st] = now; fire.push({ x, st });
  }
  if (!fire.length) return;
  store.set('hwAl', JSON.stringify(seen));
  fire.forEach(({ x, st }) => ntAdd({ title: st === 'over' ? 'เลยกำหนดส่งการบ้านแล้ว' : st === 'h1' ? 'การบ้านเหลือไม่ถึง 1 ชั่วโมง' : 'ใกล้ถึงกำหนดส่งการบ้าน', body: x.title + (x.time ? ' · ' + x.time + ' น.' : ''), url: '/?hw=' + encodeURIComponent(x.id), kind: 'hw' }));
  ntSave();
  try {
    const reg = await navigator.serviceWorker.ready;
    fire.slice(0, 3).forEach(({ x, st }) => reg.showNotification(st === 'over' ? 'เลยกำหนดส่งการบ้านแล้ว' : st === 'h1' ? 'การบ้านเหลือไม่ถึง 1 ชั่วโมง' : 'ใกล้ถึงกำหนดส่งการบ้าน', { body: x.title + (x.time ? ' · ' + x.time + ' น.' : ''), icon: '/icon-192.png', badge: '/icon-192.png', tag: 'hw-' + x.id, data: { url: '/?hw=' + encodeURIComponent(x.id), local: true } }));
  } catch(e) {}
}
setTimeout(hwAlerts, 2500); setInterval(() => { if (!document.hidden) hwAlerts(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) hwAlerts(); });

/* กันการดึงหน้าจอลงจนสุด (pull-to-refresh / ยางยืด) ทุกกรณี */
(function(){
  // เบราว์เซอร์อื่นใช้ CSS overscroll-behavior ได้ลื่นกว่า (ตัวดักนี้ทำให้เลื่อนต้องรอ JS ทุกครั้ง) → เปิดเฉพาะ iOS
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) return;
  let y0 = 0;
  const scrolledInside = el => { for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) { if (el.scrollTop > 0 && el.scrollHeight > el.clientHeight) return true; } return false; };
  document.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (e.touches.length !== 1 || document.documentElement.classList.contains('sdrag')) return;   // ระหว่างลากแผ่นล่าง ไม่ต้องไล่ตรวจ DOM ทุก touchmove
    const pullingDown = e.touches[0].clientY - y0 > 0;
    if (pullingDown && (window.scrollY || document.documentElement.scrollTop) <= 0 && !scrolledInside(e.target) && e.cancelable) e.preventDefault();
  }, {passive:false});
})();
