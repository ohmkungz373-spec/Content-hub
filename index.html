<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>CONTENT HUB | เนื้อหา ม.4 เทอม 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#0b1220;--panel:#111a2e;--line:#1f2d4d;--ink:#e6edf8;--muted:#8fa3c4;--blue:#3b82f6;--cyan:#38bdf8}
html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans Thai",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100dvh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 300px at 15% -5%,#1d4ed855,transparent),radial-gradient(500px 280px at 95% 0,#0ea5e940,transparent)}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#0b1220e6;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.logo{font-weight:700;letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--cyan)}
.crumb{flex:1;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-size:14px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--blue);box-shadow:0 0 12px #3b82f655}
.btn:disabled{opacity:.35;cursor:not-allowed}
.wrap{max-width:1100px;margin:auto;padding:0 16px 60px}
.hero{padding:38px 0 14px}
.kicker{display:inline-block;font-size:13px;color:var(--cyan);border:1px solid #38bdf855;border-radius:999px;padding:3px 12px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.15;margin:12px 0 6px}
h1 span{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0}
.search{margin:22px 0 8px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 14px #3b82f655}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:11px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px}
.row h2{margin:0;font-size:20px}.count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;transition:.18s}
.card:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 0 18px #3b82f640}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:#1b2a4a}
.card b{display:block;font-size:16px;line-height:1.3}
.card small{color:var(--muted);font-size:13px}
.card .arrow{color:var(--muted);font-size:20px}
.card.empty{opacity:.6}
.chips{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.code{font-size:12px;color:var(--cyan)}
.list{display:grid;gap:8px}
.chap{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:.15s}
.chap:hover{border-color:var(--blue);box-shadow:0 0 14px #3b82f640}
.chap i{font-style:normal;min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:600;background:#1b2a4a;color:var(--cyan)}
.shead{display:flex;align-items:center;gap:14px;padding:26px 0 8px}
.shead .ico{width:56px;height:56px;font-size:30px}
.shead h1{font-size:clamp(22px,4vw,32px);margin:0}
.msg{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
.viewer{display:flex;flex-direction:column;height:calc(100dvh - 55px)}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0e1730}
.vbar .t{flex:1;min-width:0;text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vframe{flex:1;background:#fff;position:relative}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="btn hidden" id="backBtn" aria-label="ย้อนกลับ">‹</button>
    <div class="logo" id="logo">◆ CONTENT <span>HUB</span></div>
    <div class="crumb" id="crumb"></div>
  </div>
</header>

<main id="home" class="wrap">
  <section class="hero">
    <span class="kicker" id="tagline">เนื้อหา ม.4 เทอม 2</span>
    <h1>CONTENT <span>HUB</span></h1>
    <p class="sub">เลือกวิชา แล้วเปิดบทเรียนได้ทันที</p>
    <label class="search"><span>⌕</span><input id="q" type="search" placeholder="ค้นหาวิชา หรือรหัสวิชา" autocomplete="off"></label>
  </section>
  <div class="row"><h2>เลือกวิชา</h2><span class="count" id="count"></span></div>
  <div class="grid" id="grid"></div>
  <div class="msg hidden" id="noResult">ไม่พบวิชาที่ค้นหา</div>
</main>

<main id="subjectView" class="wrap hidden"></main>

<section id="chapterView" class="viewer hidden">
  <div class="vbar">
    <button class="btn" id="prevBtn">‹ ก่อนหน้า</button>
    <div class="t" id="vtitle"></div>
    <button class="btn" id="nextBtn">ถัดไป ›</button>
  </div>
  <div class="vframe" id="vframe"></div>
</section>

<footer id="foot">◆ CONTENT HUB</footer>

<script>
let SUBJECTS = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const views = ['home','subjectView','chapterView'];
function show(v){ views.forEach(x => $(x).classList.toggle('hidden', x !== v)); $('foot').classList.toggle('hidden', v === 'chapterView'); $('backBtn').classList.toggle('hidden', v === 'home'); window.scrollTo(0,0); }

function renderGrid(){
  const q = $('q').value.trim().toLowerCase();
  const list = SUBJECTS.filter(s => !q || (s.name + ' ' + s.code).toLowerCase().includes(q));
  $('grid').innerHTML = list.map(s => `
    <button class="card ${s.chapters.length ? '' : 'empty'}" data-id="${esc(s.id)}">
      <span class="ico">${esc(s.icon)}</span>
      <span><b>${esc(s.name)}</b><small>${s.chapters.length ? s.chapters.length + ' บทเรียน' : 'เร็ว ๆ นี้'}</small>${s.code ? `<div class="code">${esc(s.code)}</div>` : ''}</span>
      <span class="arrow">→</span>
    </button>`).join('');
  $('count').textContent = `${list.length} วิชา`;
  $('noResult').classList.toggle('hidden', list.length > 0);
}

function renderSubject(s){
  $('subjectView').innerHTML = `
    <div class="shead"><span class="ico">${esc(s.icon)}</span><div><h1>${esc(s.name)}</h1>${s.code ? `<div class="code">${esc(s.code)}</div>` : ''}</div></div>
    ${s.chapters.length
      ? `<div class="list">${s.chapters.map((c,i) => `<button class="chap" data-id="${esc(c.id)}"><i>${i+1}</i><span>${esc(c.title)}</span></button>`).join('')}</div>`
      : `<div class="msg">ยังไม่มีบทเรียนในวิชานี้ — เร็ว ๆ นี้</div>`}`;
  $('crumb').innerHTML = `<b>${esc(s.name)}</b>`;
  show('subjectView');
}

function renderChapter(s, i){
  const c = s.chapters[i];
  $('vtitle').textContent = `${i+1}/${s.chapters.length} · ${c.title}`;
  $('prevBtn').disabled = i === 0;
  $('nextBtn').disabled = i === s.chapters.length - 1;
  $('prevBtn').onclick = () => go(`/${s.id}/${s.chapters[i-1].id}`);
  $('nextBtn').onclick = () => go(`/${s.id}/${s.chapters[i+1].id}`);
  // สร้าง iframe ใหม่ทุกครั้ง → ไม่สร้าง history ซ้อน ปุ่มย้อนกลับของมือถือจึงทำงานปกติ
  const f = document.createElement('iframe');
  f.title = c.title;
  f.src = `/content/${encodeURIComponent(s.id)}/${encodeURIComponent(c.file)}`;
  $('vframe').replaceChildren(f);
  $('crumb').innerHTML = `<b>${esc(s.name)}</b>`;
  show('chapterView');
}

function go(path){
  history.pushState(null, '', path);
  route();
}

function route(){
  const parts = location.pathname.split('/').filter(Boolean).map(decodeURIComponent);
  const s = SUBJECTS.find(x => x.id === parts[0]);
  if (!s) { $('crumb').textContent = ''; show('home'); return; }
  if (parts[1]) {
    const i = s.chapters.findIndex(c => c.id === parts[1]);
    if (i >= 0) return renderChapter(s, i);
  }
  renderSubject(s);
}

$('grid').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) go('/' + b.dataset.id); });
$('subjectView').addEventListener('click', e => {
  const b = e.target.closest('.chap'); if (!b) return;
  go('/' + location.pathname.split('/').filter(Boolean)[0] + '/' + b.dataset.id);
});
$('backBtn').onclick = () => {
  const parts = location.pathname.split('/').filter(Boolean);
  go(parts.length > 1 ? '/' + parts[0] : '/');
};
$('logo').onclick = () => go('/');
$('q').addEventListener('input', renderGrid);
window.addEventListener('popstate', route);

fetch('/subjects.json').then(r => r.json()).then(d => {
  SUBJECTS = d.subjects || [];
  const cfg = d.config || {};
  if (cfg.tagline) $('tagline').textContent = cfg.tagline;
  document.title = `${cfg.siteTitle || 'CONTENT HUB'} | ${cfg.tagline || ''}`;
  renderGrid();
  route();
}).catch(() => { $('grid').innerHTML = '<div class="msg">โหลดรายการวิชาไม่สำเร็จ</div>'; });
</script>
</body>
</html>
