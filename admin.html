<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard | CONTENT HUB</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080d1b;--panel:#0f1830;--panel2:#16224a;--line:#1e2d57;--ink:#eaf0ff;--muted:#8499c4;--acc:#3b82f6;--cyan:#38bdf8;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;color-scheme:dark}
body{margin:0;font-family:"IBM Plex Sans Thai",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
h1 span{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13.5px;color:var(--muted);margin:0 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;outline:0}
input:focus,select:focus{border-color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:600}
.pri{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;width:100%;margin-top:12px}
.pri:disabled{opacity:.45;cursor:default}
.ghost{background:var(--panel2);border:1px solid var(--line);min-height:38px;padding:0 14px;font-size:13.5px}
.err{color:#fca5a5;font-size:13.5px;margin-top:10px;min-height:20px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hidden{display:none!important}
.chs{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.chs div{padding:7px 12px;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.chs div:last-child{border-bottom:0}
.chs small{color:var(--muted);flex:none;min-width:20px}
.chs div{align-items:center}.chs span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{display:block;text-align:center;padding:18px 12px;border:2px dashed #2a3d6e;border-radius:14px;color:var(--cyan);font-weight:600;cursor:pointer}
.pick input{display:none}
.fl{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--bg)}
.fl .t{font-size:13px;color:var(--muted);margin-top:6px;word-break:break-word}
.fl .t b{color:var(--ink)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;margin-top:6px;font-weight:600}
.tag.new{background:#22c55e22;color:#4ade80}.tag.over{background:#f59e0b22;color:#fbbf24}.tag.warn{background:#ef444422;color:#fca5a5}
.del{flex:none;background:#ef444422;color:#fca5a5;border:1px solid #ef444455;min-height:32px;padding:0 10px;font-size:13px;border-radius:10px}
.rm{float:right;background:none;color:var(--muted);min-height:30px;padding:0 6px;font-size:18px}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.msg.ok{background:#22c55e1c;border:1px solid #22c55e66;color:#bbf7d0}
.msg.bad{background:#ef44441c;border:1px solid #ef444466;color:#fecaca}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ล็อกอิน -->
  <div id="loginView">
    <h1>🔒 <span>Admin Dashboard</span></h1>
    <p class="sub">ใส่รหัสเพื่อเข้าสู่ระบบจัดการบทเรียน</p>
    <div class="card">
      <label for="pw">รหัสผ่าน</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน">
      <button class="pri" id="loginBtn" type="button">เข้าสู่ระบบ</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <!-- แดชบอร์ด -->
  <div id="panelView" class="hidden">
    <div class="top">
      <div><h1>🛠 <span>Admin Dashboard</span></h1><p class="sub">เพิ่มบทเรียนโดยอัปโหลดไฟล์ .html</p></div>
      <button class="ghost" id="logoutBtn" type="button">ออกจากระบบ</button>
    </div>

    <div class="card">
      <label for="subj">เลือกวิชา</label>
      <select id="subj"></select>
      <label style="margin-top:14px">บทที่มีอยู่แล้ว (<span id="cnt">0</span>)</label>
      <div class="chs" id="chs"></div>
      <div class="hint">บทเรียงตามชื่อไฟล์ — ตั้งชื่อนำหน้าด้วยเลข เช่น 05-เรื่องใหม่.html</div>
    </div>

    <div class="card">
      <label class="pick"><span>＋ เลือกไฟล์ .html (เลือกได้หลายไฟล์)</span><input id="file" type="file" accept=".html,text/html" multiple></label>
      <div id="fileList"></div>
      <button class="pri" id="upBtn" type="button" disabled>อัปโหลดเข้าวิชานี้</button>
      <div id="status"></div>
      <div class="hint">ไฟล์ชื่อซ้ำกับที่มีอยู่จะถูกเขียนทับ · ชื่อบทดึงจากแท็ก &lt;title&gt; ในไฟล์ · หลังอัปโหลดเว็บจะ deploy ใหม่ประมาณ 1 นาที</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ss = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, del(k){ try { sessionStorage.removeItem(k); } catch(e){} } };
let TOKEN = ss.get('hub-admin') || '', SUBJECTS = [], FILES = [];   // FILES: {name,b64,size,title}

async function api(action, data){
  let r, j;
  try { r = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({action, token: TOKEN}, data || {})) }); }
  catch(e){ throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
  try { j = await r.json(); } catch(e){ throw new Error('ใช้งานได้เฉพาะบน Vercel (ไม่มี /api/admin ในโหมดรันเครื่อง)'); }
  if (r.status === 401 && action !== 'login') { logout(); throw new Error(j.error || 'หมดเวลาการเข้าสู่ระบบ'); }
  if (!r.ok) throw new Error(j.error || ('เกิดข้อผิดพลาด ' + r.status));
  return j;
}

function showPanel(on){ $('loginView').classList.toggle('hidden', on); $('panelView').classList.toggle('hidden', !on); }
function logout(){ TOKEN = ''; ss.del('hub-admin'); showPanel(false); $('pw').value = ''; }

async function login(){
  const b = $('loginBtn'); $('loginErr').textContent = ''; b.disabled = true; b.textContent = 'กำลังตรวจสอบ...';
  try { const j = await api('login', { password: $('pw').value }); TOKEN = j.token; ss.set('hub-admin', TOKEN); await enter(); }
  catch(e){ $('loginErr').textContent = e.message; }
  b.disabled = false; b.textContent = 'เข้าสู่ระบบ';
}
$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('logoutBtn').onclick = logout;

async function loadSubjects(){
  const d = await (await fetch('/subjects.json', { cache:'no-store' })).json();
  SUBJECTS = d.subjects || [];
  const cur = $('subj').value;
  $('subj').innerHTML = SUBJECTS.map(s => `<option value="${esc(s.id)}">${esc((s.code ? s.code + ' · ' : '') + s.name)}</option>`).join('');
  if (cur && SUBJECTS.some(s => s.id === cur)) $('subj').value = cur;
  renderChs(); renderFiles();
}
function curSubject(){ return SUBJECTS.find(s => s.id === $('subj').value); }
function renderChs(){
  const s = curSubject(), list = s ? s.chapters : [];
  $('cnt').textContent = list.length;
  $('chs').innerHTML = list.length ? list.map((c, i) => `<div><small>${i + 1}</small><span title="${esc(c.file)}">${esc(c.title)} <small>· ${esc(c.file)}</small></span><button class="del" data-del="${i}" type="button">🗑 ลบ</button></div>`).join('') : '<div><span style="color:var(--muted)">ยังไม่มีบทเรียน</span></div>';
}
$('chs').addEventListener('click', async e => {
  const bt = e.target.closest('[data-del]'); if (!bt) return;
  const s = curSubject(), c = s && s.chapters[+bt.dataset.del]; if (!c) return;
  if (!confirm(`ลบบท "${c.title}"\n(${c.file}) ออกจากวิชา ${s.name} ?\n\nลบแล้วกู้คืนผ่านหน้านี้ไม่ได้`)) return;
  bt.disabled = true; bt.textContent = '...'; $('status').innerHTML = '';
  try {
    const j = await api('delete', { subject: s.id, files: [c.file] });
    s.chapters.splice(+bt.dataset.del, 1); renderChs(); renderFiles();
    $('status').innerHTML = `<div class="msg ok">🗑 ลบ ${esc(c.file)} แล้ว (commit ${esc(j.commit)})<br>เว็บกำลัง deploy ใหม่ ประมาณ 1 นาทีบทจะหายจากหน้าเว็บ</div>`;
  } catch(err){ bt.disabled = false; bt.textContent = '🗑 ลบ'; $('status').innerHTML = `<div class="msg bad">❌ ${esc(err.message)}</div>`; }
});
$('subj').onchange = () => { renderChs(); renderFiles(); };

const FILE_RE = /^[^\\/:*?"<>|\u0000-\u001f]{1,100}\.html$/i;
function renderFiles(){
  const s = curSubject(), have = new Set((s ? s.chapters : []).map(c => c.file.toLowerCase()));
  const names = FILES.map(f => f.name.toLowerCase());
  $('fileList').innerHTML = FILES.map((f, i) => {
    const bad = !FILE_RE.test(f.name) || /^[._]/.test(f.name) || names.indexOf(f.name.toLowerCase()) !== i;
    const tag = bad ? '<span class="tag warn">ชื่อไฟล์ไม่ถูกต้อง/ซ้ำ</span>' : have.has(f.name.toLowerCase()) ? '<span class="tag over">จะเขียนทับไฟล์เดิม</span>' : '<span class="tag new">บทใหม่</span>';
    return `<div class="fl"><button class="rm" data-rm="${i}" type="button" aria-label="เอาออก">×</button>
      <input data-name="${i}" value="${esc(f.name)}" aria-label="ชื่อไฟล์">
      <div class="t">ชื่อบท: <b>${f.title ? esc(f.title) : '(ไม่พบ &lt;title&gt; — จะใช้ชื่อไฟล์แทน)'}</b> · ${(f.size / 1024).toFixed(0)} KB</div>${tag}</div>`;
  }).join('');
  const ok = FILES.length && FILES.every((f, i) => FILE_RE.test(f.name) && !/^[._]/.test(f.name) && names.indexOf(f.name.toLowerCase()) === i);
  $('upBtn').disabled = !ok || !s;
  $('upBtn').textContent = FILES.length ? `อัปโหลด ${FILES.length} ไฟล์เข้า “${s ? s.name : ''}”` : 'อัปโหลดเข้าวิชานี้';
}
$('fileList').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { FILES.splice(+b.dataset.rm, 1); renderFiles(); } });
$('fileList').addEventListener('input', e => { const i = e.target.dataset && e.target.dataset.name; if (i !== undefined) { FILES[+i].name = e.target.value.trim(); updTags(); } });
function updTags(){ const keep = document.activeElement, pos = keep && keep.selectionStart, id = keep && keep.dataset && keep.dataset.name; renderFiles(); if (id !== undefined && id !== null) { const n = document.querySelector(`[data-name="${id}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} } } }

function toB64(buf){ const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function titleOf(buf){
  try { const t = new TextDecoder('utf-8').decode(buf).replace(/<!--[\s\S]*?-->/g, '').match(/<title>([\s\S]*?)<\/title>/i); return t ? t[1].replace(/\s+/g, ' ').trim().split('|')[0].trim() : ''; } catch(e){ return ''; }
}
$('file').addEventListener('change', async e => {
  $('status').innerHTML = '';
  for (const f of e.target.files) {
    if (!/\.html?$/i.test(f.name)) continue;
    const buf = await f.arrayBuffer();
    const name = f.name.replace(/\.htm$/i, '.html');
    FILES = FILES.filter(x => x.name.toLowerCase() !== name.toLowerCase());
    FILES.push({ name, b64: toB64(buf), size: buf.byteLength, title: titleOf(buf) });
  }
  e.target.value = ''; renderFiles();
});

$('upBtn').onclick = async () => {
  const s = curSubject(); if (!s || !FILES.length) return;
  const total = FILES.reduce((a, f) => a + f.size, 0);
  if (total > 3 * 1024 * 1024) { $('status').innerHTML = '<div class="msg bad">ไฟล์รวมใหญ่เกิน 3 MB — แบ่งอัปโหลดทีละชุด</div>'; return; }
  const b = $('upBtn'); b.disabled = true; b.textContent = 'กำลังอัปโหลด...'; $('status').innerHTML = '';
  try {
    const j = await api('upload', { subject: s.id, files: FILES.map(f => ({ name: f.name, b64: f.b64 })) });
    $('status').innerHTML = `<div class="msg ok">✅ อัปโหลด ${j.count} ไฟล์สำเร็จ (commit ${esc(j.commit)})<br>เว็บกำลัง deploy ใหม่ ประมาณ 1 นาทีบทเรียนจะขึ้น</div>`;
    FILES = []; renderFiles();
    setTimeout(() => loadSubjects().catch(() => {}), 70000);
  } catch(e){ $('status').innerHTML = `<div class="msg bad">❌ ${esc(e.message)}</div>`; renderFiles(); }
};

async function enter(){ await loadSubjects(); showPanel(true); }
(async () => {
  if (!TOKEN) return;
  try { await api('check'); await enter(); } catch(e){ /* ยังไม่ล็อกอิน */ }
})();
</script>
</body>
</html>
