<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard | CONTENT HUB</title>
<link rel="manifest" href="/admin.webmanifest">
<script>/* โดเมนที่ขึ้นต้นด้วย admin (เช่น admin-xxx.vercel.app) = ติดตั้งเป็นแอปแยกได้เลย ไม่ชนกับแอปหลัก */
if (/^admin[.-]/.test(location.hostname)) document.querySelector('link[rel="manifest"]').href = '/admin-sub.webmanifest';</script>
<link rel="apple-touch-icon" href="/apple-touch-icon-admin.png">
<link rel="icon" type="image/png" href="/icon-admin-192.png">
<meta name="theme-color" content="#080d1b">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub Admin"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b1020;--bg2:#10172b;--panel:#151e36;--panel2:#1c2745;--line:#26335a;
  --ink:#eef2ff;--muted:#8fa0c8;--acc:#8b9bff;--acc2:#5eead4;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;
  --r:16px;color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"IBM Plex Sans Thai",Tahoma,Arial,sans-serif;background:radial-gradient(900px 420px at 80% -10%,#1b2650 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);line-height:1.6;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.2px}
h2{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:20px;flex:none;color:#0b1020}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--acc);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.head .pill{margin-left:auto}
.pill{font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:1px 11px}

label{display:block;font-size:13.5px;color:var(--muted);margin:0 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:48px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #8b9bff30}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:600;transition:transform .1s,opacity .15s,background .15s}
button:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.pri{background:linear-gradient(135deg,#6d7dff,#38c8c0);color:#071022;width:100%;font-size:16px;min-height:56px;border-radius:14px}
.pri:disabled{opacity:.4;cursor:default}
#loginBtn{margin-top:14px;min-height:50px}
.ghost{background:var(--panel2);border:1px solid var(--line);min-height:40px;padding:0 14px;font-size:14px;color:var(--ink)}
.ghost:hover{background:#243158}
.err{color:#fca5a5;font-size:14px;margin-top:10px;min-height:22px}
.hidden{display:none!important}
.pwbox{position:relative}
.pwbox input{padding-right:64px}
.eye{position:absolute;right:6px;top:6px;min-height:36px;padding:0 10px;background:none;color:var(--muted);font-size:13px}

.login{margin-top:12vh}
.login .brand{margin-bottom:22px}

/* chapter list */
.chs{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.chs .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chs .row:last-child{border-bottom:0}
.chs .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12.5px;font-weight:600;display:grid;place-items:center}
.chs .tx{flex:1;min-width:0}
.chs .tt{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chs .ff{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chs .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.del{flex:none;background:transparent;color:#fca5a5;border:1px solid #f8717144;min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.del:hover{background:#f8717120}

/* dropzone */
.pick{display:block;text-align:center;padding:26px 14px;border:2px dashed #3a4a80;border-radius:14px;background:var(--bg2);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover,.pick.drag{border-color:var(--acc2);background:#5eead414}
.pick .ic{display:block;font-size:26px;line-height:1;margin-bottom:8px;color:var(--acc2)}
.pick b{display:block;font-size:15px;font-weight:600}
.pick span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pick input{display:none}

.fl{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px;margin-top:10px;background:var(--bg2)}
.fl input{min-height:42px;padding-right:44px;font-size:14px}
.fl .t{font-size:13px;color:var(--muted);margin-top:8px;word-break:break-word}
.fl .t b{color:var(--ink);font-weight:600}
.rm{position:absolute;right:16px;top:16px;background:none;color:var(--muted);min-height:34px;width:34px;padding:0;font-size:20px;line-height:1;border-radius:8px}
.rm:hover{background:var(--panel2);color:var(--ink)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;margin-top:8px;font-weight:600}
.tag.new{background:#4ade8022;color:var(--ok)}.tag.over{background:#fbbf2420;color:var(--warn)}.tag.warn{background:#f8717122;color:#fca5a5}

.msg{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.msg.ok{background:#4ade8018;border:1px solid #4ade8055;color:#bbf7d0}
.msg.bad{background:#f8717118;border:1px solid #f8717155;color:#fecaca}
.hint{font-size:13px;color:var(--muted);margin-top:10px}


/* subject chips + tabs */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#0b1020}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:4px 0 16px}
.tab{min-height:44px;background:none;color:var(--muted);border-radius:10px;font-size:15px}
.tab[aria-selected=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tab .pill{margin-left:6px;padding:0 8px;font-size:12px}
/* manage list */
.tools{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tools .ghost{min-height:36px;font-size:13.5px}
.tools{flex-wrap:wrap}.tools .sel{margin-left:auto;white-space:nowrap;font-size:13.5px;color:var(--muted)}
.chs .row{cursor:pointer}
.chs .row.on{background:#8b9bff1c}
.ck{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #3a4a80;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700}
.row.on .ck{background:var(--acc);border-color:var(--acc);color:#0b1020}
.edit{flex:none;background:var(--panel2);border:1px solid var(--line);min-height:36px;padding:0 12px;font-size:13px;border-radius:10px;color:var(--ink)}
.dangerbtn{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;width:100%;font-size:15.5px}
/* header + subject picker */
.top .brand{min-width:0}
.top h1{font-size:19px;white-space:nowrap}
.top .sub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .acts{display:flex;gap:8px;flex:none}
.ghost{white-space:nowrap}
.ic{width:44px;min-height:44px;padding:0;font-size:21px;line-height:1}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.cur{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:62px;margin-bottom:12px}
.cur .tx{flex:1;min-width:0}
.cur small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.cur b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cur .chg{flex:none;color:var(--acc);font-size:13.5px}
.cur i,.gh i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.grp{margin-bottom:18px}.grp:last-child{margin-bottom:0}
.gh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:8px}
.gh span{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb{text-align:left;min-height:60px;padding:8px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--c);color:var(--ink);font-size:14px;line-height:1.35}
.sb small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.sb[aria-pressed=true]{background:var(--panel2);border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
/* dialog */
.ov{position:fixed;inset:0;background:#050810cc;display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.dlg{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:env(safe-area-inset-bottom,0px)}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14px;word-break:break-word;white-space:pre-line}
.dlg .btns{display:flex;gap:10px;margin-top:14px}
.dlg .btns button{flex:1}
@media (min-width:600px){.ov{align-items:center}}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:5}
.bar .in{max-width:620px;margin:0 auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.act .ai{color:var(--c)}.act .ai .i{width:26px;height:26px}.logo .i{width:22px;height:22px}.x .i{width:18px;height:18px}.pick .ic .i{width:30px;height:30px}.ck .i{width:15px;height:15px;stroke-width:3}.ghost .i{margin-right:4px}.chg .i{margin-left:4px;width:1em;height:1em}
.sic{width:100%;height:100%;display:block}.si{width:40px;height:40px;flex:none}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:62px;padding:8px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;color:var(--ink)}
.srow .tx{flex:1;min-width:0}.srow b{display:block;font-size:15.5px;line-height:1.3;font-weight:600}.srow small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.srow[aria-pressed=true]{border-color:var(--acc);background:var(--panel2);box-shadow:0 0 0 1px var(--acc)}
.cnt{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:#8b9bff22;border:1px solid #8b9bff55;color:var(--ink)}.cnt.zero{background:var(--panel2);border-color:var(--line);color:var(--muted);font-weight:500}
.ssr{margin-bottom:12px}#plist{max-height:46dvh;overflow:auto}
.cur .chg{display:flex;align-items:center}
.icg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.ict{min-height:56px;padding:6px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}.ict svg{width:100%;height:38px}.ict[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);color:var(--ink)}
.pov{z-index:40}.pk{max-width:480px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;min-height:128px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--c) 38%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--c) 14%,var(--panel)),var(--panel));text-align:left;min-width:0;color:var(--ink)}
.pc.on{border-color:var(--c);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 32%,transparent)}
.pc .si{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent)}.pc .si .sic{width:32px;height:32px}
.pc b{display:block;font-size:14.5px;line-height:1.3;font-weight:600;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc small{color:var(--muted);font-size:12px;margin-top:-4px}
.pcn{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 22%,var(--bg2));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink)}.pcn.zero{color:var(--muted);font-weight:500;background:var(--bg2);border-color:var(--line)}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px 14px;min-height:140px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 55%);border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));position:relative;overflow:hidden;color:var(--ink);box-shadow:0 8px 22px -14px color-mix(in srgb,var(--c) 55%,transparent)}
.act::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.act .ai{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 28%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.act b{font-size:16px;margin-top:4px}.act small{color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.4}
.act:hover{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--panel2)),var(--panel2) 55%);border-color:color-mix(in srgb,var(--c) 70%,var(--line));transform:translateY(-2px)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}.st b{display:block;font-size:22px}.st small{color:var(--muted);font-size:12.5px}
.sheet{max-width:520px;max-height:90dvh;overflow:auto;padding:0;border-radius:22px 22px 0 0;margin-bottom:0}
.ov{padding:0}
.sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 18px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.sh h3{margin:0;flex:1;font-size:18px}
.x{min-height:40px;width:40px;padding:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.sbody{padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.field{margin-bottom:12px}
.chk{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer;margin:12px 0;font-size:14.5px;color:var(--ink)}
.chk input{width:20px;height:20px;min-height:0;accent-color:#6d7dff;flex:none}
.tpl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 96px;gap:10px}
.sheet .chs{max-height:42dvh}
.sticky{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(to top,var(--panel) 70%,transparent)}
.sheet .cur{margin-bottom:12px}.sheet .grp .subs{grid-template-columns:1fr 1fr}
.sheet #picker{border:0;padding:0;background:none;margin-bottom:12px}
@media (min-width:600px){.sheet{border-radius:22px}.ov{align-items:center;padding:16px}}

/* --- อัปโหลดไฟล์ (ปรับปรุง) --- */
.pick{padding:28px 16px 22px;border:2px dashed color-mix(in srgb,var(--acc2) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--acc2) 9%,transparent),transparent),var(--bg2)}
.pick:active{transform:scale(.99)}
.pick .ic{width:60px;height:60px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc2) 16%,transparent)}
.pick .sub{font-size:13px;color:var(--muted);margin-top:4px}
.pick .cta{display:inline-block;margin-top:14px;padding:10px 22px;border-radius:999px;background:linear-gradient(135deg,#6d7dff,#38c8c0);color:#071022;font-weight:700;font-size:14px}
.pick.has{padding:14px;border-style:solid}.pick.has .ic{width:40px;height:40px;margin-bottom:6px}.pick.has .ic .i{width:22px;height:22px}.pick.has .sub,.pick.has .cta{display:none}
.fl{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px}
.fl.bad{border-color:#f87171aa}
.fl .fic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc2) 15%,transparent);color:var(--acc2)}
.fl .fic .i{width:22px;height:22px}
.fl .fb{flex:1;min-width:0}.fl input{padding-right:12px}
.fl .rm{position:static;flex:none;width:34px;height:34px;border-radius:50%;border:0;background:#f8717122;color:#f87171;font-size:20px;line-height:1;cursor:pointer}
.fl .tag{margin-top:8px;display:inline-block}
.cur.nudge{animation:nud .45s}@keyframes nud{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sticky .pri{box-shadow:0 10px 24px -10px #6d7dff99}

/* --- ปุ่มเลือกวิชา (เด่นเมื่อยังไม่ได้เลือก) --- */
.cur{transition:transform .15s,box-shadow .2s,border-color .2s}.cur:active{transform:scale(.98)}
.cur.empty{position:relative;min-height:72px;border:1.5px solid transparent;color:var(--ink);
 background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,#6d7dff,#38c8c0,#a78bfa) border-box;
 box-shadow:0 0 0 0 #6d7dff66,0 12px 28px -12px #6d7dffcc;animation:curPulse 1.8s ease-in-out infinite}
.cur.empty .ei{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#071022;background:linear-gradient(135deg,#6d7dff,#38c8c0)}
.cur.empty .ei .i{width:24px;height:24px}
.cur.empty b{font-size:17px}
.cur.empty small{color:var(--acc2);font-weight:700}
.cur.empty .chg{padding:9px 14px;border-radius:999px;color:#071022;font-weight:700;font-size:14px;background:linear-gradient(135deg,#6d7dff,#38c8c0);animation:curNudge 1.8s ease-in-out infinite}
.cur.empty .chg .i{stroke-width:3}
@keyframes curPulse{0%,100%{box-shadow:0 0 0 0 #6d7dff66,0 12px 28px -12px #6d7dffcc}50%{box-shadow:0 0 0 7px #6d7dff00,0 12px 28px -12px #38c8c0cc}}
@keyframes curNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.cur.empty,.cur.empty .chg{animation:none}}


/* --- รายการวิชาแบบกะทัดรัด (ไม่ใช้ป็อปอัพ) --- */

<body>
<div class="wrap">
  <div id="loginView" class="login">
    <div class="brand"><div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><div><h1>Admin Dashboard</h1><p class="sub">เข้าสู่ระบบเพื่อจัดการเว็บ</p></div></div>
    <div class="card">
      <label for="pw">รหัสผ่าน</label>

      <div class="acts"><button class="ghost hidden" id="installBtn" type="button">ติดตั้งแอป</button><button class="ghost" id="logoutBtn" type="button">ออกจากระบบ</button></div>
    </div>

    <div class="home">
      <button class="act" data-go="subjects" style="--c:#c084fc" type="button"><span class="ai"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M12 9v6M9 12h6"/></svg></span><b>จัดการวิชา</b><small>เพิ่มวิชา · อัปโหลดบท · ลบ · เปลี่ยนชื่อ</small></button>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ss = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
let TOKEN = ss.get('hub-admin') || '', SUBJECTS = [], FILES = [], CUR = '', SEL = new Set();
const FILE_RE = /^[^\\/:*?"<>|\u0000-\u001f]{1,100}\.html$/i;
const okMsg = (t, extra) => `<div class="msg ok">${t}${extra ? '<br>' + extra : ''}</div>`, badMsg = t => `<div class="msg bad">${esc(t)}</div>`;
const DEPLOY = 'เว็บกำลัง deploy ใหม่ ประมาณ 1 นาที';

async function api(action, data){
  let r, j;
  try { r = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({action, token: TOKEN}, data || {})) }); }
  catch(e){ throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
  try { j = await r.json(); } catch(e){ throw new Error('ใช้งานได้เฉพาะบน Vercel (ไม่มี /api/admin ในโหมดรันเครื่อง)'); }
  if (r.status === 401 && action !== 'login') { logout(); throw new Error(j.error || 'หมดเวลาการเข้าสู่ระบบ'); }
  if (!r.ok) throw new Error(j.error || ('เกิดข้อผิดพลาด ' + r.status));
  return j;
}
async function sendPush(title, message, url){
  const r = await fetch('/api/push-send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: TOKEN, title, message, url: url || '/' }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error(j.error || 'หมดเวลา'); }
  if (!r.ok) throw new Error(j.error || ('เกิดข้อผิดพลาด ' + r.status));
  return j;
}
const pushRes = j => `ส่งแจ้งเตือนแล้ว ${j.sent}/${j.total} เครื่อง` + (j.failed ? ` · ล้มเหลว ${j.failed}` : '');

function showPanel(on){ $('loginView').classList.toggle('hidden', on); $('panelView').classList.toggle('hidden', !on); }
function logout(){ TOKEN = ''; SEL.clear(); closeSheet(); ss.del('hub-admin'); showPanel(false); $('pw').value = ''; }
async function login(){
  const b = $('loginBtn'); $('loginErr').textContent = ''; b.disabled = true; b.textContent = 'กำลังตรวจสอบ...';
  try { const j = await api('login', { password: $('pw').value }); TOKEN = j.token; ss.set('hub-admin', TOKEN); await enter(); }
  catch(e){ $('loginErr').textContent = e.message; }
  b.disabled = false; b.textContent = 'เข้าสู่ระบบ';
}

  ov.innerHTML = `<div class="dlg sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h3>${esc(title)}</h3><button class="x" data-close type="button" aria-label="ปิด"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sbody" id="sheetBody">${html}</div></div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeSheet(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  return $('sheetBody');
}
function closeSheet(){ const p = $('pickOv'); if (p) p.remove(); const o = $('sheet'); if (o) o.remove(); document.body.style.overflow = ''; }
window.addEventListener('keydown', e => { if (e.key !== 'Escape') return; const p = $('pickOv'); if (p) return p.remove(); if (!document.querySelector('.ov:not(#sheet)')) closeSheet(); });
function ask(o){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov'; ov.style.zIndex = 30;
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" style="margin:16px"><h3>${esc(o.title)}</h3><p>${esc(o.body || '')}</p>${o.input !== undefined ? `<input id="dlgIn" value="${esc(o.input)}">` : ''}<div class="btns"><button class="ghost" data-x="0" type="button">ยกเลิก</button><button class="${o.danger ? 'dangerbtn' : 'pri'}" data-x="1" type="button" style="min-height:48px">${esc(o.ok || 'ตกลง')}</button></div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('#dlgIn'); (inp || ov.querySelector('[data-x="1"]')).focus();
    const done = v => { ov.remove(); res(v); };
    ov.addEventListener('click', e => { if (e.target === ov) done(null); const x = e.target.closest('[data-x]'); if (x) done(x.dataset.x === '1' ? (inp ? inp.value.trim() : true) : null); });
    ov.addEventListener('keydown', e => { if (e.key === 'Escape') done(null); if (e.key === 'Enter' && inp) done(inp.value.trim()); });
  });
}

function pickPopup(onSel, onNew){
  const old = $('pickOv'); if (old) old.remove();

  const grid = q => { q = String(q || '').trim().toLowerCase(); const l = SUBJECTS.filter(s => !q || (s.name + ' ' + (s.code || '')).toLowerCase().includes(q)); return (q ? '' : newCard) + (l.map(cardHtml).join('') || '<div class="hint" style="grid-column:1/-1;text-align:center">ไม่พบวิชา</div>'); };

  ov.addEventListener('mousedown', e => { if (e.target === ov) ov.remove(); });
  ov.addEventListener('input', e => { if (e.target.id === 'pq') $('pg').innerHTML = grid(e.target.value); });
  ov.addEventListener('click', e => {
    if (e.target.closest('[data-pclose]')) return ov.remove();

  });

}

const toB64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

function renameDlg(file){
  return new Promise(res => {

      <div class="rn"><button class="ghost" id="rnMinus" type="button" aria-label="ลดเลข">−</button><input id="rnNum" inputmode="numeric" maxlength="3" placeholder="01" autocomplete="off" value="${esc(num0)}"><button class="ghost" id="rnPlus" type="button" aria-label="เพิ่มเลข">+</button></div>
      <label for="rnName" style="margin-top:12px">ชื่อไฟล์ (ไม่ต้องพิมพ์ .html)</label><input id="rnName" autocomplete="off" value="${esc(base0)}">
      <div class="rn-pv" id="rnPv"></div>
      <div class="btns"><button class="ghost" data-x="0" type="button">ยกเลิก</button><button class="pri" data-x="1" type="button" style="min-height:48px">บันทึกชื่อ</button></div></div>`;
    document.body.appendChild(ov);
    const num = ov.querySelector('#rnNum'), nm = ov.querySelector('#rnName'), pv = ov.querySelector('#rnPv');
    const pad = n => String(n).padStart(2, '0');
    const build = () => { let n = num.value.replace(/\D/g, '').slice(0, 3); if (n.length === 1) n = '0' + n; const b = nm.value.trim().replace(/\.html?$/i, ''); return (n && b ? n + '-' + b : (n || b)) + ((n || b) ? '.html' : ''); };
    const paint = () => { pv.innerHTML = 'ชื่อใหม่: <b>' + (esc(build()) || '—') + '</b>'; };
    num.oninput = () => { num.value = num.value.replace(/\D/g, '').slice(0, 3); paint(); }; nm.oninput = paint;
    ov.querySelector('#rnMinus').onclick = () => { const v = num.value === '' ? 1 : +num.value; num.value = pad(Math.max(0, v - 1)); paint(); };
    ov.querySelector('#rnPlus').onclick = () => { const v = num.value === '' ? 0 : +num.value; num.value = pad(Math.min(999, v + 1)); paint(); };
    paint(); nm.focus();

  $('edBack').onclick = async () => { if (FM.dirty && !(await ask({ title: 'ยังไม่ได้บันทึก', body: 'ออกโดยไม่บันทึกการแก้ไข?', ok: 'ออกเลย', danger: true }))) return; FM.dirty = false; if (window.__edMsg) { window.removeEventListener('message', window.__edMsg); window.__edMsg = null; } fmHome(); fmList(); fmTimes(); };
}

/* ---------- สำรอง / กู้คืนทั้งระบบ ---------- */
let BK = { items: [], from: 'home' };
function backupSheet(){ FM.dirty = false; FM.box = openSheet('สำรอง / กู้คืนข้อมูล', '<div id="fmMain"></div>'); BK.from = 'home'; fmBackup(); }
function fmBackup(){
  FM.dirty = false;
  FM.box.innerHTML = `${BK.from === 'files' ? `<div class="ed-head" style="position:static"><button class="ghost" id="bkBack" type="button" style="min-height:42px" aria-label="กลับ">${ICO.back}</button><span class="nm" style="direction:ltr">จัดการไฟล์</span></div>` : ''}
    <div class="bk-new"><div class="field"><label for="bkName">ตั้งชื่อชุดสำรอง</label><input id="bkName" maxlength="80" placeholder="เช่น ก่อนแก้หน้าแรก" autocomplete="off"></div>
    <button class="pri" id="bkSave" type="button">${ICO.save}บันทึกสำรองตอนนี้</button></div>
    <div class="hint">สำรองทั้งระบบ: ทุกโฟลเดอร์ ทุกไฟล์ในโปรเจกต์ (บทเรียน หน้าเว็บ ไฟล์ api ฯลฯ) เก็บได้หลายชุด ชื่อซ้ำกันได้</div>
    <h2 class="bk-h">ชุดที่บันทึกไว้</h2><div class="bk-list" id="bkList"><div class="empty">กำลังโหลดรายการ…</div></div><div id="fmOut"></div>`;
  if ($('bkBack')) $('bkBack').onclick = () => { fmHome(); fmList(); fmLoad(); };
  $('bkSave').onclick = bkSave; $('bkName').onkeydown = e => { if (e.key === 'Enter') bkSave(); };
  $('bkList').onclick = bkClick; bkLoad();
}
function bkRender(){
  const o = $('bkList'); if (!o) return;
  o.innerHTML = BK.items.length ? BK.items.map(x => { const t = Date.parse(x.date); return `<div class="bk-r"><div class="t"><b>${esc(x.name)}</b><small>${t ? rel(t) + ' · ' + absTime(t) : ''}</small></div><button class="ghost" data-bl="${esc(x.id)}" type="button">โหลด</button><button class="dangerbtn" data-bd="${esc(x.id)}" type="button">ลบ</button></div>`; }).join('')
    : '<div class="empty">ยังไม่มีชุดสำรอง<br>ตั้งชื่อแล้วกด “บันทึกสำรองตอนนี้”</div>';
}
async function bkLoad(){
  try { BK.items = (await fapi('backupList')).items; bkRender(); } catch(e){ const o = $('bkList'); if (o) o.innerHTML = ''; fmToast(e.message, true); }
}
async function bkSave(){
  const name = $('bkName').value.trim(); if (!name) { $('bkName').focus(); return fmToast('กรุณาใส่ชื่อก่อนบันทึก', true); }
  const b = $('bkSave'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
  try { await fapi('backupSave', { name }); $('bkName').value = ''; fmToast('บันทึกสำรอง “' + esc(name) + '” แล้ว'); await bkLoad(); }
  catch(e){ fmToast(e.message, true); }
  b.disabled = false; b.innerHTML = ICO.save + 'บันทึกสำรองตอนนี้';
}
async function bkClick(e){
  const l = e.target.closest('[data-bl]'), d = e.target.closest('[data-bd]'), id = (l || d || {}).dataset ? (l ? l.dataset.bl : d.dataset.bd) : ''; if (!id) return;
  const it = BK.items.find(x => x.id === id); if (!it) return;
  if (l) {
    const ok = await ask({ title: 'โหลด “' + it.name + '”?', body: 'ไฟล์ทั้งระบบจะเหมือนตอนที่บันทึกชุดนี้ทุกไฟล์: ไฟล์ที่อยู่ในชุดจะถูกคืนมา ไฟล์ที่ไม่มีในชุดจะถูกลบทิ้ง\n\nระบบจะเก็บสภาพปัจจุบันไว้เป็นชุดสำรอง “ก่อนกู้คืน…” ให้อัตโนมัติ จึงย้อนกลับได้', ok: 'โหลดเลย', danger: true });
    if (!ok) return;
    l.disabled = true; l.textContent = 'กำลังโหลด…';
    try {
      const j = await fapi('backupRestore', { id }); FM.files = []; FM.tm = {};
      const st = j.stat ? `<br>คืนไฟล์ ${j.stat.restored} · ลบไฟล์ที่ไม่มีในชุดนี้ ${j.stat.removed} · ตรงกันอยู่แล้ว ${j.stat.same} (รวม ${j.stat.total} ไฟล์)` : '';
      fmToast(j.verified ? '<b>โหลด “' + esc(it.name) + '” สำเร็จ</b> · ตรวจแล้วระบบตรงกับชุดสำรองทุกไฟล์' + st + '<br>' + DEPLOY : 'โหลดแล้ว แต่ตรวจผลไม่ตรงกับชุดสำรอง — กรุณากดโหลดซ้ำอีกครั้ง', !j.verified); await bkLoad();
    }
    catch(er){ fmToast(er.message, true); l.disabled = false; l.textContent = 'โหลด'; }
  } else {
    const ok = await ask({ title: 'ลบชุดสำรอง?', body: it.name + '\n\nลบแล้วชุดนี้จะใช้โหลดกลับไม่ได้ (ไฟล์จริงในระบบไม่ถูกแตะ)', ok: 'ลบ', danger: true });
    if (!ok) return;
    try { await fapi('backupDelete', { id }); fmToast('ลบชุดสำรองแล้ว'); await bkLoad(); } catch(er){ fmToast(er.message, true); }
  }
}
window.addEventListener('beforeunload', e => { if (FM.dirty) { e.preventDefault(); e.returnValue = ''; } });

document.querySelector('.home').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (!g) return;
  ({ subjects: subjectsSheet, push: pushSheet, files: filesSheet, backup: backupSheet })[g.dataset.go]();
});
/* ติดตั้งเป็นแอปแยก (Hub Admin) */
let installEv = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (!standalone) $('installBtn').classList.remove('hidden');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; });
window.addEventListener('appinstalled', () => { installEv = null; $('installBtn').classList.add('hidden'); });
$('installBtn').onclick = async () => {
  if (installEv) { installEv.prompt(); await installEv.userChoice.catch(() => {}); installEv = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  ask({ title: 'ติดตั้งเป็นแอป “Hub Admin”', body: ios ? 'iPhone/iPad: แตะปุ่มแชร์ (สี่เหลี่ยมมีลูกศรขึ้น) ใน Safari แล้วเลือก “เพิ่มไปยังหน้าจอโฮม”' : 'เปิดเมนูของเบราว์เซอร์ (⋮) แล้วเลือก “ติดตั้งแอป” หรือ “เพิ่มไปยังหน้าจอหลัก”', ok: 'เข้าใจแล้ว' });
};
async function enter(){ await loadSubjects(); showPanel(true); fapi('list').then(r => { FM.files = r.files; fmCacheSave(); }).catch(() => {}); }
(async () => { if (!TOKEN) return; try { await api('check'); await enter(); } catch(e){} })();
</script>
</body>
</html>
