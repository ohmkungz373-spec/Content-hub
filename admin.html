<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard | CONTENT HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b1020;--bg2:#10172b;--panel:#151e36;--panel2:#1c2745;--line:#26335a;
  --ink:#eef2ff;--muted:#8fa0c8;--acc:#8b9bff;--acc2:#5eead4;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;
  --r:16px;color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"IBM Plex Sans Thai",Tahoma,Arial,sans-serif;background:radial-gradient(900px 420px at 80% -10%,#1b2650 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);line-height:1.6;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.2px}
h2{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:20px;flex:none;color:#0b1020}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--acc);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.head .pill{margin-left:auto}
.pill{font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:1px 11px}

label{display:block;font-size:13.5px;color:var(--muted);margin:0 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:48px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #8b9bff30}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:600;transition:transform .1s,opacity .15s,background .15s}
button:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.pri{background:linear-gradient(135deg,#6d7dff,#38c8c0);color:#071022;width:100%;font-size:16px;min-height:56px;border-radius:14px}
.pri:disabled{opacity:.4;cursor:default}
#loginBtn{margin-top:14px;min-height:50px}
.ghost{background:var(--panel2);border:1px solid var(--line);min-height:40px;padding:0 14px;font-size:14px;color:var(--ink)}
.ghost:hover{background:#243158}
.err{color:#fca5a5;font-size:14px;margin-top:10px;min-height:22px}
.hidden{display:none!important}
.pwbox{position:relative}
.pwbox input{padding-right:64px}
.eye{position:absolute;right:6px;top:6px;min-height:36px;padding:0 10px;background:none;color:var(--muted);font-size:13px}

.login{margin-top:12vh}
.login .brand{margin-bottom:22px}

/* chapter list */
.chs{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.chs .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chs .row:last-child{border-bottom:0}
.chs .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12.5px;font-weight:600;display:grid;place-items:center}
.chs .tx{flex:1;min-width:0}
.chs .tt{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chs .ff{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chs .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.del{flex:none;background:transparent;color:#fca5a5;border:1px solid #f8717144;min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.del:hover{background:#f8717120}

/* dropzone */
.pick{display:block;text-align:center;padding:26px 14px;border:2px dashed #3a4a80;border-radius:14px;background:var(--bg2);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover,.pick.drag{border-color:var(--acc2);background:#5eead414}
.pick .ic{display:block;font-size:26px;line-height:1;margin-bottom:8px;color:var(--acc2)}
.pick b{display:block;font-size:15px;font-weight:600}
.pick span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pick input{display:none}

.fl{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px;margin-top:10px;background:var(--bg2)}
.fl input{min-height:42px;padding-right:44px;font-size:14px}
.fl .t{font-size:13px;color:var(--muted);margin-top:8px;word-break:break-word}
.fl .t b{color:var(--ink);font-weight:600}
.rm{position:absolute;right:16px;top:16px;background:none;color:var(--muted);min-height:34px;width:34px;padding:0;font-size:20px;line-height:1;border-radius:8px}
.rm:hover{background:var(--panel2);color:var(--ink)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;margin-top:8px;font-weight:600}
.tag.new{background:#4ade8022;color:var(--ok)}.tag.over{background:#fbbf2420;color:var(--warn)}.tag.warn{background:#f8717122;color:#fca5a5}

.msg{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.msg.ok{background:#4ade8018;border:1px solid #4ade8055;color:#bbf7d0}
.msg.bad{background:#f8717118;border:1px solid #f8717155;color:#fecaca}
.hint{font-size:13px;color:var(--muted);margin-top:10px}


/* subject chips + tabs */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#0b1020}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:4px 0 16px}
.tab{min-height:44px;background:none;color:var(--muted);border-radius:10px;font-size:15px}
.tab[aria-selected=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tab .pill{margin-left:6px;padding:0 8px;font-size:12px}
/* manage list */
.tools{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tools .ghost{min-height:36px;font-size:13.5px}
.tools .sel{margin-left:auto;font-size:13.5px;color:var(--muted)}
.chs .row{cursor:pointer}
.chs .row.on{background:#8b9bff1c}
.ck{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #3a4a80;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700}
.row.on .ck{background:var(--acc);border-color:var(--acc);color:#0b1020}
.edit{flex:none;background:var(--panel2);border:1px solid var(--line);min-height:36px;padding:0 12px;font-size:13px;border-radius:10px;color:var(--ink)}
.dangerbtn{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;width:100%;font-size:15.5px}
/* header + subject picker */
.top .brand{min-width:0}
.top h1{font-size:19px;white-space:nowrap}
.top .sub{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .acts{display:flex;gap:8px;flex:none}
.ghost{white-space:nowrap}
.ic{width:44px;min-height:44px;padding:0;font-size:21px;line-height:1}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.cur{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:62px;margin-bottom:12px}
.cur .tx{flex:1;min-width:0}
.cur small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.cur b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cur .chg{flex:none;color:var(--acc);font-size:13.5px}
.cur i,.gh i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.grp{margin-bottom:18px}.grp:last-child{margin-bottom:0}
.gh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:8px}
.gh span{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted)}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb{text-align:left;min-height:60px;padding:8px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--c);color:var(--ink);font-size:14px;line-height:1.35}
.sb small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.sb[aria-pressed=true]{background:var(--panel2);border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
/* dialog */
.ov{position:fixed;inset:0;background:#050810cc;display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.dlg{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:env(safe-area-inset-bottom,0px)}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14px;word-break:break-word;white-space:pre-line}
.dlg .btns{display:flex;gap:10px;margin-top:14px}
.dlg .btns button{flex:1}
@media (min-width:600px){.ov{align-items:center}}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:5}
.bar .in{max-width:620px;margin:0 auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px 14px;min-height:140px;border-radius:18px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;color:var(--ink)}
.act::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.act .ai{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 20%,transparent)}
.act b{font-size:16px;margin-top:4px}.act small{color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.4}
.act:hover{background:var(--panel2)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}.st b{display:block;font-size:22px}.st small{color:var(--muted);font-size:12.5px}
.sheet{max-width:520px;max-height:90dvh;overflow:auto;padding:0;border-radius:22px 22px 0 0;margin-bottom:0}
.ov{padding:0}
.sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 18px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.sh h3{margin:0;flex:1;font-size:18px}
.x{min-height:40px;width:40px;padding:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.sbody{padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.field{margin-bottom:12px}
.chk{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer;margin:12px 0;font-size:14.5px;color:var(--ink)}
.chk input{width:20px;height:20px;min-height:0;accent-color:#6d7dff;flex:none}
.tpl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 96px;gap:10px}
.sheet .chs{max-height:42dvh}
.sticky{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(to top,var(--panel) 70%,transparent)}
.sheet .cur{margin-bottom:12px}.sheet .grp .subs{grid-template-columns:1fr 1fr}
.sheet #picker{border:0;padding:0;background:none;margin-bottom:12px}
@media (min-width:600px){.sheet{border-radius:22px}.ov{align-items:center;padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView" class="login">
    <div class="brand"><div class="logo" aria-hidden="true">🔒</div><div><h1>Admin Dashboard</h1><p class="sub">เข้าสู่ระบบเพื่อจัดการเว็บ</p></div></div>
    <div class="card">
      <label for="pw">รหัสผ่าน</label>
      <div class="pwbox"><input id="pw" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน"><button class="eye" id="eye" type="button">แสดง</button></div>
      <button class="pri" id="loginBtn" type="button">เข้าสู่ระบบ</button>
      <div class="err" id="loginErr" role="alert"></div>
    </div>
  </div>

  <div id="panelView" class="hidden">
    <div class="top">
      <div class="brand"><div class="logo" aria-hidden="true">🛠</div><div><h1>Admin Dashboard</h1><p class="sub">เลือกสิ่งที่อยากทำ</p></div></div>
      <div class="acts"><button class="ghost" id="logoutBtn" type="button">ออกจากระบบ</button></div>
    </div>
    <div class="stats"><div class="st"><b id="nSub">0</b><small>วิชาทั้งหมด</small></div><div class="st"><b id="nCh">0</b><small>บทเรียนทั้งหมด</small></div></div>
    <div class="home">
      <button class="act" data-go="subject" style="--c:#a78bfa" type="button"><span class="ai">📚</span><b>เพิ่มวิชา</b><small>สร้างวิชาใหม่ พร้อมแจ้งเตือนผู้ใช้</small></button>
      <button class="act" data-go="lesson" style="--c:#4ade80" type="button"><span class="ai">📄</span><b>เพิ่มบทเรียน</b><small>อัปโหลดไฟล์ .html เข้าวิชา</small></button>
      <button class="act" data-go="manage" style="--c:#fbbf24" type="button"><span class="ai">🗂</span><b>จัดการบทเรียน</b><small>แก้ชื่อ · ลบ · รีเฟรชรายการ</small></button>
      <button class="act" data-go="push" style="--c:#38bdf8" type="button"><span class="ai">🔔</span><b>ส่งแจ้งเตือน</b><small>วิชาใหม่ · การบ้าน · ข้อความอิสระ</small></button>
    </div>
    <div id="status" role="status"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ss = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, del(k){ try { sessionStorage.removeItem(k); } catch(e){} } };
let TOKEN = ss.get('hub-admin') || '', SUBJECTS = [], FILES = [], CUR = '', SEL = new Set();
const FILE_RE = /^[^\\/:*?"<>|\u0000-\u001f]{1,100}\.html$/i;
const okMsg = (t, extra) => `<div class="msg ok">${t}${extra ? '<br>' + extra : ''}</div>`, badMsg = t => `<div class="msg bad">${esc(t)}</div>`;
const DEPLOY = 'เว็บกำลัง deploy ใหม่ ประมาณ 1 นาที';

async function api(action, data){
  let r, j;
  try { r = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({action, token: TOKEN}, data || {})) }); }
  catch(e){ throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
  try { j = await r.json(); } catch(e){ throw new Error('ใช้งานได้เฉพาะบน Vercel (ไม่มี /api/admin ในโหมดรันเครื่อง)'); }
  if (r.status === 401 && action !== 'login') { logout(); throw new Error(j.error || 'หมดเวลาการเข้าสู่ระบบ'); }
  if (!r.ok) throw new Error(j.error || ('เกิดข้อผิดพลาด ' + r.status));
  return j;
}
async function sendPush(title, message, url){
  const r = await fetch('/api/push-send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: TOKEN, title, message, url: url || '/' }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error(j.error || 'หมดเวลา'); }
  if (!r.ok) throw new Error(j.error || ('เกิดข้อผิดพลาด ' + r.status));
  return j;
}
const pushRes = j => `ส่งแจ้งเตือนแล้ว ${j.sent}/${j.total} เครื่อง` + (j.failed ? ` · ล้มเหลว ${j.failed}` : '');

function showPanel(on){ $('loginView').classList.toggle('hidden', on); $('panelView').classList.toggle('hidden', !on); }
function logout(){ TOKEN = ''; SEL.clear(); closeSheet(); ss.del('hub-admin'); showPanel(false); $('pw').value = ''; }
async function login(){
  const b = $('loginBtn'); $('loginErr').textContent = ''; b.disabled = true; b.textContent = 'กำลังตรวจสอบ...';
  try { const j = await api('login', { password: $('pw').value }); TOKEN = j.token; ss.set('hub-admin', TOKEN); await enter(); }
  catch(e){ $('loginErr').textContent = e.message; }
  b.disabled = false; b.textContent = 'เข้าสู่ระบบ';
}
$('loginBtn').onclick = login; $('logoutBtn').onclick = logout;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('eye').onclick = () => { const p = $('pw'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('eye').textContent = show ? 'ซ่อน' : 'แสดง'; };

/* ---------- ป็อปอัพ ---------- */
function openSheet(title, html){
  closeSheet();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'sheet';
  ov.innerHTML = `<div class="dlg sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h3>${esc(title)}</h3><button class="x" data-close type="button" aria-label="ปิด">✕</button></div><div class="sbody" id="sheetBody">${html}</div></div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeSheet(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  return $('sheetBody');
}
function closeSheet(){ const o = $('sheet'); if (o) o.remove(); document.body.style.overflow = ''; }
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('.ov:not(#sheet)')) closeSheet(); });
function ask(o){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov'; ov.style.zIndex = 30;
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" style="margin:16px"><h3>${esc(o.title)}</h3><p>${esc(o.body || '')}</p>${o.input !== undefined ? `<input id="dlgIn" value="${esc(o.input)}">` : ''}<div class="btns"><button class="ghost" data-x="0" type="button">ยกเลิก</button><button class="${o.danger ? 'dangerbtn' : 'pri'}" data-x="1" type="button" style="min-height:48px">${esc(o.ok || 'ตกลง')}</button></div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('#dlgIn'); (inp || ov.querySelector('[data-x="1"]')).focus();
    const done = v => { ov.remove(); res(v); };
    ov.addEventListener('click', e => { if (e.target === ov) done(null); const x = e.target.closest('[data-x]'); if (x) done(x.dataset.x === '1' ? (inp ? inp.value.trim() : true) : null); });
    ov.addEventListener('keydown', e => { if (e.key === 'Escape') done(null); if (e.key === 'Enter' && inp) done(inp.value.trim()); });
  });
}

/* ---------- วิชา ---------- */
const CATS = [
  {name:'ภาษา', color:'#f59e0b', test:c => 'ทอ'.includes(c)},
  {name:'คณิตศาสตร์', color:'#a78bfa', test:c => c === 'ค'},
  {name:'วิทยาศาสตร์', color:'#22c55e', test:c => c === 'ว'},
  {name:'สังคม', color:'#f97316', test:c => c === 'ส'},
  {name:'สุขภาพ/ศิลปะ/การงาน', color:'#ec4899', test:c => 'พศง'.includes(c)}
];
const catOf = s => CATS.find(c => c.test((s.code || '')[0] || '')) || CATS[CATS.length - 1];
const curSubject = () => SUBJECTS.find(s => s.id === CUR);
async function loadSubjects(){
  const d = await (await fetch('/subjects.json?t=' + Date.now(), { cache:'no-store' })).json();
  SUBJECTS = d.subjects || [];
  if (!SUBJECTS.some(s => s.id === CUR)) CUR = '';
  $('nSub').textContent = SUBJECTS.length; $('nCh').textContent = SUBJECTS.reduce((n, s) => n + s.chapters.length, 0);
}
function pickerHtml(){
  return CATS.map(c => {
    const l = SUBJECTS.filter(s => catOf(s) === c); if (!l.length) return '';
    return `<div class="grp" style="--c:${c.color}"><div class="gh"><i></i>${esc(c.name)}<span>${l.length} วิชา</span></div><div class="subs">${l.map(s => `<button class="sb" data-sid="${esc(s.id)}" aria-pressed="${s.id === CUR}" type="button">${s.code ? `<small>${esc(s.code)}</small>` : ''}${esc(s.name)}</button>`).join('')}</div></div>`;
  }).join('') || '<div class="hint" style="text-align:center">ยังไม่มีวิชา — กด “เพิ่มวิชา” ก่อน</div>';
}
/* แถบเลือกวิชาในป็อปอัพ: กดแล้วขยายรายการ เลือกแล้วพับ แล้วเรียก onPick */
function subjectBar(root, onPick){
  const bar = document.createElement('div');
  bar.innerHTML = '<button class="cur" type="button" aria-expanded="false"></button><div class="card hidden" id="picker"></div>';
  root.prepend(bar);
  const btn = bar.querySelector('.cur'), pk = bar.querySelector('#picker'); let open = !CUR;
  const paint = () => {
    const c = curSubject();
    btn.setAttribute('aria-expanded', open); btn.style.setProperty('--c', c ? catOf(c).color : 'var(--muted)');
    btn.innerHTML = c ? `<i></i><div class="tx"><small>วิชา</small><b>${esc((c.code ? c.code + ' · ' : '') + c.name)}</b></div><span class="chg">${open ? 'ปิด ▴' : 'เปลี่ยน ▾'}</span>` : '<div class="tx"><b>เลือกวิชา ▾</b></div>';
    pk.classList.toggle('hidden', !open); if (open) pk.innerHTML = pickerHtml();
  };
  btn.onclick = () => { open = !open; paint(); };
  pk.addEventListener('click', e => { const b = e.target.closest('[data-sid]'); if (!b) return; CUR = b.dataset.sid; open = false; paint(); onPick(); });
  paint(); return paint;
}

/* ---------- 1) เพิ่มวิชา ---------- */
const slug = s => (String(s).toLowerCase().match(/[a-z0-9]+/g) || []).join('-').slice(0, 40);
function subjectSheet(){
  const b = openSheet('เพิ่มวิชา', `
    <div class="field"><label for="fName">ชื่อวิชา *</label><input id="fName" maxlength="80" placeholder="เช่น ฟิสิกส์ 2"></div>
    <div class="row2 field"><div><label for="fCode">รหัสวิชา</label><input id="fCode" maxlength="20" placeholder="เช่น ว31201"></div><div><label for="fIcon">ไอคอน</label><input id="fIcon" maxlength="4" value="📖" style="text-align:center;font-size:22px"></div></div>
    <div class="field"><label for="fId">ชื่อโฟลเดอร์ (อังกฤษ — เว้นว่างให้ตั้งอัตโนมัติ)</label><input id="fId" maxlength="60" placeholder="เช่น physics-2" autocapitalize="none"></div>
    <label class="chk"><input type="checkbox" id="fNotify" checked><span>แจ้งเตือนผู้ใช้ว่ามีวิชาใหม่</span></label>
    <button class="pri" id="fGo" type="button">สร้างวิชา</button><div id="fOut"></div>`);
  $('fGo').onclick = async () => {
    const name = $('fName').value.trim(); if (!name) { $('fName').focus(); return; }
    const code = $('fCode').value.trim(), id = ($('fId').value.trim() || slug(code + ' ' + name) || 'subject-' + Date.now().toString(36)).toLowerCase();
    const order = SUBJECTS.reduce((m, s) => s.order < 999 ? Math.max(m, s.order) : m, 0) + 1;
    const g = $('fGo'); g.disabled = true; g.textContent = 'กำลังสร้าง...'; $('fOut').innerHTML = '';
    try {
      const j = await api('addSubject', { id, name, code, icon: $('fIcon').value.trim() || '📖', order });
      let note = DEPLOY + ' แล้ววิชาจะขึ้น';
      if ($('fNotify').checked) { try { note = pushRes(await sendPush('มีวิชาใหม่: ' + name, 'เข้าไปดูเนื้อหาวิชาใหม่ได้เลย', '/')) + '<br>' + note; } catch(e){ note = 'ส่งแจ้งเตือนไม่สำเร็จ: ' + esc(e.message) + '<br>' + note; } }
      $('fOut').innerHTML = okMsg(`สร้างวิชา “${esc(name)}” แล้ว (commit ${esc(j.commit)})`, note);
      g.textContent = 'เสร็จแล้ว'; setTimeout(() => loadSubjects().catch(() => {}), 70000);
    } catch(e){ $('fOut').innerHTML = badMsg(e.message); g.disabled = false; g.textContent = 'สร้างวิชา'; }
  };
}

/* ---------- 2) เพิ่มบทเรียน ---------- */
function lessonSheet(){
  FILES = [];
  const b = openSheet('เพิ่มบทเรียน', `
    <label class="pick" id="drop"><span class="ic" aria-hidden="true">＋</span><b>แตะเพื่อเลือกไฟล์ .html</b><span>เลือกได้หลายไฟล์ หรือลากมาวางที่นี่</span><input id="file" type="file" accept=".html,text/html" multiple></label>
    <div id="fileList"></div>
    <div class="hint">ชื่อไฟล์ซ้ำจะถูกเขียนทับ · ชื่อบทดึงจากแท็ก &lt;title&gt; · ขึ้นต้นชื่อไฟล์ด้วยเลขเพื่อกำหนดลำดับ</div>
    <label class="chk"><input type="checkbox" id="fNotify"><span>แจ้งเตือนผู้ใช้ว่ามีบทเรียนใหม่</span></label>
    <div class="sticky"><button class="pri" id="upBtn" type="button">เลือกไฟล์ .html</button></div><div id="fOut"></div>`);
  subjectBar(b, renderFiles);
  $('file').addEventListener('change', async e => { await addFiles(e.target.files); e.target.value = ''; });
  const d = $('drop');
  ['dragenter','dragover'].forEach(t => d.addEventListener(t, e => { e.preventDefault(); d.classList.add('drag'); }));
  ['dragleave','drop'].forEach(t => d.addEventListener(t, e => { e.preventDefault(); d.classList.remove('drag'); }));
  d.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  $('fileList').addEventListener('click', e => { const x = e.target.closest('[data-rm]'); if (x) { FILES.splice(+x.dataset.rm, 1); renderFiles(); } });
  $('fileList').addEventListener('input', e => { const i = e.target.dataset && e.target.dataset.name; if (i === undefined) return; FILES[+i].name = e.target.value.trim(); const pos = e.target.selectionStart; renderFiles(); const n = document.querySelector(`[data-name="${i}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(_){} } });
  $('upBtn').onclick = doUpload; renderFiles();
}
function renderFiles(){
  if (!$('fileList')) return;
  const s = curSubject(), have = new Set((s ? s.chapters : []).map(c => c.file.toLowerCase())), names = FILES.map(f => f.name.toLowerCase());
  $('fileList').innerHTML = FILES.map((f, i) => {
    const bad = !FILE_RE.test(f.name) || /^[._]/.test(f.name) || names.indexOf(f.name.toLowerCase()) !== i;
    const tag = bad ? '<span class="tag warn">ชื่อไฟล์ไม่ถูกต้องหรือซ้ำ</span>' : have.has(f.name.toLowerCase()) ? '<span class="tag over">จะเขียนทับไฟล์เดิม</span>' : '<span class="tag new">บทใหม่</span>';
    return `<div class="fl"><button class="rm" data-rm="${i}" type="button" aria-label="เอาออก">×</button><input data-name="${i}" value="${esc(f.name)}" aria-label="ชื่อไฟล์"><div class="t">ชื่อบท: <b>${f.title ? esc(f.title) : '(ไม่พบ &lt;title&gt; จะใช้ชื่อไฟล์แทน)'}</b> · ${(f.size / 1024).toFixed(0)} KB</div>${tag}</div>`;
  }).join('');
  const ok = FILES.length && FILES.every((f, i) => FILE_RE.test(f.name) && !/^[._]/.test(f.name) && names.indexOf(f.name.toLowerCase()) === i);
  $('upBtn').disabled = FILES.length ? (!ok || !s) : false;
  $('upBtn').textContent = FILES.length ? (s ? `อัปโหลด ${FILES.length} ไฟล์เข้า “${s.name}”` : 'เลือกวิชาก่อน') : 'เลือกไฟล์ .html';
}
const toB64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
function titleOf(buf){ try { const t = new TextDecoder('utf-8').decode(buf).replace(/<!--[\s\S]*?-->/g, '').match(/<title>([\s\S]*?)<\/title>/i); return t ? t[1].replace(/\s+/g, ' ').trim().split('|')[0].trim() : ''; } catch(e){ return ''; } }
async function addFiles(list){
  for (const f of list) {
    if (!/\.html?$/i.test(f.name)) continue;
    const buf = await f.arrayBuffer(), name = f.name.replace(/\.htm$/i, '.html');
    FILES = FILES.filter(x => x.name.toLowerCase() !== name.toLowerCase());
    FILES.push({ name, b64: toB64(buf), size: buf.byteLength, title: titleOf(buf) });
  }
  renderFiles();
}
async function doUpload(){
  const s = curSubject(); if (!FILES.length) return $('file').click(); if (!s) return;
  if (FILES.reduce((a, f) => a + f.size, 0) > 3 * 1024 * 1024) { $('fOut').innerHTML = badMsg('ไฟล์รวมใหญ่เกิน 3 MB ให้แบ่งอัปโหลดทีละชุด'); return; }
  const b = $('upBtn'); b.disabled = true; b.textContent = 'กำลังอัปโหลด...'; $('fOut').innerHTML = '';
  const titles = FILES.map(f => f.title || f.name.replace(/\.html$/i, ''));
  try {
    const j = await api('upload', { subject: s.id, files: FILES.map(f => ({ name: f.name, b64: f.b64 })) });
    let note = DEPLOY + ' แล้วบทเรียนจะขึ้น';
    if ($('fNotify').checked) { try { note = pushRes(await sendPush('มีบทเรียนใหม่: ' + s.name, titles.slice(0, 3).join(', ') + (titles.length > 3 ? ` และอีก ${titles.length - 3} บท` : ''), '/')) + '<br>' + note; } catch(e){ note = 'ส่งแจ้งเตือนไม่สำเร็จ: ' + esc(e.message) + '<br>' + note; } }
    $('fOut').innerHTML = okMsg(`อัปโหลด ${j.count} ไฟล์สำเร็จ (commit ${esc(j.commit)})`, note);
    FILES = []; renderFiles(); $('upBtn').textContent = 'เสร็จแล้ว'; $('upBtn').disabled = true; setTimeout(() => loadSubjects().catch(() => {}), 70000);
  } catch(e){ $('fOut').innerHTML = badMsg(e.message); renderFiles(); }
}

/* ---------- 3) จัดการบทเรียน (มีปุ่มรีเฟรชอยู่ที่นี่) ---------- */
function manageSheet(){
  SEL.clear();
  const b = openSheet('จัดการบทเรียน', `
    <div class="tools"><button class="ghost" id="selAll" type="button">เลือกทั้งหมด</button><button class="ghost" id="refBtn" type="button">↻ รีเฟรชรายการ</button><span class="sel" id="selInfo"></span></div>
    <div class="chs" id="chs"></div>
    <div class="hint">แตะที่บทเพื่อเลือกหลายบท แล้วกดลบ · ปุ่ม “แก้ชื่อ” ใช้เปลี่ยนชื่อไฟล์ (ลำดับบทเรียงตามชื่อไฟล์)</div>
    <div class="sticky"><button class="pri dangerbtn hidden" id="delBtn" type="button">ลบที่เลือก</button></div><div id="fOut"></div>`);
  subjectBar(b, () => { SEL.clear(); renderChs(); });
  $('selAll').onclick = () => { const s = curSubject(), l = s ? s.chapters : []; if (SEL.size === l.length) SEL.clear(); else l.forEach(c => SEL.add(c.file)); renderChs(); };
  $('refBtn').onclick = async () => {
    const r = $('refBtn'); r.disabled = true; r.textContent = '↻ กำลังโหลด...';
    try { await loadSubjects(); renderChs(); $('fOut').innerHTML = okMsg('อัปเดตรายการบทแล้ว'); setTimeout(() => { if ($('fOut')) $('fOut').innerHTML = ''; }, 2200); }
    catch(e){ $('fOut').innerHTML = badMsg('รีเฟรชไม่สำเร็จ ลองใหม่อีกครั้ง'); }
    r.disabled = false; r.textContent = '↻ รีเฟรชรายการ';
  };
  $('chs').addEventListener('click', onChsClick); $('delBtn').onclick = doDelete; renderChs();
}
function renderChs(){
  if (!$('chs')) return;
  const s = curSubject(), list = s ? s.chapters : [];
  SEL = new Set([...SEL].filter(f => list.some(c => c.file === f)));
  $('chs').innerHTML = !s ? '<div class="empty">เลือกวิชาด้านบนก่อน</div>' : list.length ? list.map((c, i) => `<div class="row${SEL.has(c.file) ? ' on' : ''}" data-i="${i}"><span class="ck" aria-hidden="true">✓</span><span class="n">${i + 1}</span><div class="tx" title="${esc(c.file)}"><div class="tt">${esc(c.title)}</div><div class="ff">${esc(c.file)}</div></div><button class="edit" data-edit="${i}" type="button">แก้ชื่อ</button></div>`).join('') : '<div class="empty">ยังไม่มีบทเรียนในวิชานี้<br>กลับไปกด “เพิ่มบทเรียน” เพื่อเพิ่ม</div>';
  $('selInfo').textContent = SEL.size ? `เลือก ${SEL.size}/${list.length}` : '';
  $('selAll').textContent = list.length && SEL.size === list.length ? 'ยกเลิกทั้งหมด' : 'เลือกทั้งหมด'; $('selAll').classList.toggle('hidden', !list.length);
  $('delBtn').classList.toggle('hidden', !SEL.size); $('delBtn').textContent = `ลบที่เลือก (${SEL.size} บท)`;
}
async function onChsClick(e){
  const s = curSubject(); if (!s) return;
  const ed = e.target.closest('[data-edit]');
  if (ed) {
    const c = s.chapters[+ed.dataset.edit]; if (!c) return;
    const nn = await ask({ title: 'แก้ชื่อไฟล์', body: `ชื่อเดิม: ${c.file}\nขึ้นต้นด้วยตัวเลขเพื่อกำหนดลำดับ เช่น 05-เรื่องใหม่.html`, input: c.file, ok: 'บันทึกชื่อ' });
    if (nn === null || nn === c.file) return;
    if (!FILE_RE.test(nn) || /^[._]/.test(nn) || s.chapters.some(x => x !== c && x.file.toLowerCase() === nn.toLowerCase())) { $('fOut').innerHTML = badMsg('ชื่อไฟล์ไม่ถูกต้องหรือซ้ำกับบทอื่น (ต้องลงท้าย .html)'); return; }
    try {
      const j = await api('rename', { subject: s.id, from: c.file, to: nn });
      c.file = nn; s.chapters.sort((a, b) => a.file.localeCompare(b.file, 'th', { numeric:true })); SEL.clear(); renderChs();
      $('fOut').innerHTML = okMsg(`เปลี่ยนชื่อเป็น ${esc(nn)} แล้ว${j && j.commit ? ' (commit ' + esc(j.commit) + ')' : ''}`, DEPLOY);
    } catch(err){ if ($('fOut')) $('fOut').innerHTML = badMsg(err.message); }
    return;
  }
  const row = e.target.closest('[data-i]'); if (!row) return;
  const c = s.chapters[+row.dataset.i]; if (!c) return;
  SEL.has(c.file) ? SEL.delete(c.file) : SEL.add(c.file); renderChs();
}
async function doDelete(){
  const s = curSubject(), files = [...SEL]; if (!s || !files.length) return;
  const ok = await ask({ title: `ลบ ${files.length} บท?`, body: files.map(f => '• ' + f).join('\n') + `\n\nจากวิชา ${s.name} · ลบแล้วกู้คืนผ่านหน้านี้ไม่ได้`, ok: 'ลบเลย', danger: true });
  if (!ok) return;
  const b = $('delBtn'); b.disabled = true; b.textContent = 'กำลังลบ...';
  try {
    const j = await api('delete', { subject: s.id, files });
    s.chapters = s.chapters.filter(c => !files.includes(c.file)); SEL.clear(); renderChs();
    $('fOut').innerHTML = okMsg(`ลบ ${files.length} บทแล้ว (commit ${esc(j.commit)})`, DEPLOY + ' บทจะหายจากหน้าเว็บ');
  } catch(err){ if ($('fOut')) $('fOut').innerHTML = badMsg(err.message); }
  if ($('delBtn')) b.disabled = false;
}

/* ---------- 4) ส่งแจ้งเตือน ---------- */
function pushSheet(){
  openSheet('ส่งแจ้งเตือน', `
    <div class="tpl"><button class="ghost" data-t="0" type="button">📚 วิชาใหม่</button><button class="ghost" data-t="1" type="button">📝 การบ้าน</button><button class="ghost" data-t="2" type="button">📢 ทั่วไป</button></div>
    <div class="field"><label for="pTitle">หัวข้อ</label><input id="pTitle" maxlength="100" placeholder="หัวข้อ"></div>
    <div class="field"><label for="pMsg">ข้อความ</label><input id="pMsg" maxlength="500" placeholder="ข้อความ"></div>
    <div class="field"><label for="pUrl">ลิงก์ในเว็บ</label><input id="pUrl" value="/" placeholder="เช่น /"></div>
    <button class="pri" id="pSend" type="button">ส่งแจ้งเตือน</button><div id="fOut"></div>`);
  const T = [['มีวิชาใหม่', 'เข้าไปดูเนื้อหาวิชาใหม่ได้เลย'], ['มีการบ้านใหม่', 'อย่าลืมเข้าไปดูกำหนดส่งการบ้าน'], ['ประกาศ', '']];
  $('sheetBody').addEventListener('click', e => { const t = e.target.closest('[data-t]'); if (!t) return; const v = T[+t.dataset.t]; $('pTitle').value = v[0]; $('pMsg').value = v[1]; $('pMsg').focus(); });
  $('pSend').onclick = async () => {
    const b = $('pSend'); b.disabled = true; b.textContent = 'กำลังส่ง...'; $('fOut').innerHTML = '';
    try {
      const j = await sendPush($('pTitle').value, $('pMsg').value, $('pUrl').value || '/');
      $('fOut').innerHTML = okMsg(pushRes(j) + ` · ลบที่หมดอายุ ${j.removed}`) + (j.failed ? `<div class="msg bad">สาเหตุที่ส่งไม่ผ่าน:<br>${Object.entries(j.reasons || {}).map(([k, v]) => esc(k) + ' × ' + v).join('<br>')}</div>` : '');
    } catch(e){ $('fOut').innerHTML = badMsg(e.message); }
    b.disabled = false; b.textContent = 'ส่งแจ้งเตือน';
  };
}

document.querySelector('.home').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (!g) return;
  ({ subject: subjectSheet, lesson: lessonSheet, manage: manageSheet, push: pushSheet })[g.dataset.go]();
});
async function enter(){ await loadSubjects(); showPanel(true); }
(async () => { if (!TOKEN) return; try { await api('check'); await enter(); } catch(e){} })();
</script>
